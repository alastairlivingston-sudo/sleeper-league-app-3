urt of Plancey for illegal trading activity. The league members were not allowed the opportunity to vote before the trade went through the powers that be at the NFL. The sentence for such activities is 5 weeks taking the 5-7 year old service. However, given his previous, Livingston was sentenced to one years children service duties and he was put on probation for sweetie man duties. \nIn a recent interview with the Fantasy post Livingston stated that he tends to watch the games on his morning commute and not live when the games are on, “I cant possibly be up to watch all the games, the first games start at 6pm english time and I’m normally fast asleep by this time, especially if I have a pitch the next morning”. Unexpectedly this created uproar with the fan base, we spoke to one Eifert, “I just can’t believe we are on auto pilot during all the games on Sunday! What happens if one of our guys get injured, has this been happening since the very beginning? I’m starting to question everything in my life now. Now you are going to tell me WWE is fake!!!”. \nGiven the furore, Livingston provided some clarity over the comments made, “I have ensured via macros on my spreadsheet that it anything was to go wrong whilst I slept that my team will be covered by the algorithm and all will be sorted\". \nLivingstons side had been low on form heading in to his third straight playoffs. So much so his bye week possibilities were almost dead and buried deep in to Sunday night. It has been said that Livingston got his boys in to the changing room and gave them the uncharacteristic hair dryer treatment which sparked the miracle of the bye week. Antonio Brown said, “I have never seen the boss as angry as has on Sunday night, conner literally shat himself”. It now gives Livingston the week off to think about another plancey. \n\nThere have been further issues for the commissioner around certain functions in the league. With new rules being created via the AGM, the commissioner as the leagues representative to the NFL went to discuss inputting a new position to allow for a TE to be used a flex. After the due diligence procedures performed by the NFL legal team, they had discovered the Scottish heritage and decided to screw with Livingston creating an extra position he could not get rid of. This created confusion and outrage in the league especially when Freedman decided to “not realise\" that he had put Valdes Scantling in the extra position in his team only for him to get 1 solitary point. Once the low score had been revealed the Freedman strop ensured he gained league empathy and was able to have the man removed from his score that week. \nIt has not been easy for the commissioner this season but the league have full faith he can get the league running as smoothly as possible once again next season as long as Elly lets. \n\n\n\n*Daniel Polak*\nFor Daniel Polak and the dogs polaks franchise, the target at the beginning of the season was clearly defined. As the leagues Sunderland, the aim was to be in a Miriam dogfight to come good in the Miriam bowl and use Polak’s Miriam bowl expertise to once again rise out of the flames. After 3 weeks, this was all going to plan. The dogs Polaks were sitting pretty at the bottom of the league with a 0-3 record. Then out of nowhere Polaks team exploded starting with the world record score of 197 in week 4. The team then went on a run of 7 wins in their last 10 games of the season to make the playoffs for the first time in franchise history. The streets of Hendon were lined with hundreds of thousands people to commemorate the achievement. Polak has stated, “it’s a weird feeling to finally make the playoffs, the board have always been good to me, there has never been too much pressure to get there, however, now that we are here we are going to give it all we have got”. \nThe board are finally going to see their investment paying off with a playoff appearance and there was even the possibility of a potential bye and before Livingston’s side performed their miracle on the final night of the regular season. Rumors were that Polak had already had the DIY men in to create a commemorative shelf above his marital bed for the Plancey he became that confident. However, he will now have to go the long way round the playoffs and the confidence is slightly lower in the camp. \nThis season Polak has used all the tools at his disposal for wins this season. This includes 11th hour trades to turn a game week on its head, involvement in big four way trades for gameweek victories and even visting Plancey himself on thanksgiving to not only give thanks but to ensure safe passage through the tricky game week. We caught up with Polak, “I do slightly fear for my team, they have given me so much in the regular season and I worry about fatigue. Getting to the playoffs feels like we have won the plancey, I hope they can give me a bit more in the playoffs”. Having been 0-3 and in anticipation of a miriam bowl appearance, Polak and his family had booked a holiday during the playoffs given the expected time off. However, now he will have to remotely coach the team from his holiday and this also puts the team at another disadvantage heading in to the playoffs and he will need all he can get against a strong Sacofsky.. \n\n\n\n*Benjy Levey*\nBenjy Levey has been ripping up the fantasy rule book for 2 years now, but making the playoffs in your first season creates expectations. Dealing with those expectations is what marks the difference between a quality fantasy manager and the duds of the game. Benjy Levey has dealt with the second season pressures in the only way he knows how…autodraft. \nWhen Levey autodrafted in his first season, many critics were quick to point out that this tactic is expected of someone with Levey’s level of experience in the NFL. However, with a season under his belt and a playoff run to boot, it was expected Levey would come in to the draft with a bit more of a plan. \nYet, in his final press conference before the draft, Levey made it clear to his fans, “Listen guys I have 2 or 3 events coming up this weekend, (I cant remember if its 2 or 3), so it looks like im going to be building a shwarma during the draft and therefore, I have made the decision to autodraft again this year”. Needless to say, what occurred after this press conference not even Levey could have predicted. The “Pyongyang autodraft riots of 2018” engulfed North Korea for 6 weeks leaving devastation and ruin. Infighting between Levites, left the nation in disarray as the country was split as to whether to trust Lev or if it was time to get rid of their hero. Despite all this pressure and bloodshed, Lev autodrafted anyway and I don’t even think he could have predicted how well his team would look. With Malcom Gordon and Kerryon Hunt in the backfield Levey flew through the regular season. \nIt has been a year of firsts for Lev, first time finishing with a winning record, first time dipping in to the trading market and first lineup change…though he still hasn’t mastered the waiver wire timings, but its not like its mattered this year as he continues to make a name for himself in the league. After his award winning first book came out last year, Lev has recently brought out a new book given his success in this years regular season, “If you want to win your fantasy league…fill your bench with Tight Ends”. Bizzare as it may seem, the players in Fantasy’s most difficult position have found a home on Levey’s roster, which just adds to the conundrum that is Levey and his management style. \nWe caught up with the head of the Levites supporters association in North Korea, Longdong, “It has been a whirlwind season, sometimes you look at Levey’s decisions and style and wonder if it is one day going to all collapse or he is just going against the grain and is a fantasy genius. I have to say when we had our RB’s on their bye weeks and the only available players were Reed and Ebron, it did increase the blood pressure, but somehow Lev finds a way to get the win. We are in a position we never thought we would be in as playoff mainstays and it is truly remarkable. I never thought it was possible but Lev has increased his popularity here in North Korea. People have been turning up at his house for blessings, there is a belief that he is some sort of messianic prophet here to spread love and joy through management or lack of management of our fantasy football team”. \nDespite the strong regular season, Levey will have his work cut out in the playoffs. In an attempt to win the ultimate prize Lev has been putting his squad through Korean style double sessions. The result being Gordon, Green and Olsen are all out injured. However, despite this, the teams biggest setback has been the Hunt fiasco. Despite Kansas City dropping the player, Levey has decided to keep him on his roster, which has led to a barrage of criticism from the press. In a recent press conference Lev has said, “I don’t understand what the issue is. The girl wouldn’t get with one of the lads from my boys entourage…in my eyes she deserved it”. The league have asked Levey to apologise and have even attempted to enforce gabbai duties at Borehamwood shul, however, given levey is under Korean jurisdiction and in attempts to keep the peace, the punishments have fallen on deaf ears. Levey usually has such a hardline for his players so it is slightly strange that he has kept the boy in his squad. The rumors are that Levey was infact in the hotel room in Cleveland and has kept Hunt on the team in order to keep his silence regarding the gangbanging with his boss. We await further news on the developing story. \nIt is clear to see that Benjy Levey can do no wrong at the Levey helm. He will be looking leave his team untouched in a bid for glory that will throw out the traditional fantasy football strategies. \n\n\n\n*Jamie Kay*\nJamie Kay has had a lot to deal with this season, the franchise move to Hendon, the fact that David Johnson just wasn’t quite to 35 point a week player he was 2 years ago and his team capitulating before his very eyes over the first 8 weeks of the season culminating in a week 8 record low points score of 64. Things were not well at the Hendon helm and there were calls for Kay to get the sack. However, history can have a way of repeating itself in fantasy football and just like last year Jamie kay has proven his fantasy prowess utilizing the waiver wire to his advantage to build a resilient team to storm to the playoffs. They don’t call him “the medicine” for nothing…. take your failing team to him and he will make them better. From week 9, Kay and his boys went on an immense 5 game winning run to secure the playoffs with one week to spare. It was quite an exceptional feat especially given he seemed to have potentially thrown it all away in order to get Gurley before his week 12 match up with Sanford. However, in Kay we trust and just like that he took Sanfords best player and his playoff position without blinking. \nWe spoke to Gurley on his move, “it feels good to make the move from New York to Hendon, I feel like with Kay at the helm, he can take this team places. Having moved from St Louis to Los Angeles with the Rams, I am more than ready for the transitional period the boys will be going through on the move from Borehamwood to Hendon.”\nKay has been close in previous years and he will undoubtedly be wanting to make the wrongs right in an attempt to get his hands on the coveted plancey belt to put up in his new digs. Kay has also threatened that if he won, to put an asterisk on Livingston’s name on the belt, which will add spice to the playoff rivalry these two warriors have. \nKay will be gunning for Miriam in his bid for the Plancey as he has become somewhat of a bogey side for Gaon and with Gurley at the helm anything is possible. Having been one of those in closest proximity to Plancey over the years as part of his community work and Hashkama gabbai duties, Kay certainly has the potential for the luck needed to win the belt. Having always got himself to the semi finals, you can bet on him getting himself there against a depleted Levey. \nWe caught up with Kay, “It hasn’t been easy this season, at one point I was sure we would be in the Miriam bowl and then out of nowhere teams around us started crumbling, we started winning and the rest as they say is fantasy history. The move hasn’t been easy away from Borehamwood not being able to play in our old home The Kingsley stadium, however, the boys have coped well and we carry on. I am gunning for quite a few of the managers this season and have big plans for the belt if I can get my hands on it”. \n\n\n\n\n*Gideon Sacofsky*\nIt brings me great displeasure to let you all know that the BDS movement have wormed their way in to our beautiful fantasy league and all the fantasy managers are to blame. As the Israeli ambassador of the league, the BDS movement have turned their attentions to Sac calling for all managers to halt all trading with the Israeli based franchise. In fear of the reputational damage, all managers followed suit and it meant Sacofsky was left tradeless. Bibi Natanyahu has condemned the BDS efforts, “I wholeheartedly condemn the efforts of the BDS movement and the decision of the managers of the league to not trade with our team. We are the only democracy in the middle east! To hit our fantasy team is taking this to the next level and they should expect a reaction”. The IDF then proceeded to hit 5 uranium enriching plants in Iran and Syria in retaliation. \nIt is fair to say the twittersphere went crazy with supporters pointing to other teams in the league as an example of the anti Semitism and hatred towards jews, “Of course Sacofsky and his team are so terrible and yet Levey has ties to North Korea and we hear absolutely nothing, absolute disgrace!”\nAlbeit Sacofsky put his head down and despite the embargo has managed to get his team to the playoffs for yet another season. Which is a testament to the man given all the background noise and pressure of being Israel’s team. Having started week 1 poorly, there were murmurs that sacofsky may be a favourite for the Miriam, however, with thielin and Hopkins and the unbelievable rookie talent of barkley, Sac’s team showed what they were all about. \nLast season there was talk of underhanded tactics by the mossad, fiddling with Sacofsky’s team, this season, given the trading embargo, there have been further talks of a potential hacking scandal, Saul Freedman is still convinced that his phone was hacked causing the trade for leveon bell  to be accepted. Given how outspoken Freedman was against trading with Sacofsky it seems entirely plausible that The Mossad would aim for freedman. \nA mark on the season can be found on week 7 when whilst sleeping and in total control of the gameweek vs Polak, a trade in the 11th hour for Davante Adams meant that without any knowledge Sac was now in trouble of losing the gameweek. It was only once he had awoken that the nightmare was realized and he was no longer playing against the lowly Breida but Green Bays top wide receiver. Sacofsky was livid, he called on the UN council of human rights to take action over this trade. The UN Council of human rights spent 24 hours discussing the issue and came to the conclusion that Israel had violated 25 counts of human right laws whilst Sacofsky was asleep. There was no mention of the trade or any other wrongdoing. \nSacofsky goes in to the playoffs on the back of a couple of agonizing losses having scored highly in both, El Loco have every reason to feel confident their boys can finally take them all the way and add the Plancey belt to the big Eurovision song contest win earlier this year. \n\n We all look forward to another fantastic playoffs, we will be continuing our coverage throughout. Once again, Rabbi Plancey wishes you all a hearty hearty mazel tov on the playoff berth and looks forward to anointing the winner.\n\n---"},{"id":10,"title":"2018 · Round-1 preview","year":"2018","text":"*Sent 06/12/2018*\n\nThere is only a matter of hours to go before the playoffs are upon us and this week we have four managers fighting it out with eachother for a place in the semi planceys. \nThere is likely to be fireworks with teams on the up playing teams with their form in the toilet. But this is the playoffs and one magical performance can see you a win away from the plancey bowl and one awful week can see you back to the day job for another 9 months. \n\nLevey v special k\nThe week leading up to the first round of the playoffs has been marred by serious allegations. The NFL has stated it is investigating the story that the woman was savagely beaten by kareem hunt for refusal of a spit roasting from Hunt and Levey. Levey is refusing to comment on the allegations and has now refused to speak to all foreign press only giving interviews to the North Korean media. \nThe articles in North Korea have their usual poetic license stating that the fans have a week off this week as lev safely secured his bye early in the season finishing the season with a strong 13-0 record. \nIn reality Levey has huge problems going in to the game week, along with the allegations, his team have been left wanting of late with a raft of injuries at the worst possible time of the season. Vegas have thus one as a special K banker giving Levey a 5000-1 chance of winning the plancey belt overall. \nSpecial K on the other hand are on a 5 game winning run that looks unlikely to end this week. We caught up with Kay, \"They mood in the camp is fantastic. The boys are raring to get out there and get to our third semi final in 3 years. This is fantasy football and nobody is ever beaten until the final snap early on Tuesday morning so we have to give Levey the respect they deserve and not let up. Benjy Levey is a proven fantasy manager and I look forward to the match up\". \nLevey and Kay have a 1-1 record in the season, with Leveys most recent loss being only a week ago. Levey and his backroom staff have been using the previous matchup to take noted of how they can beat this team from Hendon. Rumours of potential doping have been rife as well as North Korean spies hanging around Kay's team hotel. In light of this Kay has taken every measure to keep his tactics and playbook under wraps and the team have brought their own caterer in to the hotel to ensure no food has the potential to be poisoned. \nLevey on the other hand has kept himself to himself staying in Pyongyang in his palace taking team training sessions via facetime. \nThe board of the Plancey fantasy league unfortunately had put all the profits made over the years with Freddy David and therefore given the loss of money the league is heading in a new direction with the fantasy playoff matches being played in a foreign neutral location to increase the reputation of the league. This game will be played in Bangkok which only serves as an advantage to Levey as he hopes Kay will be too distracted chasing Asian tail given his famous love for Asian women. \nThe line ups give little chance of a win for Levey and he is hoping for a Chanukah miracle....blount vs gurley is the pick of lopsided match ups. \nPlancey wishes you both a hearty hearty mazel tov and luck in your match up....\n\n---"},{"id":11,"title":"2018 · Round-1 preview — The Dogs Polaks vs El Loco","year":"2018","text":"*Sent 09/12/2018*\n\nThe dogs polaks vs el loco\nIn the other quarter plancey this week see polak pit his wits against a strong sacofsky side. Don't let the league table fool you Sac has one of the strongest teams in the league this year losing his last 2 games despite scoring over 140 points in both games. \nThis has turned in to a bit of a grudge match for Sac as Polak is looking to beat him for the unprecedented 3rd time this season, which is the maximum number of times you can beat a fellow player in a fantasy season. The rivalry was increased further by \"davanteadamsgate\" in their first meeting this season. With sac comfortable of victory going in to Monday night football polak pulled off an 11th hour trade to input Adams in for the victory whilst Sac was fast asleep in bed. \nThe two teams are very much boom or bust with the current projections having Sac slightly ahead to advance to the semi planceys. \nDue to the money issues of the league as previously stated, the league will be playing its playoff matches in foreign lands to increase exposure. This match up was touted to be played in Saudi Arabia, however, once Sac was due to be played in the matchup, riots ensued. The game was refused causing the league to make last minute changes. The game will now be played in Switzerland in a perfectly neutral arena. \nPolak has had a nightmare with OBJ unfortunately out of the game under suspicious circumstances leaving polak living on a prayer for the big game tonight. \nA hearty hearty mazel tov to the two competitors and we will see you next week for the semi planceys!!!\n\n---"},{"id":12,"title":"2018 · Semi-Plancey preview","year":"2018","text":"*Sent 13/12/2018*\n\nThe playoffs roll on this week after the casualties of the hapless duo of Polak and Levey seeing their playoff runs die a very early death. \nThat sees Kay and Sacofsky advancing to the semi planceys to face off against the bye weekers Miriam and Livingston. \n\nMiriam vs Kay\nIn whay has been called the battle or the NHS the two league doctors (cmon Sanford we still believe you can make it three!) will fight it out this weekend for a shot at the belt. All those years of exams and training have all lead up to this point and all eyes will be on this one. Now we aren't saying that whoever wins this will be classed as the better doctor, but i cant promise that my trust wont be swayed by the winner. \nKay enters his 3rd straight semi plancey looking to do the impossible. In the quarter plancey he beat Levey in what was his 6th straight fantasy win. He will now have to perform miracles once again to defeat the hotly tipped Miriam in this one. \nGaon has had some previous with Gurley in the post season, with a big performance in week 16 last year meaning he was forced to don the Miriam name (possibly forever). Kay will be hoping his new acquisition will dust off after the difficult game at Chicago last week and provide the stud type score he is expecting. \nJamie has been somewhat of a bogie manager for Miriam over the last few years but the bookies have got Miriam as the hot favourite going in the thursday night's games and who would bet against him. \nWhilst it is miriams first playoff game, it is also the first official gameweek where Miriam cannot actually make a trade which really reduces the chance of Miriam self implosion. \nCan Kay get himself to a second final in 3 years despite all the difficulties his team have faced this year or will Miriams boys go marching on to the plancey bowl. \nThe match up will be played in front of a sell out crowd in the vitality stadium in Bournemouth, given miriams ties to Bournemouth having worked there for some time there has been uproar regarding collusion in the league. This matchup will be watched by millions around the world, but will be played in a stadium that holds less than 15,000, no corruption here. \n\n\nEL Loco vs eifert\nThe second semi plancey sees the mighty Israelites take on Livingstons bye weekers. \nIn what promises to be one hell of a match up, Sac is looking to reach his first ever plancey bowl whilst Livingston will want to continue in his quest to make it two belts in 3 years. \nSac came out of the quarter planceys looking the most impressive of the four teams as amari cooper and kittle blasted the team to a comprehensive victory. \nDespite the lack of trades it seems like Levey's old fantasy strategy is working wonders for Sac. \nThere were further murmurs of possible mossad meddling. This time in a specific game. There was talks that they gained control of Dak Prescotts sex tape and told him explicitly to throw to amari cooper instead of handing it off to zeke ensuring a comfortable victory. Investigations are still on going. \nLivingston is still reeling after the bye week miracle. It was said he could be seen high fiving every person on the tube in to work the morning after. He will look to take full advantage of the bye week as his players had a well deserved rest. Injury to Connor has not helped proceedings, but Livingston will hope the effort he made to go up and shake planceys hand all the way back at the beginning of the season will stand him on the right side of luck. \nThe current status has sac winning and with his recent scores all being 140+ who would bet against him. However, Livingston and his boys have proven they can go big and did so only 2 weeks ago to leave a sorry Sacofsky waking up to another nightmare unexpected loss. \nThis game will be played in Moscow. Some have questioned how far the league will go for money and there has been further uproar regarding this game. The commissioner has stated, \"we see no issues with playing the game in Russia. There is a large fan base there and everyone is looking at the borehamwood boys to bring peace and prosperity to the world\". \nIn other odd news, there have been questions regarding the outgoing rabbi of borehamwood shul. People want to know how what and why. We have the answer here. The special guest referee for this match up will be rabbi kanterovitz who took a leave of absence in order to pursue his career as an nfl referee. You couldn't make this stuff up....\n\nOnce again rabbi plancey wishes you all a hearty hearty mazel tov on making it this far. We cannot wait to see what occurs to find out who will be playing for the big one at meadow park next Sunday.\n\n---"},{"id":13,"title":"2018 · PLANCEY BOWL preview","year":"2018","text":"*Sent 20/12/2018*\n\nThis is it...The weekend we have all been waiting for...The stage is set and meadow park is finally ready for what promises be a truly phenomenal day. The rumours are in fact true and whilst it was first touted Emma Kingston would be doing the half time show, this year the league have gone with Stephen Levey to perform his rendition of \"oseh shalom\" we are hoping for no Janet Jackson's in this one. \nIt has been a long road on route to the plancey bowl and we couldn't be more excited... \n\nTHE MIRIAM BOWL\nThe first game is the matter of the Miriam bowl...The game that nobody wants to be in. Sanford and Freedman have performed a switcheroo from last year's plancey bowl. It's fair to say both camps could not be more devastated. \n\nFreedman has had a season to forget. With Mark Ingram coming back from suspension And the potential kamara time share, Freedman wanted to offload. In the fire sale he decided to do a four man trade to get rid of kamara and the injury ridden fournette to get aboard to Lev Bell hype train. Despite the move to a new home, Bell still decided the money on offer from Freedman was not worth getting out of bed for. This meant Freedman would go from a 0-3 record to only winning one more regular season game all season and he was the first to go. There were discussions amongst fans that his decision to go on a break to South America for this season was the main factor in the lack of wins and strange trading strategy. It may have been the pressures of holding the plancey belt that caused the self capitulation. One thing is for sure, whatever happens in this game Freedman will be looking to set the record straight next season. \nOn to another devastated coach. There were questions of whether organising a wedding mid season would be difficult to juggle with the running of such a large franchise. The result is, Sanford will be playing in his second Miriam bowl in 3 years and the potential to become the leagues first 2 time Miriam. \nAfter last season's Plancey bowl loss, Sanford got rid of the whole arm of Mclagan dedicated to his fantasy football team. The news guys employed have simply not gelled with Sanford this year. You could see it wasn't going to work when the team vetoed Sanford proposal to trade Gurley for C.J. Anderson early on the season. It seems Sanford requires a team that will complement his unconventional trading style. \nSanford will be hoping he can claim a victory this weekend and get back on the horse next year in order to prove that the dizzying heights of last year was not a fluke. \nOne thing is for sure, both men will be doing all they can to not have to face being Miriam for the year....expect fireworks. Especially after last season's Plancey bowl where in a fit of rage at the impending loss Sanford ran across the field and rugby tackled Freedman in to the Gatorade kegs. Both men were ejected from the game and faced hefty fines to go in to the shuls Danny jacobs Eruv fund. \n\n\nTHE PLANCEY BOWL\nSo here we have it, confirmation that we will have a new champion, confirmation we will have a new holder of the belt and confirmation that nothing in fantasy is a given. Both Men had to make it through the playoffs the long way round but once their journey started they put the blinkers and never looked back. \nSac has had to come through protests, UN sanctions and rockets from Gaza. But the team he has amassed have done him proud. Cooper And Hopkins have been his most noticeable playoff contributers but the team itself has always looked capable of going all the way. \nThere was slight confusion about who the potential semi plancey opponent would be, but in hindsight it didn't really matter as he would have blown everyone away regardless of who he played. Which safely makes Sac the favourite for this weekend's big match.....\nWhich is exactly how Kay likes it. They don't call him the medicine for nothing....But forget science...There are murmurs that jamie kay is infact the reincarnation of Jesus Christ himself. He is a real life miracle worker. They say he recently went to eilat for a bit of water sports only to be disappointed that the sea would split every time he touched it. \nGoing in to a matchup against the hotly tipped Meshugenners very few people were offering on Kay winning and making a second plancey bowl appearance in three years. Low and behold, a strong gurley performance and the Meshugenners choking at the vital time has pushed Kay right in the plancey mixer. In his post match interview the outgoing Miriam said regarding the Plancey bowl, \"I hope they get in a big fight both teams get disqualified and it defers to 3rd place/ overall points scored/ regular season winner/ most likely to complain/ most trades/least amount of days lived in borehamwood\".\nDespite the predictions, Kay and his men are the form team going in to the big game. Since week 8, Kay has not lost a game and is heading in to the plancey bowl on a 7 game winning streak. This game is perfectly poised to be a stormer and Kay would absolutely love it if he can shake off the plancey loss of two seasons ago to finally get his hands on the belt and it may be the greatest comeback Borehamwood has ever seen. \nHaving caught up with Sac before the game he is raring to go and he sees this matchup as personal, \"I don’t fear Jamie at all. I’ve been waiting since week 4 for revenge and I’m delighted to have my chance in the final. The only player in his squad I was ever worried about davante Adams and he gave him away for a box of viennese biscuits and everyone knows he only had to wait til shabbat for the BES kiddush to get these for free! Collusion!\" There is little doubt Sac will have his boys fired up for this one and there are questions regarding whether Sac will shake kays hand post match. Kay, on the other hand took the high road showing respect for his opponent, \"Sacofsky is the wizened old timer and I feel like I can learn a lot from his non tinkering management style. His suggestion of claiming to be married to get double the food at wedding receptions will go with me to my grave”. You won't want to miss this one. \n\nThanks for the readership for this year's playoff previews. We look forward to finding out what you all get up to in the off season. The community will be waiting to cheer on their heroes once more for the 2019 edition of the the plancey. To the plancey bowl Victor, the rabbi wishes you a hearty hearty mazel tov, the choir are waiting in the wings for a rendition of shema b'ni and the the belt is waiting for your name to be etched in to history.\n\n---"},{"id":14,"title":"2019 · PRESEASON PREVIEW","year":"2019","text":"*Sent 25/08/2019*\n\nIn the words of the great naftali Brower, “I hear you like sports”. \nOh my oh my…..it feels good to be back. With the book firmly closed on an enthralling 3rd season of plancey fantasy it is that time of year again as the franchises in the league get themselves ready for another rollercoaster ride for the ultimate prize of the plancey belt. It has been almost 9 months since the final snap of the plancey season that saw Sacofsky pick up his maiden belt and Miriam (nee Sanford) pick up his 2nd Miriam since its inauguration. The off season is the time where our franchise owners take stock of the things that take a back seat during the regular season: Wives, Girlfriends, Children, jobs and businesses. However, it is also a time of hard work and preparation for the season ahead, with mock drafts, podcast and spreadsheets galore, nobody wants to be guilty of a lack of research come draft day (unless you are lev). \nWith the popularity of the league in its ascendancy the league has had a variety of lucrative offers for television rights and a variety of merchandising deals. Amazon prime have picked up the rights to the “Plancey:All or nothing” documentary, that has followed each and every league manager and what they have been doing during the off season and will follow through the season. Amazon Prime have also created a plancey channel which currently shows classic matchups between members of the league. A true crime series has also been created with episodes mainly focusing on historic rule breaches and criminal cases involving league members. As you can imagine, it mainly involves Benjy Sanford and Alastair Livingston including “loangate” and never ever forgetting “darkwagate”.\nThe league has had such a global impact, trading floors across the world now all recognize the 26th January as Gaon day, where regardless of profit or loss all traders must trade without care or reason. North Korea has started opening up relations with the US on the back of Levey’s achievements. Israel, a country constantly under scrutiny and picked apart for all wrongdoings can now add a Plancey victory to its C.V along with a weirdly large number of Eurovision wins. The league has become so popular that the 2 players who played in the inaugural plancey year (bringing zero banter to the table) have now become nothing more than pub quiz questions similar to that of, “what was the name of the beatles member who left prior to the band finding worldwide success”. \nThe league may be getting bigger but the “Plancey post” remains the same and here is your update on how our owners have been doing in the off season and their expectations for the coming year. \n *Gideon sacofsky* \nWe start with our newly crowned Plancey, who had to wait some time to officially get his hands on the belt but the wait was worth it!\nDespite the delay, Sacofsky had his day in the sun with an open top bus stretching from shenley news and convenience all the way to the venue swimming pool. This was after the ceremonial plancey service had taken place where an extra torah was brought out to mark the occasion followed by a beautiful shema beni rendition from the Borehamwood choir. Sacofsky was then presented with his belt by the big Al himself and a book about a jewish boys place in the world. \nBeing the Plancey is a big responsibility and opens up a wide variety of doors that were not there previously. Sacofsky has taken it in his stride performing a number of public appearances including cutting the tape at the opening of the Chabad Jewish Life Centre in the boulevard. Sacofsky has also become a wanted man for a number of brands which included signing a lucrative deal to be the face of torah treasures new tzitzit line. The dizzying heights of superstardom that come with Plancey has been known to cause issues in the following season. We have yet to have a back to back winner of the Plancey. \nHowever, Sacofsky has made it clear to his fans that he intends to build a dynasty and who would bet against him doing just that. He has started as he means to go on winning the “Izzy Sweepstake” and correctly guessing when coach Livingston’s wife would have their first child. However, there was shock when Sacofsky decided against bringing his man Saquon Barkley back by not choosing to pick first. Nevertheless, the fans have an unwavering trust in our current Plancey with plans to build a statue of Sacofsky in Rabin square. There are still murmurs of a Zionist conspiracy with Israeli intelligence having involvement in ensuring Sacofsky wins. Government backed or not Sacofsky will take some beating. \n *Jamie Kay* \nJamie kay has spent the majority of the off season wondering what more he can possibly do. Kay has been the most consistent fantasy performer since Plancey records began. An incredible 2 trips out of 3 to the Plancey Bowl is a record held only by JK, however, this is a results based business and the only fact he cares about is that he still has not got his hands on that elusive plancey belt. The part time Doctor part time fantasy whizz sent his fans wild once again last season turning a possible Miriam bowl place in to a playoff run that was cruelly halted at the final hurdle by a rampant Sacofsky. \nRumours are that Kay spent his plancey bowl appearance bonus on copious hypnotherapy sessions, fantasy podcast subscriptions and Asian prostitutes. There have been worries from the fans about the mental state of their owner, “we are starting to worry if the gaffer can keep this up, he has put his all in to getting the franchise to where it is today. How in the world are we going to come back from another plancey defeat. There are feelings that the team has been cursed\".\nKay has come out in a press conference to quell fears, “ I am as devastated as the rest of the fandom, but make no mistake I still have the itch to succeed for this franchise and will not stop until i bring home that belt. I know there has been talk of a possible curse. This is absolute trash talk and is not something I think about. It is complete coincidence that we are moving our home stadium for next season. There is no curse!” \nVegas has already tipped Kay to take another trip back to the plancey bowl and Kay will expect absolutely nothing less. \n *Benjy Levey* \nBenjy “autodraft” Levey is back again for another year of fantasy and he feels as though the foundations have laid for a first plancey bowl trip. Contrary to North Korean media Levey did not win his second out of a possible two Plancey belts last season, however, this seasons objectives were leaked to the press. The objectives included getting players first names right and remembering to put waiver wire picks in on time. \nLevey has performed admirably over the past couple of years and won the award for unluckiest franchise owner last season as his all conquering team was ripped to shreds in the space of a week last season via injury and criminal charges. The world was on edge as North Korea threatened to nuke Kansas City for ripping up the contract of Kareem Hunt in what the world media was calling the “kareem hunt\" war. In the end cooler heads prevailed but Levey was still left with a team unable to take the playoffs by storm as expected.\nLevey has spent most of the off season batting off a hostile takeover from a consortium led by Freddie David. Despite the criminal charges David saw the opportunity to take over a North Korean stronghold as a seriously good personal investment. Levey names his price at £14bn and despite not having the personal funds to fund the takeover, David provided assurances that there were still enough of his clients that he could nick off in order to make this happen. This assurance was rubber stamped by a character reference from Rabbi Kanterovitz. \nDespite all of this and much to the delight of Levey's fans the authorities put a stop to the purchase and Levey will continue as owner of the franchise going in to the 2019 season. We reached out to Levey for comment but have it on good authority that his phone was accidentally put in the washing machine. \n *Josh Gaon* \nJosh Gaon has every right to feel aggrieved. He had his heart set on becoming the first ever Miriam to Plancey. Incidentally, our very own Benjy Sanford (now Miriam) almost achieved this feat last season. Gaon had built a team to last! He seemed more prepared than anyone for the playoffs and his team would have taken some beating. However, he was stuck in a Jamie Kay fairytale and fell at the hurdle before the Plancey bowl. However, after an absolute disaster of a first season, Gaon has to take his wins and he was so delighted at no longer being the Miriam. In utter jubilation he only went and proposed to his girlfriend. His lawyers did state to him at the time that this made it a bit more of a legal issue if he was to use her in any future trading activity, but he bit the bullet and Nicola has agreed to become a fantasy widow. \nAs you can imagine, Gaon is a perfectionist and therefore, there was no switching off in the off season. It is all about planning and he feels his strategies have been vindicated by the playoff charge last season. His boys were favourites for the Plancey and he now needs to work to ensure that they do not bottle it this year.\nHaving been to rehab in the previous off season for his over trading activities, Gaon quickly sacked off sobriety and was back to trading in no time. Gaon has signed a new deal to be sponsored by the Football Index who have helped reduce his trading withdrawals during the off season. Gaon is one to watch this year with shackles of being Miriam off. \n\n\n *Alastair Livingston* \nAlastair Livingston has spent the off season multiplying. We are delighted to announce the arrival of his new daughter Isabella. As expected Isabella became part of Plancey fantasy folklore before she was even born. What is now dubbed the Izzy Sweepstake, her birth was subject to choosing who would have first choice of picks. In what is becoming something of a yearly occurrence, Livingston’s wife has shown complete independence by putting her husband in 6th place out of 8. It is once again something that needs to be discussed in house but after having Elly pick teams out of the hat a year ago and then giving birth to his daughter this year, Livingston may be pushing for a way of picking seeds in a way that doesn’t involve his wife next season. \nWith the birth of Isabella, the service Livingston has done for his franchise and the league itself should not be understated. There will be a time where the originals will no longer be able to take their place as CEO’s of their franchises. Livingston has The league appreciates the forward looking decision made by Livingston in helping to ensure the league continues long in to the future. \nLooking after a new baby can be both rewarding and tiring in equal measure, but Livingston knows the ultimate focus needs to be back on fantasy football starting tomorrow. \nLivingston’s credentials have been called in to question after his first season heroics. There have been grumblings from other league members stating that Livingston should have an asterisk next to his name on the belt given the large gulf in understanding in the first season of the league. This viewpoint has gained momentum over the last couple of years as Livingston’s seasons have seemed to fizzle out in to mediocrity as other league members have caught up. Livingston is willing to do all he can in order to hit back at his critics and is aiming high this season in order to become the first two time Plancey. \n *Saul Freedman* \nThe less said about Freedmans post championship winning season the better from his perspective. Having narrowly escaped the dreaded Miriam title he stated that in the days before the Miriam bowl he hadn’t been this scared about anything since the harrowing sight of Tony Cohen violently plodding towards him as a youngster. \nFreedman has made his intentions fully clear regarding the draft, snatching the first pick and thus inevitably taking the imperious Saquon Barkley to the helm. Freedman has a reputation of honing his talent and getting as close to them as possible. For example, there was the super injunction imposed on the threesome sex tapes with Rob Gronkowski two years ago. Freedman knows he will likely be heavily dependent on Saquon and will be wrapping him up in cotton wool to ensure no injuries. Therefore we expect the crazy partying ways of old may be held back until after the playoffs.    \nThere was talk of a possible retirement as saul put himself up for the new Dayan position that had recently become available in the community. Saul explained that if he got the role he may be too busy to give his full attention to his fantasy team. However, negotiations broke down after the US refused freedmans request to hand over Dayan abrahams black book of easy booty calls. Freedman felt the job would then be too much work to build up to the existing long standing relationships. \nNow the focus is back on fantasy and Freedman has full intentions to make it right. There were question marks over whether it was the correct call to go travelling during the fantasy season and he will be staying put this season to make this right. There is absolutely no doubt that freedman has the ability and talent to win it and his one title in the trophy cabinet is testament to that. Patience is the aim of the game and Freedman will not want to be caught shooting his load too early. \n *Daniel polak* \n\nPolak is revelling in his first ever playoff run. Slow and steady is the game for Polak and this season they want to go even further. Usually a permanent resident of the Miriam bowl , Polak has proven that he can deal with the high pressure situations that come with this type of game twice narrowly escaping the dreaded Miriam title. They have started to call Polak the tony pulis of fantasy. \n“I know people believe my team and I are only good for ensuring that the franchise doesn’t get the Miriam title, however, we believe with the right tools we can take a team all the way”. Polak has spent large amounts of the off season being dragged around such delights as peppa pig world and various soft play centers. It is safe to say the fantasy season couldn’t be coming quick enough. \nHaving had their first ever playoff game they were beaten in the first round by the eventual Plancey champ. This season sees Polak’s team move in to a new stadium where they hope more playoff games will be played. Polak was glad to see that there is now a perfect spot just above the marital bed for the belt to sit. \n\n *Miriam* \nWhat can be said about our 2 time Miriamer. After having a phenomenal second season where some say he may have deserved to win it, Sanford went back to the dreary performances that marred his first season in fantasy. Some say Sanford was rash to sack his whole advisory staff after losing in the Plancey bowl. Needless to say the off season has seen a merry-go-round of changes to the backroom staff. Sanford knows he simply cannot afford another Miriam title and he needs the right people in place. After some serious thought Sanford felt it was time to move away from the fantasy department at Mclagan and join Elliott where it is believed they have a far more sophisticated approach to their fantasy advisory services. Known for his odd drafting policy, everyone will be watching closely tomorrow night, as far as I understand Orleans Darkwa does not have a team this year. \nMiriam once again brought the league in to disrepute with the sheer length of time it took him to fulfil his Miriam duties. Having already received the punishment of walking through the streets of prague in shame for previous misdemeanors, the Plancey court of arbitration have given Sanford a suspended lifetime kiddush duty sentence. The London Beth din also became involved stating that given Sanford’s continuous rule breaking they would close down Golders Green metsuyan given Sanford’s past connections with them. After much deliberation and appeals from the leagues representatives, Metsuyan has remained open. What this does show is the huge amount of influence this league has and the importance each owner must place on keeping the rules. \nSanford has epitomized what it means to be a yoyo team, its either brilliant or it is diabolical and he has it all to do to prove that his second year quality was not a flash in the pan. There can be no distractions, as a married man during the last regular season, the fans believe this should refocus his energies in to what is important…fantasy football. \nOnce again good luck for the fourth season of Plancey fantasy, we will be back with more behind the scenes stories at the playoffs. Mayor Alan once again wishes you all a hearty hearty mazel tov on the start of the new seasons journey, draft smart and play by the rules.\n\n---"},{"id":15,"title":"2019 · REGULAR-SEASON REVIEW / Playoff opener (the Tie season)","year":"2019","text":"*Sent 04/12/2019*\n\nWhat a season! What A SEASON! Another regular season has gone in to the books and this one has been a Corker. We have had records broken for scoring, a tight finish for the Miriam bowl and our first ever tie that ended up deciding our first week byes. Borehamwood fantasy has once again hit the heights globally as fans have been glued to their seats to watch their favourite fantasy franchises vye for a place in the plancey bowl. \nThe playoffs are back, so get reading your start em sit ems because this is where legends are made. \n\nJosh gaon has been doing josh gaon things this season. Yes on the surface it is fair to say the man loves a trade and he most certainly has been trading. However, under the surface, alot of time and effort is put in to ensure that the team is built to go all the way. Since his infamous inaugural Miriam season Gaon has worked with his men tirelessly and has picked up two consecutive bye weeks in two years. This is what the other managers were afraid of when Gaon came in to the league. The horrendous first year added fuel to Gaon's fire. You need a massive element of luck in fantasy there is no doubt about that. However, the kind of garbage time Carson luck that gaon recieved was out of this world lucky. Not only that, it created a one in a million chance of a fantasy football draw, the first of it's kind in borehamwood fantasy football. Gaon will be hoping that this season his team dont bottle the position they were in last season going in to the semi planceys. The curse must be lifted and there is no time like the present. We would just like to take a moment to plead with Josh Gaon to truly take some time in the off season to get this addiction under control...it is too hard to watch you continue to slip on your journey to sobriety....stop picking up random players you think other people might need but mean nothing to you...you are going to be a husband next year, please think about nicola....\n\nDaniel polak has finally developed some balance in his franchise. Two Miriam bowls followed by two playoff appearances has finally got the organisation moving in the right direction. Polak took some risks this year picking up Gordon in the 5th at a time where nobody wanted to touch him. After 2 game weeks and two losses Polak was papped outside Melvin's home holding up a large stereo playing \"I will always love you\" by whitney houston in an attempt to get him to end the hold out. In the mean time riding the WR1 and 2 for much of the season has massively helped Polak towards his second post season. Nevertheless, what is bugging the fans is the teams inability for a winning record but polak wants to remind the fans that the team were predicted a 1-12 record at the start of the season. \n\nIn North Korean news, Lev has lead the pack from the word go with a solid 13-0 regular season record. It is hard to go wrong when your team has Lev at QB and the korean head of state as your RB1. \nBut in reality, this has been a difficult season for Levey. Those of us with babies will know that Gina Ford says her sleep routines work for the first two babies whilst the third tends to be more difficult. Much like Gina, Lev has found his autodraft tactic may be stale in its third year. It looked so good at the start, autodraft picked up Zeke who was holding out at the time. It looked risky to the naked eye, however, in return for closing down part of their nuclear programme Trump provided Lev with inside information on Zeke's status. However, he may aswell have not returned from the hold out, he just hasn't been the same man since his new contract which infuriated lev and the North Korean head of state. There were crunch talks midway through the season, where fantasy experts from across the globe were brought in to provide assistance. This consultancy project led to Lev finally using the waiver wire in the correct fashion. It also led to a mid season revamp of Lev's team with about 5 players picked up off free agency. The 5 players cut by the team were quietly put back in to free agency which was a far better outcome than the execution line being recommended by Lev's north korean advisors.\nThe season hasn't helped for Lev's global commercial reputation, the book sales lauding the autodraft system have hit an all time low with one review stating \"I read this book whilst at the mill hill east tradeaholics rehabilitation facility and can confirm this system is a load of rubbish. If anyone wants a TE let me know\" - J. GAON.\nStill Lev has snuck in to the playoffs and will be looking to put the regular season behind him and get his hands on his maiden plancey belt (or his record third plancey belt if we are in N.Korea).\n\nMiriam Sanford has relinquished his hold of the Miriam title and in some style. It has been quite a season for team Sanford which has conveniently coincided with his pre season change of advisors. The regular season record does not provide the full picture. Sanford and his boys have been feasting on teams for the majority of the season. He has even broken the gameweek scoring record once again this season notching over 200 points in a gameweek. He has built his team around his work horse RB's and never looked back. Despite not topping the regular season rankings Sanford team has put everyone on notice for the playoffs as he looks to complete the pattern of Miriam bowl, plancey bowl, miriam bowl.....\nNevertheless, his run has been made more difficult by having to play week 14 when his bye week dreams were brutally taken away from him in the dying moments of Monday night football. The team will have to pick themselves up for another week of football and hope that Cook isnt too battered and bruised. \n\nThey say that fantasy football is all down to luck. Which, undoubtedly, it is alot of the time. But questions need to asked why the same things seem to be happening. Why does Jamie Kay continue to look in unassailable trouble only to once again make the playoffs. Why does Lev always seem to make the playoffs whilst doing next to nothing. Why does Saul Freedman and his team always know how to get just enough points to win....not too much, not too little just enough to get the victory. \nFreedman was nothing short of devastated after last seasons mess. He said it felt worse than being punched in the face in meadow park, worse than being chucked out of vodbull for not having a T-shirt on and even worse than having to endure that no wanking policy he put himself through some years ago. \nSo Freedman did what Freedman does best, he got his head down and made sure the same thing didn't happen again....the result...another stellar fantasy season where his team have topped the charts from the very early stages and not looked back. So much so that Freedman could be found with the touts outside tottenham Hotspur stadium offering his players for anyone with a good looking week 15 and 16. \nIt is fair to say going in to the playoffs his team have not been firing on all cylinders, but dont be surprised to find they are all playing the bengals and miami when the plancey bowl comes around. The bye was secured early on and we are expecting big things from this man. \n\nWell ladies and gentlemen is there any problem jamie kay cant fix. I dont care how in trouble you are....you could be 1-11 going in to the final week and if you let Kay take the reigns of your team you will somehow end up winning the whole damn thing. A truly remarkable turn around when all looked lost, when his men were not firing, they still manage to dig deep for their man. \"Going in to the final game of the season, it was a shootout between Sac and I. I took the boys away from their families where we set up a week long training camp where we all got to know each other a little better Napoli style... we watched movies, stayed up late chatting with hot chocolates and played \"guess what someone has put up their ass in this x-ray\" all night long. It was a true success as the team grew closer and got over the line in a tough match up week 13\". In his fourth season to make a fourth consecutive playoffs is something only Lev can boast. Kay will have a difficult match up against a free scoring Sanford, but Kay has been found hanging around the Vikings medical facility to keep tabs on Dalvin Cook and his shoulder. \n\nIn the financial markets, when a man is on to something before anyone else he can put himself ahead of the curve and trade early. After some time the rest of the market gets a sniff and this knowledge is priced in to the stock. Whilst that man has enjoyed his time at the top, his knowledge is now rendered useless going forward. This is the perfect way to describe plancey fantasy for Alastair. He was a plancey champion before the rest of the franchises even knew there was such a thing as monday night football. Over the years there have been worries that the rest of the teams are catching up knowledge wise and this season alli has finally cracked. There have been secret excel spreadsheets for his draft that he wont share with anyone, whinging about Kay not following the collusion agreement at the draft (very suspect btw!) and the annual declaration that he has had the best draft out of everyone. Livingston has been working around the clock to ensure he will not be Miriam but only time will tell as the clock ticks down to the Miriam bowl. He will have his work cut out against a bruised and angry current plancey champion and Livingston has made his feelings very clear that despite having the most knowledge, the best draft and the best eye for a waiver wire pick the system is against him and his boys. On another note a hearty mazel tov to Alastair for being the first man to use a TE in his flex position this year (please correct me if I'm wrong....I know Gaon started to do this weekly). \n\nOh Sacofsky! What have you done! We have another shot at our first every Plancey Miriam as Sac had a shocking final few weeks to cause him to drop in to the Miriam bowl for the first time in franchise history. And this is also the first time a franchise has had 6 wins and dropped in to the Miriam bowl debunking the widely held belief that 6 wins gets you safely in to the playoffs. Not this year, not in the toughest league in all of sports entertainment. Israel's only representative has fallen on hard times. Some suggest that the distraction of Netanyahu's impending trial and the general uncertainty has led to less government interference in the fantasy world and the team struggled because of this. \nOne silver lining is that the world began trading with Sac again after last years trade embargo, but now focus must go to week 16. It could be said that the writing was on the wall from the draft as Sac began desperately trying to get rid of Aaron Rodgers which he didn't manage to do until later on in the season. \n\nSo here we are the fourth edition of the Plancey playoffs sponsored by Eatme events....as usual Plancey wishes you all a hearty hearty mazel tov and he said something about being super excited to bang livingston for a whole year.\n\n---"},{"id":16,"title":"2019 · Semi-Plancey preview","year":"2019","text":"*Sent 15/12/2019*\n\nAnd then there were four.....ladies and gentlemen we have a 3 in 4 chance that the plancey belt has a new waist this year and its gonna be one hell of a semi plancey weekend. The journey to planceyhood unfortunately had to end for kay and Levey as we move forward with....based on the regular season...the four best teams this year. Now its time to see if the week off worked wonders for the two bye week teams or winning momentum can continue for our quarter plancey victors. \n\nFreedman vs polak \nThe no 1 seed is ready to face off against a bogey team. Polak has 2 wins from the 2 games these two played this season and Freedman will be hoping its third times a charm for his men. With the two weeks off given the bye Freedman gave his boys the first week off to party. They all went off to Saudi Arabia to support Anthony Joshua in his heavyweight bout against Ruiz. There were issues of public intoxication that lead to Freedman Barkley and carson being imprisoned overnight. But they were let out just in time for this weeks match ups. Freedman is dying to get back in to the plancey bowl to fully rid themselves of last seasons shenanigans and be the first to get a second plancey belt. And his team is built to go for this week after getting playoffs very early on. \nPolak, on the other hand, did not expect to be here, the semi plancey is the kind of place the franchise never thought possible. After scraping through vs Levey last week it's a trip to the semi planceys and now Polak has his sights set on a plancey bowl place. \"Having been a permanent member of the Miriam bowl for some time, I am starting to get a nose bleed up here. We will give it all we have got to get to the plancey bowl as I have always been a specialist in week 16.....just for the wrong game\". The gameweek has started already and ingram has already got his boss off to a great start....this could end up being closer than expected. Vegas still have Freedman as the favourite....\n\nIn our other match up it's a tale of two previous plancey nearly men. \nSanford couldn't be happier to get rid of the Miriam now for another year. People often forget that squeezed between 2 miriams, Sanford was in a similar position to now. An absolute beast of a team that fell at the final hurdle. Sanford will be doing all in his power to get back to a plancey bowl to exorcise is demons and finally take the belt to NY. Sanford has spent the entire week in the lead up to the match up wondering why he cant pick up Orleans darkwa on the waiver wire. Fans on the franchise believe that this could be their year and vegas has put Sanford as favourite to go all the way and get his hands on the belt. \nJosh gaon has been waiting for this moment. He has spent entire year researching how he can finally get himself back here to make amends. After a second bye week in 2 years Gaon is used to all this. He took the conservative approach and hoped to not get complacent this year. \nThese two have one game a piece this year, however, it runs deeper than that. Sanford had to fight out week 14 because of some last minute monday night football magic from gaon. Sanford is out for revenge against gaon and who is going to bet against him getting it. \n\nA hearty mazel tov to one and all on your semi plancey match ups\n\n---"},{"id":17,"title":"2019 · PLANCEY BOWL preview","year":"2019","text":"*Sent 22/12/2019*\n\nThis is it! Gameweek 16, where legends are made, where names for the year ate handed out. Who will be alan, who will be miriam only time will tell. This is the weekend where legends will be etched in to the history books of borehamwood fantasy football. \n\nThe plancey bowl \nJosh gaon has made it to a plancey bowl. He has worked so hard to get here after his first year horror show. This is his moment and in the press week leading up to the superbowl Gaon was talking about making sure no stone is left unturned in their quest for victory. He has not been helped by injuries to some of his most prized possessions, however this is the plancey bowl and anything can happen. \nFreedman squeezed through the semi plancey in the only way Freedman knows how and he will be looking for the same again from his troops this weekend. Freedman is looking to make a bit of fantasy history being the first man to be the plancey for the second time. After escaping the semi plancey who is willing to bet against him now....\n\nThe Miriam bowl\nThe two men have had to look long and hard at themselves and wonder where it all went wrong. As they have watched the playoffs unfold the two men have been plotting so that they dont have to suffer the infamous Miriam for a year. \nFor Sacofsky it's a year of firsts. He was the first man to get a 6 game winning record and still not make playoffs. He wont want to be the leagues first ever plancey Miriam. That could be a title he may never live down. \nLivingston has a reputation to uphold. 4 years ago nobody could have predicted this. But the harsh reality is that livingston needs to win to prove that knowing something about the NFL still means something when it comes to this league. He has watched the levs of this world make playoffs every year and to get the Miriam name for the year would be the last straw. \n\nA hearty mazel tov to you all on the final weekend and good luck!\n\n---"},{"id":18,"title":"2020 · PRESEASON PREVIEW (Covid)","year":"2020","text":"*Sent 10/09/2020*\n\nCovid19 has made the world stand still. Multi billion pound industries have been halted in the face of worldwide lockdown. And yet despite all of this....there is nothing....not even a global pandemic that can stop Borehamwood Fantasy from steamrolling on. \nSo forget about 2020, it's been one strange old year, but normality can finally resume. Commissioner Livingston went to press last week, \"I don't care how many over 70's die...I have no doubt that they will go comfortable in the knowledge that fantasy football can continue\"....he later retracted his comments saying, \"I do apologise for my comments earlier it was wrong of me to assume that all over 70's are into fantasy football\"...\nAs usual we have been following the off season and checking up what our franchise owners have been up to in the worlds greatest league.\n\n*josh gaon*\nAnother season and another first time Plancey...An emotional Josh Gaon lapped up the applause claiming that winning the Plancey was nothing short of destiny fulfilling. From Bricky's to Aldo's the fans were out in full force to welcome their heroes back from their Planceybowl victory over Freedman. The race now begins to be the first 2 time Plancey. Despite the mention in the BES newsletter and the chumash he was presented with, post a shema beni rendition from the choir, Gaon knows he cannot let this new found fame get to his head...there is plenty of work to do. Fans were worried when he posed naked on the cover of Men's Health that his head may not be in it this year. However, he has assured fans this is not the case. \nAfter the party was over Gaon stated, \"my long suffering fiance has been standing on the sidelines whilst I work morning and night to reach my goal of becoming Plancey... I will use the off season to dedicate my time to her as we get married\"....then covid hit the wedding was postponed and Gaon went back in to his cave to work on covid fantasy strategy. \nGaon claims he is as hungry as ever to become the first ever back to back plancey and after gaining the 1st draft pick, he will be doing it with fantasy King Mccaffery who has stated his delight at being picked by a winning franchise, \"I am super excited to start working with Gaon...i know his tactics are a bit out there. As captain of a team it would be good to know who your kicker or defense is early on so you can train together. Gaon is well known to chuck anyone in at the last possible second, which will be a new challenge for me. However it will be better than last season with Sanford where, at any given point our best players would be traded for anyone with a cool name.\" Gaon know there is nothing harder in world sport than retaining a fantasy football crown...but with CMC he is beautifully placed to do just that. \n\n*Sac*\nSac will be reeling after last season. To go from champ to miriam bowl is in his own words, \"nothing short of disgraceful\". On a side note, a big congratulations to Sac as his family has continued to multiply in order to carry on his fantasy legacy (that is why People have kids right?). Sac has called the moment bittersweet as it meant Gaon would get the critical no1 spot in the draft. \nAmid the poor season, there was rumours of a championship hangover from the previous year with talks of infighting in the team as Sac would reportedly stumble around the training pitch with a six pack of beer and the plancey belt over his shoulder shouting expletives at his players asking why their not as good as last years model. After a brief stint in a rehabilitation facility after drinking the sorrows of the season, Sac is back clean and ready to go again. \nAfter Israel went in to lockdown, the government had ordered Sac to get his head back in the game and get back to winning ways. And Sac has built himself a good looking team from the draft as he looks to once again reign supreme for the state of Israel. \n\n*Freedman*\nFreedman has been licking his wounds throughout the pandemic.....there is nothing like losing the biggest game of the year. Having come agonisingly close the revenge tour starts this week as Freedman and his team look to bounce back in style. \nResults has always been the aim of the game for Freedman and he has been one of the stars of fantasy in the winning statistics. Nay sayers would quip that winning with style is more important and Freedman has always been painted with the brush of caring more about winning than anything else. \nFreedman has been fined by the league on multiple occasions during the offseason for breaking Covid protocols....rumours are he was round at Kyle Walkers house for a \"party\"... as usual Freedman has made no apologies whatsoever stating in his pre draft press conference that he was only here so he didn't get fined. \nThere is no doubt about it....Freedman is a proven fantasy magician and he will be looking to continue to dominate this year...\n\n*Polak*\nDaniel Polak is excited for the season ahead....after a second year running in the playoffs, the team narrowly missed out on the planceybowl and Polak is enjoying the progress. Having featured in two miriam bowls this is a whole new world with all kinds of sponsorships and money coming in. \nHaving seen his soccer team win the title for the first time during the off-season....polak was quoted saying, \"i have waited 30 years for this...there is only one thing that can top it....hanging the plancey belt above my bed...i want to be serenaded by the borehamwood choir....I want a special kiddush in my name as plancey champion with Robinsons orange squash and viennese biscuits...i want to shake everyone's hand like a machar like Steve Davis....i want to be given the freedom of the shul to do what I want when I want...i must fulfil my destiny as the plancey champion\". \nPolak has stated that the franchise must trust the process and continue to push on....\n\n*Kay*\nAnother fantasy season has passed Jamie Kay by without the coveted belt around his waist. Fans are starting to wonder if the franchise is cursed to never quite hit the heights of superstardom. Kay has once again moved the franchise to freshen things up.\nJamie was getting on with life during lockdown when all of a sudden a matter very close to his heart came the forefront of world news. The George floyd killing started a mass worldwide uprising with Black lives Matter heading up the revolution. Kay watched on for a few weeks... feeling a sense of duty and responsibility come over himself....it was only a matter of time before he would finally get involved, as he took his AK47 to the streets shouting White Lives Matter more!!!! Before being taken down by police, however, given his fantasy responsibilities he has been let out on bail. \nDespite these extra curricular activities, Kay is back in the hotseat, where he belongs, making another run for the post season and beyond. This season has become even more important given that he is part of the awesome foursome of owners who have yet to win the belt and the last thing Kay would want is to have someone win a second belt before he has won his first.\n\n*Lev*\nLev has been residing in his castle in North Korea throughout the pandemic in which, as expected North Korea had an unbelievable 0 cases of covid. \nThere was a period where supreme leader Kim jong un was rumoured to be in bad health and possibly dead. Consequently there were rumblings of lev being next in line for leadership, however, those were quickly quashed as Lev has too much responsibility with management of the fantasy team. \nLev still hasn't officially got his hands on the belt, which may explain the slightly altered auto draft strategy this season. This involved lev making taking off autodraft in the later rounds to ask gaon who he should pick...\nMuch like Burnley, for Lev the main aim to avoid the Miriam bowl, however, it is believed he has one of the strongest teams out there post draft and as per usual big things are expected. \nThe waiver wire was never a friend of Lev's albeit he didn't realise it existed until the last 2 weeks of last season. With the new plancey currency included in the waiver wire, it is fully expected that the money will still be untouched come the end of the season allowing him to buy Frank Gore for 100 plancey dollars. \n\n*Miriam*\nOh how the mighty have fallen! Who would have thought, the high commissioner...the founder....the man with all the early stage knowledge advantage...could possibly ever become Miriam. It was thought he was miriam proof having won the inaugural plancey. Low and behold, Miriam Livingston is upon us proving that hard work and dedication to the cause gets you absolutely nowhere in fantasy football...its a cruel game where auto drafting can be as effective as tinkering. As you can imagine Livingston was absolutely livid and has been in a strop throughout lockdown. However we must congratulate Miriam on the upcoming birth of a new member of the next generation of the borehamwood fantasy league...its a real shame the baby will be born under the miriam name. Thus is something Miriam will look to put right this season. \nWe have already noticed a change in tactic this season as this was the first year the league has not been treated to a \"i had the best draft ever\" campaign from Livingston. This change could spell a whole different outlook for our man this year and he will hope that he does not suffer the same fate....\n\n*Sanford*\nIf you are looking for quality fantasy moments look no further than our hero Benjy Sanford. Sanford has spent lockdown wondering how he was able to draft CMC and Cook and still not win the whole damn thing. The team at Elliott have been kept on for another year in order to facilitate another season. \nOver the summer the team has been working hard to build a strong draft strategy. After months and months of mock draft analysis, player research and predictions, they had finally developed a full proof draft strategy in order to pick the perfect team. \nThe best analogy for this would have to be akin to Donald Trump and the big red button under his desk. Much like Donald Trump, Sanford had the team around him in order to develop a strategy....He was debriefed... he was ready to put it in to action. \nUnfortunately they had installed a \"draft Fournette early\" big red button under his desk. No one knows why it was built in, but he was asked that under no circumstances was he to touch that button....we all know the consequence of this....as the draft began, Sanford had his notes in front of him, his laptop up....and then he wonders, why do I have this fournette button here....he puts in to Google, \"contrarian views on fournette's fantasy outlook\" and the rest is history....all thanks to Kyle at iwannasuckleanordsdick.com, Sanford has put himself as firm favourite for a record 3rd Miriam.\nAs the trade pick shook the draft room...the twitterverse went in to overdrive with only one man defending Sanford....Good old Orleans Darkwa....\nSanford has some work to do but who would put it past him and the fantasy strategy team at Elliott to pull off the impossible... \n\n\nAs usual Rabbi Plancey wishes you all a hearty mazeltov and luck in the season ahead...May the best team win and we will see you once again in the playoffs.....\n\n---"},{"id":19,"title":"2020 · REGULAR-SEASON REVIEW / Playoff opener","year":"2020","text":"*Sent 13/12/2020*\n\nAnd breathe (but make sure you are wearing your mask)....another regular season is in the books and that can only mean one thing....its playoff time!!! Planceys could become miriams....miriams could become planceys...we could have a first timer holding the belt...but not if the the old guard have anything to say about it....we have had the creation of a podcast...we have had last second knock outs....all with covid protocols in place. \n\n*Josh gaon* \nAs proven this year, the borehamwood fantasy football collective absolutely love a comparison.....we have compared players to Premier league managers, retailers and other such everyday randoms....so we couldn't go through a plancey times article without a comparison of our own....\nAfter his week 11 loss Joshua Gaon, much like the lame duck president Trump, refused to concede that it was mathematically possible that he was out of the playoffs with two weeks left and has superglued the plancey belt to his waist in an attempt to remain the plancey.... \nWhere oh where did it all go wrong for Joshua Gaon....the man who is always there for a helping hand when a trade is in its transitional phase or to set your weekly line up, couldn't quite translate that advice to his own team and could only muster up 2 victories before his fate was sealed in week 11. \nTMZ reported that josh was found stark naked under the bridge by mill hill east Station holding a bottle of jack Daniels whilst chocking on a laminated poster he had made of Russell Wilson after trading him just the week previously. Nobody expected this from the man who has dominated the league for the last 2 seasons and it just shows where things can go....one minute you are Freddie David, big time financial advisor to the community and donor to the shul and the next you are Freddie David, Chris' bitch in the showers...as they say....life comes at you fast....Nobody would wish a 2 win season on their worst enemy but that is what Gaon has to look at as he watches tape in a dark dark room wondering where everything went wrong. It has to be said losing CMC early on was pretty unlucky and josh had built up a strategy of building up rookie talent stating that he wanted to do a bit of an arsene wenger in b
