fbe","season":"2026","games":1,"pts":-1,"best":0,"avg":-1},{"player":"LAC","pos":"DEF","manager":"drjkay","season":"2025","games":1,"pts":-2,"best":0,"avg":-2},{"player":"IND","pos":"DEF","manager":"AlastairL","season":"2024","games":1,"pts":-4,"best":0,"avg":-4}],"lore":{"master":{"text":"# THE PLANCEY — BANTER BOT LORE (v2)\n\n*Knowledge base distilled from ~9 years (June 2017 – June 2026) of the Borehamwood fantasy NFL WhatsApp group. Organised by what the bot needs to **do** — react, roast, narrate, recall — not by where the material came from. Readable markdown for review; convert to JSON later.*\n\n---\n\n## CANON LEGEND (tag on every entry)\n\n- **[REAL]** — something a member actually said in the chat. Use verbatim for authentic voice; safe to treat as literal history.\n- **[MYTH]** — Plancey Post mythology (Daniel Polak's satirical inventions: prison sentences, sex tapes, North Korean statues). This exaggerated style **is** the house voice — riff freely in it, but never present it as literal fact.\n- **[FACT]** — verified real-world league history (champions, results, who lives where).\n- **[EVENT]** — a specific dramatic match-day moment.\n\n**Rule for the bot:** speak in [MYTH] tone, anchor to [FACT], quote from [REAL]. Never assert [MYTH] as something that literally happened.\n\n---\n\n## 1. CURRENT STATUS — as of June 2026 *(update this section most often)*\n\n- **Reigning champion: Alastair Livingston** — won his first *legitimate* Plancey (2025), beating Polak in the final. Holds the belt; \"missing the asterisks\" per Gaon. [FACT]\n- **Heartbreak story: Daniel Polak** — 2025 regular-season champion, top points scorer, No. 1 seed — chasing the triple crown, lost the final. The regular-season-champ curse claimed him. [FACT]\n- **Most titles: Saul Freedman** — 4 (2017, 2021, 2023, 2024), the only back-to-back champ. Still \"the GOAT.\" [FACT]\n- **Still beltless: Sanford, Polak** (Kay, Gaon, Sac, Levey, Livingston, Freedman have all won). [FACT]\n- **Off-season activity:** the **World Cup Sticker Draft** (June 2026) — a Panini-pack \"6-a-side\" fantasy format (4 pts a goal/pen saved, 2 an assist/clean sheet, minus for cards/own goals), plus a \"hate-watch\" sweepstake on the tournament's worst team. Gaon running it. [FACT]\n- **Recent life admin:** Kay, Gaon and Sac all had babies around 2024; Sanford moved back to London; Sac still the lone Israel resident; Lev still \"in North Korea\" / Canada. [FACT/MYTH]\n\n---\n\n## 2. TRIGGER MAP — input cue → banter to fire\n\n*The core reactive engine. When the user's message contains a cue on the left, the bot deploys the beat on the right.*\n\n| If someone says / mentions… | Fire this |\n|---|---|\n| a **kicker**, or a kicker scores/misses | Gaon's holy war on kickers — \"Fuck kickers!\", \"Abolish Kickers From Fantasy\" |\n| a **trade**, spreadsheet, research, \"I'll give you X for Y\" | Gaon the compulsive trader; \"nothing I hate more than being outdone by Mr Polak and Dr Kay\" |\n| a **close game / 0.02 / 0.1 / \"by a point\"** | Sac \"What a time to be alive\"; the 0.02 game; the Winter of '19 Tie |\n| **\"won ugly\" / \"did just enough\" / low score still wins** | Saul — the Mourinho/\"just enough\" GOAT |\n| **\"regular season is what matters\" / seeding** | Ally cope + the asterisk + the regular-season-champ curse (Polak 2025) |\n| **auto-draft / \"can't be bothered\" / forgot the line-up / no phone signal** | Lev — \"Does it auto-draft automatically?\", phone in the washing machine |\n| **GOAT debate / \"best ever\"** | Saul (4 belts) vs Kay (\"if it weren't for Freedman I'm the GOAT\") |\n| **a baffling line-up call / benching a stud** | Sanford — Orleans Darkwa & the Fournette button; Darkwagate |\n| **last place / wooden spoon / \"I'm so bad this year\"** | the Miriam; Sanford \"Miriam loves you all xx\"; the Sanford↔Gaon hot potato |\n| **time zones / \"it's 4am\" / a late game** | Sac fucked by the time difference; \"FUCKING DAVANTE ADAMS\" |\n| **a rule dispute / IR / loan** | Loangate (Ally + Sanford); Ally the accidental rule-breaker who runs the league |\n| **a championship / winning** | the rituals — open-top bus down Shenley Road, Shema Beni from the choir, kiddush with Robinsons squash & Viennese biscuits |\n| **Israel / a war / politics** | Sac the \"Israeli Ambassador\", Mossad hacking his waiver wire |\n| **North Korea / Kim Jong-un** | Lev the cult hero, statues, players fleeing death sentences |\n| **a wife/baby/anniversary \"ruined\" by fantasy** | Gila telling Polak to piss off; Elly's draft sabotage; the Izzy Sweepstake; Nicola the fantasy widow |\n| **someone bragging** | Kay — \"We've all made a century and taken 5 wickets in the nets. Doesn't bloody matter\" |\n| **a \"goat\"** (the animal) | Polak's Tyler Lockett \"goat-slaying\" incident |\n| **end of anything** | sign off: \"a hearty hearty mazel tov\" |\n\n---\n\n## 3. RIVALRY / RELATIONSHIP MATRIX — directional digs (X → Y about Z)\n\n*Banter's real unit is a dig aimed at someone. Read as \"Aggressor → Target: the angle.\"*\n\n- **Everyone → Livingston:** the **asterisk** on his inaugural title; that \"the regular season matters\" is cope.\n- **Everyone → Lev:** he wins/does well **without trying** (auto-draft, no research) — maddening to the grafters.\n- **Everyone → Sanford:** perennial **Miriam**; the Darkwa/Fournette line-up insanity.\n- **Saul ↔ Kay:** the **GOAT war** — Saul's 4 belts vs Kay's \"I'd be GOAT if not for you.\"\n- **Sanford ↔ Gaon:** the **Miriam hot potato** — passing last place back and forth.\n- **Gaon → Polak & Kay:** \"nothing I hate more than being **outdone by Mr Polak and Dr Kay**\" (trade rivalry).\n- **Everyone → Saul:** wins **ugly / boring**, \"a specialist in failure\" (his own jibe back at the critics).\n- **Sac → the time zone / Davante Adams:** his eternal nemesis, not a person in the group.\n- **Gaon → kickers:** his designated enemy.\n- **Polak → himself:** chief self-deprecator (\"being crap… again\"), narrator who roasts everyone including himself.\n- **Ally → Lev (rare respect):** \"Levs secret isn't auto-draft. **He nails the regular season**.\" [REAL]\n- **Group → Saul (2022 season):** the **Hamlin injury** ruling that \"the whole league fucked me.\"\n\n---\n\n## 4. GLOSSARY (tagged)\n\n- **The Plancey** [FACT] — the championship + physical belt, named after real Borehamwood rabbi **Alan Plancey**. The only thing that matters.\n- **The Miriam** [FACT] — the wooden spoon / last place, named after **Miriam Plancey** (the Rabbi's wife). \"Miriam duties\" = ritual humiliation for the loser.\n- **Plancey Bowl** [FACT] — the final. **Semi-Plancey** — semis. **Miriam Bowl** — the loser's game for the wooden spoon.\n- **The asterisk** [MYTH/REAL] — Livingston's inaugural title is \"asterisked\" (won on a first-season knowledge edge). \"TAKE THE ASTERISKS OFF THE BELT.\"\n- **The draft & sweepstakes** [REAL] — order decided by absurd means: the **Izzy Sweepstake** (guessing Livingston's daughter's birth date) and **Elly drawing/sabotaging Ally's picks**.\n- **Waiver wire / Plancey dollars** [FACT] — mid-season pickups + the in-league currency Lev never spends.\n- **Gaon Day (26 Jan)** [MYTH] — global trading holiday in Gaon's honour: trade \"without care or reason.\"\n- **Eatme Events** [MYTH] — recurring fictional playoff sponsor; \"broadcast on ESPN 8 the Ocho.\"\n- **The Plancey Post** [REAL] — Polak's documentary-style season write-ups; the bot's master voice.\n- **Champion rituals** [MYTH] — open-top bus down **Shenley Road**, **Shema Beni** from the Borehamwood choir, a **kiddush** in the champ's name, a mention in the **BES newsletter**.\n- **\"True woodites\"** [REAL] — the belonging test (barmitzvah in the Wood / went to Gila or Kol Rina).\n- **The triple crown** [FACT] — No. 1 seed + top scorer + the Plancey (Polak chased it, 2025).\n- **The two forgotten originals** [MYTH] — Rosenfeld & Jacob, \"brought zero banter,\" now \"pub quiz questions.\"\n\n---\n\n## 5. PROFILES + TAGGED QUOTE BANK\n\n*Each profile: who they are, signature gags, then a bank of usable lines. Expand the [REAL] banks over time for voice mimicry.*\n\n### Daniel Polak — The Commissioner / Plancey Post author / Miriam Bowl Specialist\nNarrator of the league. For years the \"Tony Pulis\" who only avoided the Miriam on the final day; finally became dominant in 2025 and lost the final. Wife: **Gila**.\n- [REAL] \"In all this excitement @Alastair Livingston and I have had the ultimate shit the bed off.\"\n- [REAL] \"Like Israel's enemies… I do not recognise the Miriam.\"\n- [REAL] \"Israel's enemies don't recognise Israel as a country, nor the Miriam as an event in the fantasy calendar.\"\n- [REAL] \"But tbh I do think about these things at 4am.\"\n- [REAL] \"I would have been banging on Saul's door at 4.30am to take the belt.\"\n- [REAL] (on Ally's 2025 win) \"A comfortable Plancey Bowl winner. Enjoy the open-top bus through Shenley Road followed by a Shema Beni rendition.\"\n- [MYTH] \"Trust the process.\" / served \"a prison sentence for cruelty to animals\" after the goat-slaying.\n\n### Saul Freedman — The GOAT / Leavemyarsalona\n4 titles, the only back-to-back. Wins ugly; \"playing the match-up.\" The benchmark.\n- [REAL] (during the '19 tie) \"Maybe there are some extra decimal points that the system doesn't show us.\"\n- [REAL] \"Oh thanks for the shout-out for best player of all time. Does that make me the GOAT?\"\n- [REAL] (on Ally's 2025 win) \"A new name on the trophy.\"\n- [MYTH] \"However we do it, the W is the most important thing. Anyone with a problem is clearly a specialist in failure.\"\n- [MYTH] \"3 to me, 4 for everyone else combined… RESPECT MAN, RESPECT!\"\n- [MYTH] the **Leveon Bell** trauma clause; the 6pm strategy; off-season \"dwarf porn.\"\n\n### Alastair Livingston — Commissioner / Not if but Wentz\nOriginal commissioner. Inaugural (asterisked) champ + first *legit* Plancey 2025. Verbose, poetic, accidental rule-breaker. Wife **Elly**, daughter **Izzy**.\n- [REAL] \"Levs secret isn't auto-draft. He nails the regular season.\"\n- [REAL] \"If you get the projections wrong you are auto Miriam.\"\n- [REAL] (2020 Covid gag) \"I don't care how many over-70s die… they'll go comfortable knowing fantasy football can continue\" → mock retraction.\n- [REAL] \"What would be the Hebrew name for Amon-Ra Livingston?\"\n- [MYTH] night terrors: \"I WON IT FAIR AND SQUARE, TAKE THE ASTERISKS OFF THE BELT!\"\n- [MYTH] coaching Izzy to chant \"Daddy is going to be the Plancey.\"\n\n### Gideon Sakofsky — Sac / Scrumpy Sac / The Israeli Ambassador\nWon 2018, then champ-to-Miriam. Lives in Israel → 4am watches, forever beaten overnight. Model of consistency.\n- [REAL] (the 0.02 game) \"What a time to be alive.\"\n- [REAL] \"I think we can all agree that 2020 has been the best year ever.\"\n- [REAL] \"Come share a whiskey with me and we can console ourselves together.\"\n- [REAL] \"Maybe I'll do a Gaon and let Saul choose my team for the playoffs.\"\n- [REAL] \"We've all made a century and taken 5 wickets in the nets\" — *(actually Kay; see Kay)*; Sac's reply energy: bone-dry deadpan (\"Slime cricket?\").\n- [MYTH] Mossad obtaining his login to make waiver-wire decisions; \"FUCKING DAVANTE ADAMS.\"\n\n### Josh Gaon — The Trader / loves a trade\nWon 2019 (after a debut-season Miriam). Compulsive trader, stats obsessive, kicker-hater. Wife **Nicola**.\n- [REAL] \"There is nothing I hate more than being outdone by Mr Polak and Dr Kay.\"\n- [REAL] \"Polak I'll give you my kicker for Ajayi, he's outscored him in the last 2 games…\"\n- [REAL] (cinematic '19 tie recap) \"Carson… powers through the d-line whilst screaming 'for SAAAUUULLL'.\"\n- [REAL] (on Ally's 2025 win) \"Deserved win… breaking that week 17 hoodoo. Missing the asterisks.\"\n- [REAL] \"Slime cricket?\"\n- [MYTH] offered \"his whole team and his girlfriend Nicola for Leveon Bell\"; trade rehab; \"My name is not Miriam\"; \"Fuck kickers!\"\n\n### Jamie Kay — Special K / The Medicine / The Doctor\nWon 2020. An actual doctor; waiver-wire genius who revives injury-hit teams. Perpetual GOAT contender. **Has never been in a Miriam Bowl** (point of pride).\n- [REAL] \"Hence why I'm above Sac and Lev. I've never been in a Miriam Bowl.\"\n- [REAL] \"We've all made a century and taken 5 wickets in the nets. Doesn't bloody matter.\"\n- [REAL] \"Champions! Long live Gary or Phil Neville.\"\n- [REAL] \"Congrats GOAT\" / \"the reminder of the goat incident made me laugh.\"\n- [REAL] \"Guys… I've quit medicine\" / \"Shows we're crap doctors. Hacks!\"\n- [MYTH] the David Johnson week-1 curse; the season he \"could only draft 49ers.\"\n\n### Benjy Levey — Lev / Autodraft Levey\nFinally won 2022 (redemption after a half-point 2021 final loss); champ-to-Miriam 2024. The indecisive non-trier who keeps doing well.\n- [REAL] \"Does it auto-draft automatically?\"\n- [REAL] \"Can you auto-draft?\"\n- [REAL] \"Completely forgot to revert back.\"\n- [REAL] \"First time I've had phone signal since 5pm.\"\n- [REAL] \"Don't say that. Remind you I lost by half a point last year.\"\n- [MYTH] phone in the washing machine; \"maybe\" on all six sides of his Magic 8-ball; doesn't know what sport his team plays; North Korean cult hero.\n\n### Benjy Sanford — Snaff / Miriam / The Shprutzrangers\nThe King of the Miriam; once the heartbreak near-miss (regular-season champ → Plancey Bowl runner-up). Catastrophic-but-lovable drafter.\n- [REAL] \"Why is no one fighting over Orleans Darkwa?\"\n- [REAL] \"Darkwa number 1 pick.\" / \"He needs a bit of Fournette in his life.\" / \"The Fournette of my year.\"\n- [REAL] \"The Winter of '19 Tie. We are lucky to witness such a miracle.\"\n- [REAL] \"I lost by the smallest of margins. I know I'll care later when I'm Miriam, but right now I'm just so happy!!!\"\n- [REAL] \"Shana tova. Miriam loves you all xx.\"\n- [MYTH] sacking his whole staff every loss (\"Black Tuesday\"); \"Antonio Brown I will get you for this!\"; the \"draft Fournette early\" red button.\n\n---\n\n## 6. HONOUR ROLL [FACT]\n\n| Season | Champion | Note |\n|---|---|---|\n| Inaugural | Alastair Livingston | the \"asterisked\" title |\n| 2017 | Saul Freedman | maiden (beat Sanford) |\n| 2018 | Gideon Sakofsky | brought it to Israel |\n| 2019 | Josh Gaon | first-timer (beat Freedman) |\n| 2020 | Jamie Kay | the Covid season |\n| 2021 | Saul Freedman | 2nd — the **0.82-pt** win over Levey |\n| 2022 | Benjy Levey | the great redemption |\n| 2023 | Saul Freedman | 3rd — \"champion and GOAT\" |\n| 2024 | Saul Freedman | 4th — first **back-to-back** |\n| 2025 | Alastair Livingston | first **legit** Plancey, beat Polak |\n\n**Miriam (wooden spoon):** Sanford = all-time king; Gaon (2017 debut) & Sanford share the hot potato. Champ-to-Miriam falls: Sakofsky (post-2018), Livingston (2019), Levey (post-2022 → 2024).\n\n---\n\n## 7. CRITICAL MATCH DAYS [EVENT]\n\n- **The Winter of '19 Tie (3 Dec 2019)** — Saul vs Gaon, final regular-season game at 4am; Wentz's kneel-downs produce the league's only tie, deciding the byes. \"What have we just witnessed???\"\n- **The 0.02 Game (8 Dec 2020)** — Sac edges ahead by 0.02 off a late fumble, repeatedly. \"End the game now! Shake hands and walk off.\" → \"What a time to be alive.\"\n- **The 0.82 Title (2021 final)** — Saul's 2nd belt by 0.82 over Levey; peak \"just enough.\"\n- **Lev's Half-Point Heartbreak (2021 final)** — closest final ever; fuels his 2022 redemption.\n- **The Back-to-Back (2024)** — Saul, first repeat champ (4th title).\n- **Livingston's Redemption (2025 final)** — beats Polak; sheds the asterisk; Polak falls to the regular-season-champ curse.\n- **Loangate** — Ally & Sanford's illegal loan/IR deal; Ally fined + \"50 hours leading the children's service.\"\n- **Darkwagate / the Fournette button** — Sanford's baffling fixations; shorthand for a mad line-up call.\n- **The Hamlin Injury Controversy (2022)** — league ruling against Saul; his grudge fuel.\n\n---\n\n## 8. TONE CHEAT-SHEET\n\n- Voice = ESPN-documentary mock-grandeur (Polak's Plancey Post): invented backroom staff, fake fan interviews, absurd geopolitics.\n- Mockery is the love language — no insult lands without underlying fondness.\n- Lean on Jewish/Borehamwood texture (shul, kiddush, mazel tov, the Wood).\n- Sign off big beats with **\"a hearty hearty mazel tov.\"**\n- Speak [MYTH], anchor [FACT], quote [REAL] — never present mythology as literal history.\n","meta":{"generated":"2026-11-27T17:50:19.248Z"}},"archive":[{"id":1,"title":"2017 · In-season — The 'Thameslink' trade-dispute rant","year":"2017","text":"*Sent 24/10/2017*\n\nMy fellow thameslinkers....we have a trade in our midst that smells of something rotten. As can be seen above we had agreed that trades and all that goes with them will be put on the group in order to ensure the integrity of the league remains intact. This has not been done in the trade in question and since being picked up by jamie kay earlier this evening, both parties have had the opportunity to reply and discuss why it is a worthwhile trade for both. Given the lack of transparency and therefore fear of potential collusion and given that both parties have had ample opportunity to provide evidence for the trade and have both not come forward with any sort of solid justification.....I move to veto this trade....the rules created by the commissioner require 5 people to veto....i shall be the first to say I am using my right to veto this trade...\n\n---"},{"id":2,"title":"2017 · REGULAR-SEASON REVIEW / Playoff opener","year":"2017","text":"*Sent 05/12/2017*\n\nHere we are then it is week 14 and the start of the business end of the journey to the Plancey bowl. The regular season ended in spectacular fashion seeing the sort of magic and excitement “survival Sunday” would be proud of. After some incredible collapses from middle of the season favourite Josh Gaon (losing all of his 6 second round games) and Daniel Polak (losing 5 of his 6 second round games) it created the opportunity for those who may have believed their season was over to climb up the league and into playoff bliss. *Jamie Kay*, had the first pick in the draft only to see his 30 point a week shoe in David Johnson go down with a season ending injury in the first week. Nobody would have blamed him for giving up, however through perseverance and strong waiver pickups (and a few more season ending injuries) he managed to pull himself back in to playoff contention and on to a 5-7 record going  in to the final week of the regular season, only to pull off one of the performances of the season when it really mattered. On paper last seasons regular season champion may not have the strongest team, but he has built a side of secondary players stepping up to the plate after the main starters have become injured or left. Therefore don't rule out special K just yet. \nNow what may be the story of the regular season. *Not if but wentz* were the team to play in the first round of games in the regular season. The reigning champion had a mixture of season damaging injuries and crippling bad luck that saw him rooted to the bottom of the league. Despite scoring in the higher echelons of the league in terms of points it seemed everyone turned up when playing the champ. However, as the weeks came and went amd using his superior nfl knowledge and his consistent waiver priority to pick up one of the strongest line ups heading in to the playoffs. \nNow 3 weeks ago *Sacofsky* was planning for his extended vacation and time with the family with no hope of playoff action for his boys. However, in this league 3 wins on the bounce will take you places and so it did. 3 massive performances, thanks to a couple of strong trades and his boys coming good at the right time saw Sac book his place in the playoffs. The last and most important win against Josh Gaon going to the final quarter of monday night football after some deadline day trading activity. Sac has been hurt right at the end of his match ups before, so we have no doubt he was sweating at the end of this one. With Wilson, Brown and Kamara on fire expect to see Sac meandering his way through the playoffs to a possile plancey bowl appearance.\nOn draft day, if we were making our predicitions over which player debutant was likely to make the playoffs in his first season there would have only been one answer. Josh \"loves a trade\" Gaon had brought sheets upon sheets of research to his first Borehamwood draft. *Lev*, on the other hand, could not even muster up the 2 minutes it takes to register his team, leaving it to the league commissioner to do. However, in true Lev fashion, its not about getting there as long as you reach the required destination. Lev has quietly gone about his business jumping on the back of a strong season from Dak only to have stayed on the ride a bit too long. However, big nights from Jones and Hopkins give Lev's team the ability to go big on any given night....just ask Gaon. A strong first season by any standards, anything from here would be magic. \n\nThe bye week lads\n\n\nThe regular season belonged to one team and one team only. The *shprutzrangers* have had an absolute stormer of a season the likes of which have not been since since last season with Jamie Kay. Zeke, Ingram and Smith have made this team almost impossible to beat during the regular season. However, some dodgy trading decisions have meant that the team is a little more depleted going in to the playoffs, however only a fool would not give them a chance to go all the way. As Mr Kay would attest, the regular season means nothing if you cant go all the way and some slightly poorer performances in the lead up to the playoffs lead people to wonder if he can claim the coveted belt. The stats dont lie...he rarely loses and he rarely goes under 100 points....Write him off at your peril. \nThey often say that over time dogs and owners begin to look alike. This couldnt be more true for the second of our bye week teams. *Saul* has created a team in his image, he has pushed them to be the leagues most efficient outfit playing the match up and not getting ahead of themselves. Scathed throughout the league much like a Mourinho team, Freedman’s style of play has been criticised and admired throughout the league. Saul looks to be saving his best scores for when it really matters as he took advantage of a desperate Josh Gaon to secure what may be the trade of the season. We make leavemyarsalona favourites for the Plancey without blowout victories...however knowing saul he will probably do just enough.\n\n---"},{"id":3,"title":"2017 · Round-1 preview — Levey vs Sac","year":"2017","text":"*Sent 07/12/2017*\n\n*Levey vs Sac*\nIts kept in the family in the first of our matchups as the Scrumpy Sac face off against the cleverly named....Levey.\nLevey will have much to prove against a resurgent Sacofsky as he is the team in the playoffs with the lowest regular season record. As first cousins it was a beautiful thing to watch as the Sac victory meant that by virtue of the mini league Lev would secure his place in the playoffs at the expense of Gaon and Polak. We have been told Stephen, Daniella, Charlie and Karen are having a metsuyan dinner to celebrate this act of family love. But family ties go out the window come thursday night as each will seek to continue their playoff journey. \n\nBased on recent form, on paper there looks to be only one winner as Sac looks to continue his hot winning streak that saw him win his last 3 games and sail in to the playoffs as the 3rd best team. If Lev wants to make his mark he will most likely have to rely on a big night from one of his studs. \nA first season and a first playoff appearance for Levey has left the fans, who have coined themselves “The Levites”, in absolute delight. All wasn’t well at the start of the season as we reported on the fans bewilderment with the new boss at the helm given the teams acquisition by Benjy Levey. We interviewed one fan who asked to remain anonymous, “I just can’t understand the acquisition it seems like he doesn’t understand football and is only in it for the money from the Plancey name for his catering business”.\nHowever, Levey has really grown in to the role, after making the shock playoff berth another fan stated, “It is just unbelievable, this has made my year. I didn’t expect it and the boys down the local definitely were not expecting it. It is not easy supporting a team like Levey, at times it seems like the boss doesn’t care at all. I live in the USA so I set my alarm for 4am every Wednesday morning to check the transfers we have made and to my horror the boss misses his spot on the waiver wire time and time again! A lot of the fans started to boo the lads off the pitch when things were at their worst. But the board backed him and in Lev we trust. It was sometimes nervy, having 5 inactive players in the starting line up with 5 minutes to go until kick off, but he always seems to get there in the end, COYL!”. \nComing under fire for a possible lack of focus on the team, Levey told the fans to “Trust the Process” and it seems it has worked out, but the real work starts now. \nLevey has had some serious QB issues recently with Dak being so dependable for so long only to have fallen off in recent weeks, Goff was picked up on the waiver but he has a tough matchup this week vs the eagles. Therefore expect Dak to come back in against a poor Giants. From Sacs side of things Russell Wilson has grown in to the season massively to become the no.1 ranked QB in fantasy. He has a tough matchup vs Jax but when you are Russell Wilson the matchup can sometimes be irrelevant. \nFrom a Wide Recievers standpoint this is where Levey can take the game by the scuff of the neck, his two stars in Hopkins and Jones both provide massive opportunities to take the game away from any fantasy team out there. Its the inconsistencies and lack of forn that may provide Levs undoing in this one. Against Sac you will need your WR’s to perform just to keep pace with the back in form Antonio Brown. If he continues his strong fantasy scores of late that could be lights out. \nFrom a RB perspective there will only be one winner on paper. The Scrumpy line up of Howard and Kamara (a team made in Gaon heaven) with good matchups are going to be very difficult to beat. However, Lev has great matchups for his boys with Miller playing the 49ers and Lewis facing Miami therefore it isn’t a complete foregone conclusion. Watch this space. \nFrom a TE and Kicker perspective, lets be honest if you don’t have the best…who the fuck knows what going to happen, its Cook/seferian Jenkins vs Walker/Henry and having owned the majority of these guys at some point in the season, it could be 1 point or it could be 10, I refuse to predicting anything. Lutz vs Forbath seems a little bit of a consistency vs potentially large score. Lutz has been one of the most consistent kickers this year always around the 8 point mark, whereas Forbath has hit 22 points at one point this season and yet last week he scored 2. Very tough to call. \nFrom a defensive standpoint the Ravens are higher ranked than Denver but facing Pittsburgh looks to me to be a bit of a difficult one although, Big Ben loves his interceptions. \nAll in all, I think Sac on current form should take this one to then go and face this seasons Plancey favourite Leavemyarsalona in the semi Planceys. There is already some bad blood there with Leavemyarsalona only slightly beating Sac over both games in the regular season. On the other hand Lev knows his boys need to do so much better than last week, he will be hoping his big boys perform to give the Levites another week in the sun. The stage is set for the two cousins to go to battle…..\n\n---"},{"id":4,"title":"2017 · Round-1 preview — Not if but Wentz vs Special K","year":"2017","text":"*Sent 07/12/2017*\n\n*Not if but Wentz vs Special K* \nLast years Plancey bowlers will reignite their feud this week to secure a place against the Shprutzrangers….For Jamie Kay, he will be looking to exact some revenge….\nNot if but Wentz fans were starting to wonder what went wrong at the beginning of the season, “I have been an avid fan for the last 1 year and 3 months and I wanted to support a winning team. Livingston had taken us to glory last year and received a lifelong contract on the back of that and I think it got to his head. We started the season with high hopes, Livingston had told us that he had the “perfect” draft. But we just kept losing. I had to pull sickies at work on Tuesdays, everyone was just taking the piss it was unbearable. But Livingston has certainly pulled his finger out and got us back to playoffs where we belong”. \nLivingston will be looking to get himself a semi Plancey place against regular season champs the Shprutrangers. But standing in his way is a resolute Jamie Kay on the back of a 150+ point week in a clutch performance for the ages. He will be looking for some revenge for last years Plancey bowl. Kay lost his First round draft pick early on in the season and had spent the rest of the season in a pessimistic lull, however, a late flurry has turned Kay and the fans back in to believers, they are so excited to be back in the playoffs. We got in touch with David Johnson, “I was so upset to pick up an injury so early on in the season for the gaffer. I called him up in tears to tell him the news. We sat up all night crying and trying to work out a way we could make it work. He offered to put his medical career on the line to give me a doctors note to say I was fit to suit up but I couldn’t do that to him. I was so glad he allowed me to stick around with the team in a coaching role to encourage the boys to keep believing and keep going. I was so excited to see the lads clutch performance. I will be there this weekend at JK’s side if he needs me for anything. We can do this!”\nIn the QB positions Special K have had problems for quite some time due to injuries meaning that streaming based on matchup has been the only option. Currently on the roster we have Rivers and the recent pickup of McCowan. It is hard to say which of the two Kay is going to go ahead with, it seems McCowan vs Denver is the better matchup this week aswell as being in good form. If picked, Kay will be hoping for another 30+ week. Livingston has his pick of either Cam or Cousins. Cousins my have the better match up but as seen this season Cam can go big on any given night. The fans await a decision from both managers on the QB position, keep refreshing for any last minute changes. \nFrom a running backs perspective it may not look pretty but don’t count Kay out of this one. Drake, Williams and Burkhead whilst not household names have strong match ups and a lot of touches. Fournette and Gordon have performed better, but given the match-up it is actually a tough one to call based on recent weeks. \nFrom a WR perspective Fitzgerald and Thielin have strong matchups, with Thielin expecting a big week this week at the expense of Diggs…again. Cooks, Anderson and Jeffery provide solid options for Not if but wentz, in strong match ups. Therefore this will also be a hard one to call. \nFrom a TE perspective Kelce had a monster start last week which was the trigger for a massive week for Special K and he will be hoping for the same again. As studs go Kelce is the one for Special K and he will be hoping for a strong performance to see him through. Engram has also had a strong year ranking in at 5th overall. He had a big week last week and Livingston will be hoping for the same again against a poor Dallas side. \nIf you are in to your kickers this week is the match up for you, we have the 1st and 2nd ranked kickers in this one Greg the leg vs Gostkowski. Expect big numbers from these two regardless of matchup. Greg has been a kicker performing like a top 10 running back this season and constantly hits double figures. But Gostkowski vs Miami turns this in to a real Kickers matchup like which we may have never seen. \nSeattle vs the Steelers in Defence is quite a tough one to call both strong and both have big number abilities. The Legion are depleted but still managed to post good numbers vs eagles so I am going to go with them in this matchup. \nOverall, this could turn in to a very close contest, Kay has built himself a strong team through the waiver wire and is taking it week by week, he will need a week like last to get through I feel. Livingston has got his team back on the winning trail when all looked lost at the beginning of the season. I put Special K as slight underdogs for this one…The Shprutzrangers await….\n\n---"},{"id":5,"title":"2017 · Semi-Plancey preview (part 1)","year":"2017","text":"*Sent 14/12/2017*\n\nWe have had last quarter wins, we have had the dramas of the final week and we have had some stonker game weeks.....and then came week 14.....the biggest news being that the champion has fallen!\nIt would not have been outrageous at week 7 or even week 10 to say that, by all accounts, the favourites to miss out on the playoffs were special K and Levey. The respective owners may not have disagreed with you...but here we are at the final four and both will most certainly have eyes on a achieving the unthinkable. We are at the stage where pretending your not good enough to go all the way is no longer a viable option. The stakes are high but the reward is nothing short of incredible glory. \n*Special K vs The Shprutzrangers*\nJamie kay may believe he was robbed of what looked like a certain Plancey win last year and therefore, revenge could not have been sweeter as his team performed for him once again to take one step closer to redemption. He will now look to slay the mighty shprutzrangers and after defeating Livingston in the final round, who would bet against them now! \nI kid you not, through the first 8 weeks of the season Williams combined for a total score of just over 5 points. Given injuries and thus a move up in the pecking order, he has been nothing short of an absolute beast since. He could be seen as one of the pickups of the season and is testament to the work Kay has been doing at the franchise. There has been alot of investment in the scouting set up and the fans have really bought in to it, “if you had told me that our team would have drake and williams as RB1 and 2 going in to the playoffs I would have laughed you out the building, my days has the boss come through for us”. Now nicknamed “The medicine” for taking a team packed with injuries to their second semi plancey in 2 years, Kay will be looking to make it a second Plancey bowl appearance in 2 years against sanford. \n\nBenjy Sanford has had quite a year. He is looking to achieve the incredible feat of Miriam to Plancey in the space of just one year. The Shprutzrangers made short work of the regular season coming in to the playoffs on the back of a 10-3 win loss record. But being regular season champ and owning the Plancey belt are two different matters altogether. \n\nOn the back of massive years for Zeke and Smith along with the emergence of the Jaguars D, the shrutzrangers have been formidable. We got in touch with a fan, \"After last season, I am not sure how sanford didnt get the sack. It seems he was more interested in Tinder and Jswipe than putting out a decent team last year. However, i heard the gaffer got engaged in preseason and you can see its really given him a renewed focus. We have gone from no-hopers to champions elect in no time\". \n\nThey say to win a Plancey it takes nerves of steel. The fans were up in arms mid season where maybe a little inexperience showed in a trade with Josh Gaon. Giving up Zeke mid season made sense and so it proved, however giving up Howard was another thing altogether. We caught up with Howard, \"we had a beautiful thing going, I was playing well in a winning team. We all knew the boss was looking to offload zeke given the suspension. I was in prime position to become the teams RB1. I had to pull over when i got the call i was on the move, to Gaon of all players. I was told by other players that the move meant I was probably on the move again quite quickly and so it proved. My performances have been effected and Sanford has turned me in to a league journeyman\".\nInterestingly, in the lead up to the Semi Plancey there have been rumblings in the Shprutzrangers camp, a team that has been so used to hitting over 100 points have come in to the playoffs on the back of some below average performances. There is no doubt there has been a slight drop in form, however, in his week 15 press conference, Sanford looked to calm the Shprutzranger fans, “We are the regular season champs, we fear nobody going in the playoffs and we will come good when the pressure is on us again”. There has been news of internal issues within the team with a source saying, “The player have become tense as the season has dragged on. They know they are the best team, but they are scared of what Sanford will do next. It seems Sanfords trading reputation has left even the best players in the team worried about their place and you can see it in their recent performances”. \nWe have been told Sanford was extremely upset that he couldn’t get through a big trade before the trading deadline with Gaon. The reports have stated Sanford was offering Smith, Ingram, Hill and the Jacksonville Defence for Ricky Seals-Jones. Supposedly Sanford pulled the plug in the 11th hour in the view that he had no more studs to offer to get his man. \nThis is a match-up of epic proportions, where a team very used to a playoff run go up against a team playing their first ever playoff game. Who will hold their nerve….\n\nTo the match preview…. \nQB’s- Smith vs Rivers – We have a QB shootout in this one as KC face LAC. Kay picked up Rivers from a QB heavy Livingston prior to the playoffs, only to have him slay his old owner in Week 14. Kay will be hoping for a continued run this week. Sanford has proven slightly more cautious of his early season MVP Smith. We expect Sanford to put his faith in his man to get him to his first Plancey given the possibility of huge numbers if the day is right. \nRB’s- Sanford used to have a plethora of talent in this position, this week he looks to be playing the matchups and the form guide as Riddick is picked up off the waiver wire and straight in to the first team….Sanford has had immense good fortune with these picks leading to some questions of having friends on the inside. Riddick has performed strongly in recent weeks and Sanford expects this to continue. Ingram is first name on the teamsheet, despite sharing with Kamara, he still puts up strong numbers for Sanford and against the Jets he expects to do the same. \nKay will stick to his dream team of Drake and Williams as his RB1 and RB2, they got him this far, why change it now. Both have been putting up MVP level numbers in recent weeks and if they do it again, expect to see another preview for Jamie Kay next week. Kay currently has Collins in the RB3 position and who can blame him when he is up against Cleveland. Kay knows how to play the matchups and it has worked in his favour, he won’t stop now as he smells blood. \nWR’s – Sanford keeps his faith in Landry and Hill who have served him well throughout the season. Landry is on the back of a 20 point game and will be looking to do the job for his gaffer against Buffalo. Funchess has been posting double figures for quite some time now, we expect this to continue vs GB. Hill will be looking to give Sanford a double point bonus by connecting with Smith this week. The matchup vs the Chargers give them an opportunity, it just depends what KC turn up. Sanford will also be hoping the ball is thrown Hills way as opposed to one Travis Kelce. \nKay will once again stick with Fitzgerald and Thielin. Thielin continues to put up big numbers as he connects with Keenum, expect that to continue this week. Fitzgerald has a good matchup vs the Redskins, when he has a good match up he has the potential to go big. \nTE’s- Graham has a shocker last week, he should come back stronger this week despite the tough matchup vs LA. However there is very little comparison with what Kay has in his locker. Kay boasts the no.1 TE in the league on current form in Travis Kelce, he goes in to this week with a strong matchup vs the chargers (it is starting to look like KC vs Chargers will decide this matchup). If he goes big, he can win Kay the match up. Watch this space. \nKickers- Succop has served Sanford well this season and against the 49ers there could be ample opportunities. However Greg the Leg is far and away the Kicker to play, he should get in to double figures for Kay again this week. \nDefence- Jags all day every day. They are so strong and constantly post big numbers regardless of matchup, Kay is once again playing the matchup against the Jets, and who knows after mcCowan had such a poor week last week, he expects more interceptions. \nThe experts have a Kay victory on the cards. The Shprutzrangers are the regular season champs, their fans will hope they can bring their regular season form in to the playoffs. If they come alive, expect a big score.\n\n---"},{"id":6,"title":"2017 · Semi-Plancey preview (part 2)","year":"2017","text":"*Sent 14/12/2017*\n\n*Levey vs Leavemyarsalona* \nWhat we have here is a matchup of two non-believers. Prior to the first season of the Plancey, freedman seemed happy to make up the numbers, auto drafting his team and was found asking, “hang on...does this mean we have to sort out our line up every week....allowwww!” however, freedman now eats sleeps and breathes fantasy football, plotting and planning his way to superstardom. Levey was of the same ilk, it isnt necessarily that he didnt want to get involved it was more fear of the unknown. He had heard of the time and effort required to perform in fantasy football and given that his phone is often broken or sitting in the washing machine, one start button away from being broken, he feared this world wasnt for him. It is fair to say that they are both believers now and to get that coveted Plancey place you will need all the belief you can muster. \nIf you didn’t see it on the news, the North Korean streets were lined with Levites after the magic of Sunday night. It was widely reported that whilst Hopkins was the star the show, it was the brilliance of Kim Jong-Un, plugged in as QB, TE and Defence for Levey last week,that stole the show and won the game for them. The highlight being the final play of the game where Kim Jong-Un threw a 90 yard pass towards the end zone, only for Kim Jong Un to run the 90 yards in 3.4 seconds to comfortably catch the pass in the end zone. Who are we to argue with that. \nThe miracle Levey has performed to get to this point will go down in fantasy folklore. At the start of the season some said Levey was an amateur and didn’t know what he was doing. He is the only player not to make a single trade during the season. However, given his playoff run, his tactics have now been marveled throughout the world. The tactic has been coined the “comfort in your team” strategy and it has been rumored Levey has written a book with the same title, coming to your nearest Waterstones in the new year. There is talk that Josh Gaon has pre ordered 50 copies. \nLevey will look to continue to perform miracles this week against the favourite for the Plancey, Saul Freedman, we caught up with some Levites this week to see how they are feeling, “This is madness! The playoffs were bonus enough in our first season with a new owner. The Semi- Plancey’s too! Whats next…The Plancey?! We thought Levey’s reputation for being indecisive would affect his ability to manage this team, but it has been to our advantage! We all thought having retired players on our roster was just a sign of someone not knowing what he was doing. Scap that! Its clear now that this was all mind games. We love you Benjy Levey, sign up for life!”. \nBenjy Levey will go in to this game with absolutely no pressure whatsoever, however, for Saul Freedman it is lose or bust…..\nIt is crunch time for Leavemyarsalona as they suit up for the Semi-Plancey in which they may well believe this is their moment to take home the coveted prize. Freedman has been hurt before in the playoffs in the shape of Leveon Bell, but we are pretty sure he is over that now….he doesn’t really talk about it much….its not like he would put a clause in a trade to ensure he never sees him again…he isn’t really superstitious like that…..\nFreedman comes in to the playoffs on the back of a strong 9-4 win loss record in the league. That makes them one of two teams in the playoffs who finished the regular season with winning records. The jury is still out on what it says about the league itself, but it made for some fantastic viewing. \nAs stated in the previews last week, Saul has built his team in his image and have turned themselves in to the leagues marmite….He has been hit with criticism from all angles but when it comes to fantasy football it is getting that W at the end of the week which is all that matters. In his trade with Josh Gaon, Saul managed to pick up D Freeman, who, it has been widely speculated, is actually freedmans father. When entering the NFL D freedman missed the “D” off his surname accidentally when registering and the name has stuck ever since. It was a beautiful thing to see the family back together. However it has caused problems this week in the camp as the father and son duo have been papped for all the wrong reasons. Freedman is well known to have a strong relationship with his team, that is why his philosophy is so engrained in their minds. In last seasons playoffs, Freedman had his boys on a strict regime to keep up fitness and concentration. In an attempt to exercise the demons of last year, Freedman has removed the curfew and has taken his boys back to his old stomping ground of Birmingham for a week of drinking and partying in an attempt to calm the playoff nerves. Unfortunately on a night out at PRYZM, the freedman’s were pictured performing the infamous dentist chair drinking game. Being Saul, he has refused to apologize to the NFL stating that it is all part of the process to ensure his team are in a winning mentality come Thursday night. There have been other rumblings of members of leavemyarsalona causing problems in Birmingham this past week, Keenan Allen was fined for pissing on a homeless person outside G casino, with McCoy and Green caught in a drug fueled orgy with Birmingham’s own granny hookers.   \nA bold tactic by Freedman and we will have to wait and see if his boys come in to the week feeling relaxed and refreshed in order to erase all memories of last season, which Freedman is clearly over by the way. \nFreedman, has built himself a strong team, he has had very few bumps on the road to the playoffs and getting himself in to the Plancey and then going on to win it would cap off an almost perfect season. \nTo the match preview…..\n\nQB- Lev has put his faith back in to Dak and will most likely continue to do this. He has his bumps through the season, but performed back to his best last week. Saul however, had a nightmare bye week. Having picked up the no 2 QB this season in the trade with Gaon, Wentz only went and got himself injured. Freedman has been quoted saying that there was a complete miscommunication in Wentz’s first team meeting, he was told to take it easy for week 14. Whilst a big loss to an already strong lineup, Keenum will seamlessly come in with a strong matchup vs the bengals. \nRB’s- McCoy has a strong match up vs Miami and will likely score well this week, Latavius Murray has been a bench player for the majority of the season, however, he has breakout ability given the amount action he sees. Devonta Freedman, back from injury, is also expected to post big numbers for his son this week.  \nLevey at the moment is looking to play Gore against his previous employers, which is a possible story in the making. Miller will have a tougher time against the Jaguars D (which given his Houston dependence may cause him issues this week). Lynch has an interesting match up vs Dallas and given his strong fantasy pointage in recent weeks could prove strong for Levey. \nWR’s – As stated last week Jones and Hopkins have the potential to go big, last week it was Hopkins, but if I was going to predict, this week it will most likely be Jones, what a matchup he has against the Bucs. He has proven he can go big and against Leavemyarsalona he is going to need it. \nGreen and Allen provide Saul with excellent options in the WR roles, both have difficult matchups but with these guys it is often not the matchup but simply the mood they are in. \nTE’s – Gronk vs Cook seems like a no contest, although Cook has performed recently for Levey so you never know. Gronk is back from his suspension and will look to make waves for his new head coach. \nKickers- Once again who the fuck knows. \nDef- The broncos have been strong recently and Levey will need another strong performance vs a poor Colts team. Saul is currently playing without a Defence and in the words of pepper brooks, “it’s a bold strategy cotton, lets see if it works out for them” (since the writing of this he has inputted the Detroit lions in to his team, but how can I possibly take out a fantastic dodgeball joke). \nThe stakes are huge, Levey has already shaken the league to its core, can the Levites pull them through once again to play in the match where legends are born. \n\nTo finish off we have a message from the almighty Rabbi Alan Plancey who wishes you all a hearty hearty mazel tov on getting this far…..\n\n---"},{"id":7,"title":"2017 · PLANCEY BOWL preview — Leavemyarsalona vs Shprutzrangers","year":"2017","text":"*Sent 21/12/2017*\n\nThe hours, the days of chopping and changing, trading and sticking, all lead up to this. Gentlemen, welcome to the Plancey Bowl 2017. The second Plancey bowl in history. The game where mere men have the opportunity to become immortal. And it all begins this thursday night. The season has had its twists and its turns, as the Borehamwood boys become more confident in their fantasy decisions. We saw trading like we have never seen before (Thanks Gaon). We saw a final weekend the likes of which we may never see again. But all of the memories and the highlights will take a back seat as one man will look to take undisputed ownership of the Plancey belt and put himself in to the hall of fame as a legend in his own time. \nLast season saw Livingston take the belt in a well fought contest. However, after losing in the first round of the playoffs he will now be handing the belt over to the eventual winner of this sloggfest. \nIt seems only right that the only two teams with winning records fight it out for the plancey. There were rumblings of possible shocks from Levey and Special K, but it was not to be as Saul confirmed his squads strength going in to the playoffs and Sanford reminded the rest of the league why he was regular season champ quashing rumours that it would all fall apart early on post regseason. For Levey, the team were stretched as he was somewhat destroyed. However, it was reported in North Korea, that whilst Kim Jong-Un had a relatively quiet game of 8 TD passes and 3 rushing TD’s Levey made short work of Leavemyarsalona and look forward to their first plancey appearance. Kay also had a poor week by his recent standards however, that difference in class will show at this point of the season, as even a quiet night by Sanford’s standards was enough for the W. \n\nWe caught up with Sanford earlier this week in the plancey press conference, \"its an amazing feeling to be in the plancey, when you get to these points in your life you need to take a step back to thank all the people in your life who have got you to this point  Thanks to my family, my fiance and all the players in the shprutzrangers. But most of all i want to the thank the lads at mclagan for all the hard work on this fantasy team this year. Jason on trading decisions, mark on scouting and development, david on weekly lineup decisiions, jeremy on waiver wire picks, kevin on draft planning and strategy and paul on waiver research. Without all of you we couldn’t have got this far”.\n\nWe caught up with Sanford’s  fiancé, “is this week really the final week? I can’t believe it, he is actually going to have to talk about something else with me now. If he thinks he is bringing this belt to our apartment he has another thing coming”. \n\nSanford has without a shadow of a doubt been the best this season. Consistently scoring above 100 points. Sanford had previously booked to take the squad to birmingham for the week leading up to the plancey, however, all football teams have been banned from the City after Freedman and his boys trip in the previous week. Sanford said, \"i wanted to take the lads to the City where i performed my best work....if you know what i mean. However, in what can only be classed as pitiful mind games by leavemyarsalona, we have been banned. It will have to be bournemouth, i spent many a weekend there in my youth at the big family weekends away. Its just a shame the ambassadors isnt still open, I had told Mark Ingram about the dolphin in the pool and he was so excited we were going to bournemouth to see it. I didnt have the guts to tell him it had closed down years ago. \nThe shprutzrangers were nothing but charming on their trip away visiting many an old age home and the beaches, sigining autographs for local fans. Sanford has stated that his boys are raring to go and will do all it takes to get the belt and take it to NY. Few teams have caused sanford problems this season, he will face his toughest test to date vs a very strong leavemyarsalona team that is coming off a 140+ week.\n\nFreedman has got himself to a plancey and he couldn’t be in better shape for it. His team are firing on all cylinders and should fear absolutely no one.\nIn his plancey presser Freedman said of his opponent, “If all his players have as Low a centre of gravity as he does, we are screwed”...homage to the famous sanford backside. He added, “we have heard rumours that this is the only coach in fantasy football where the manager has the cheerleaders on speed dial instead of the players”. Clearly trying to get inside the head of the old poor performing Sanford of last year. \nAfter the debacle of Birmingham, we are expecting fines and suspensions from the league however, none will come in to effect until next season. We also await to hear if Freedman will have a touchline ban imposed after he ran on to the field to celebrate his father scoring a touchdown. In true Gazza style they performed the dentist chair celebration, there were yellow flags flying all over the place it was a sight to see. \nFreedman has found a formula that works after last season and he is sticking to it. Therefore, the squad have been in Magaluf this week preparing themselves for the plancey. It seems the lads have been at it again with McCoy and Murray papped bathing in their own vomit outside BCM. \nThe regular season was built on scoring just enough points to win matches. Fans loved the wins but hated the style of play. Freedman seemed to be not too bothered by all the fuss. In his view it’s a results based industry. But he had a trick up his sleeve in the shape of Josh Gaon. In one double week based trade (its gaon, it had to be a staggered trade) Freedman has turned his team in to monsters. Since the trade they have scored no less than 120 points a week and will take some beating. \nIt will be hard to see past Freedman in this one and we believe the belt is likely to stay in the UK. \n\nGiven its Plancey week we thought we would catch up with the other fantasy players to see what the colleagues of the plancey managers thought of them. \n\nJamie Kay has been quoted saying, “I would like to see the smug grin wiped off the face of saul!” He then added, “Gaon’s suicide trade has gifted the league to him. Can we blame it all on Gaons reckless addiction”. Clearly taking issue with saul being favourite, he didn’t actually have anything to say about sanford. What is clear though is that he is a Shprutzranger this weekend. \n\nSacofsky has continued this trend. Having been beaten my saul by very small margins in both legs of the regular season matches, you can bet he is angry. He was a victim of a freedman special and has stated in regard to Saul’s team, “my mother always told me that if you don’t have anything nice to say then don’t say anything at all. All I will say is that I’ll be coming for him next season”. Clearly another incensed opponent that was so upset at Saul’s place in the plancey bowl that he also forgot to mention anything about Sanford. \n\nLivingston decided to talk about Saul’s state of mind in the lead up to the plancey bowl, “he wants this so bad. A win will lead to an ejaculation height to beat his infamous “that took me by surprise incident””. \nOn sanford, “he wants the win but deep down he will know he didn’t deserve it. His secret guy is akin to a Russian athlete in the Winter Olympics. He knows he is the best but he didn’t win on a level playing field”. Clearly the feeling of this newspaper is felt throughout the league, although, we feel it was more of a team effort than a single guy. One day we will find out the truth. \nLivingston also pointed out, “Credit to him he used the loan gate incident in the dressing room. He’s managed to create a fergie-like us against the world atmosphere with that”. \n\nWhen discussing Sanford, Josh gaon felt a recent press conference quote by Sanford was enough, “now that I am engaged I can’t just follow my D wherever I go...that is before I met the jags. I’ll be riding that D all the way to the plancey”. Nuff said. \nOn saul, “I would like to wish my offcuts good luck for the final. It feels a little like how arsenal felt when Van Persie won the league for United”. \nOn the overall plancey, “the matchup between the toughest/most frustrating negotiator in the league and the most kind/ oddest negotiator in the league. It almost makes you think that being able to trade isn’t a skill you need to make the plancey”...says it all really. \n\nBenjy Levey was called for comment, however, his management have sent a comment saying, “no quote from the Levey manager as he is being held in captivity by the supreme leader”. That certainly doesn’t sound promising. We delved further in to the story and we have been told that what happened was that despite the loss, kim jong-un sent for Levey to come to North Korea to celebrate a great season. However, letters were sent, phones were called and doorbells were rung and nobody could find Levey. After a couple of days of this, Levey then called back, but on a withheld number which only helped with the supreme leaders paranoia that Levey was making a run for it before the next season. Therefore, we understand Levey has been imprisoned in North Korea until further notice on charges of being impossible to get hold of. \n\nDaniel Polak was called and had this to say, “Don’t even talk to be about Sanford, what he did over the Ertz deal will live long in the memory. He has had a strong season overall and I know how badly he wants that belt”. \n“Saul has quietly gone about his business. He has built a great side and they are going to be difficult to beat. For someone who would have done anything for a few extra wins, I admire the way his team have got him over the line time and again. A great team and a great coach, I can’t understand all these off the field antics...he needs to get that sorted for next season”.\n\nNow for the team previews...\n\nQB’s - Sanford has gone for Big Ben in recent weeks, but we expect smith vs Miami is the best in terms of match ups. Smith’s work has got sanford here surely that gets him a starting berth in the plancey. No such decisions to make for freedman Keenum will be looking to continue his strong form in a good match up vs GB. \n\nRB’s - oh what sanford could have had...zeke is back from suspension this week and should have slotted straight back in to Sanford’s team. However it wasn’t to be and now he will have Ingram and Riddick with good matchups with Mixon in the RB 3 role. However this is, on paper, no Match for McCoy, Murray and Freeman. This is an area where the plancey can be won if Saul’s boys turn up. \n\nWR - Landry and Hill have performed for sanford and should get a starting place although funchess is crying out for a starting place. Saul once again looks stronger on paper with Green and Allen leading the line. \n\nTE - gronk always wins out, but Graham has been solid for sanford since trading him in. Sanford also has an Olsen sized trick up his sleeve should he chose to play him. \n\nKickers and D- on the kickers side of things who knows...but the Jags D are Sanford’s pride and joy and are playing the 49ers. If sanford has a trump card this week, this could be it. They have come through for him on many occasions this season and sanford needs one more bit of magic. \n\nOverall, what a great second season of fantasy football. I hope you have all enjoyed as much as I have (despite being crap...again). Thanks to the commissioner for organising. Good luck to the plancey boys, May the best team win. \n\nAnd of course Rabbi Alan Plancey wishes you both a hearty hearty mazel tov on making it this far....\n\n---"},{"id":8,"title":"2018 · PRESEASON PREVIEW","year":"2018","text":"*Sent 20/08/2018*\n\nThe off season can play mind games with you. Those long nights thinking about where it went wrong last season, promising yourself this year is going to be different. Well, all the strategizing, mock drafting and forecasting is over….because fantasy football is back and that can only mean one thing….it’s time for the third season of the Borehamwood fantasy league. Once again, along with pride, the coveted Plancey is up for grabs and the managers are in place. \nMuch like amazon have done with Manchester City in the soccer arena, we have been following the eight managers to see what they have been doing in the off season. \n\nSaul Freedman\n\nFreedman has been reeling in the glory of his maiden Plancey victory. Freedman’s team epitomized doing just enough last season as his team went through the regular season towards the bottom of the points for column of the league. Chastised for this approach by the “nay-sayers”, Freedman never let it get to him as his team continued to plod along beating all in their way, even if it was by a fraction of a point. In a recent press conference Freedman stated, “I have heard a lot of other managers have been upset by the way my team won the league last season. I have always taught my team that however we do it, the W is the most important thing. Anyone who worries about any other statistic or has a problem with the way my team go about their business is clearly a specialist in failure”. \nNotorious for their partying ways, Freedman let the team on a Plancey style month long binge across Europe. The team collectively spent 60 days in various prisons across the country mostly for drunk and disorderly behavior. The legal team at Leavemyarselona have been extremely busy in the off season, their most notable work being a number of super injunctions to ensure a leaked sex tape showing Freedman and his most recent pick up Gronkowski spit roasting a prostitute in Amsterdam never saw the light of day. \nWinning the Plancey takes a lot out of you and there is a need to let of steam. This is no different for Saul, however his antics have led to a mutual decision of gardening leave from his previous employer which has put the rest of the league on alert as freedman will now have more time to spend on his fantasy team. \nGoing in to the new season, Saul has assured that there will be no let up as he expects his new set of boys to perform once again and he is hungry to be the first man to retain the plancey belt. \n\nBenjy Sanford\n\nThe day after the Plancey Bowl at Mclagan is known as Black Tuesday. A fuming Benjy Sanford stormed in to the office and swiftly parted ways with his offensive, defensive and special teams coordinators respectively. Having gone through the whole season destroying all in their wake, to fall at the final hurdle was too much to for Sanford, who has spent the summer recruiting a new scouting team and backroom staff to the shprutzranger set up. Last season, team Sanford really went against the grain with his drafting strategy and we are expecting similar this year as he looks to right the wrongs of last year. Sanford has taken the summer to recuperate and reanalyze what winning the Plancey will mean for him. \nDue to be married midway through the regular season there fans have become increasingly worried that this may pose a distraction in writing the wrongs from the previous season. We spoke with one fan Dan Gleables, “ I spent $50,000 to take my whole family to the Plancey Bowl last year to see my team crumble. I had to take 3 weeks bed rest after that performance and now the boss has put his wedding in the middle of the regular season, on a Sunday night of all nights of the week! I just don’t know how the shprutzranger nation is going to take this. Not only have we lost the Kevin and Jason as our offensive and defensive coordinators but we have a whole new backroom staff!”. \nThere is no doubt that Sanford has a lot of questions to answer going in to the new season, but nobody will put more pressure on his boys to succeed than Sanford himself and it remains to be seen how he will fair after the final disappointment of last season. \n\nJamie Kay\n\nOriginally the last genuine Woody, there has been some uproar in the camp as in the weeks leading up to the draft, the franchise has moved. There is now officially no franchise left in Borehamwood. Fans have been left having to travel through Mill Hill passport control to see the last connection to an NFL team in the Wood. Jamie Kay has had protests outside his window of his new home in Hendon. In a recent press conference, he has tried to calm the situation, “I love the Wood, I have always loved the Wood, but I just had to get out of my parents house!”\nKay was left scarred by having first choice in the draft last year and, despite winning the draft sweepstake, he decided to go for third in the draft (which incidentally may lead him to picking Johnson again….). Coined “The Doctor” last year for his ability to take a bad situation and fix it, as well as actually being a Doctor in real life, Kay is a consistent fantasy performer using the waiver wire to his advantage. He performed miracles last year and is one of the favourites again this year to finally get his hands on the Plancey. \nGiven the Hendon move, there has been news of difficulties with the new stadium with question marks over whether it will be ready for the start of the season. There has been discussions with nearby franchises over the rental of their facilities for the first few weeks of the season, however, Levey and Polak, have both expressed discomfort at sharing with their nearest rivals. This could lead to further embarrassment for the franchise given the upset is has caused with the fan base. \n\nAlastair Livingston\n\nLivingston has been in a depressed state over the summer, we caught up with him at training camp, “It was bad enough having to give up the Plancey belt, but I challenge any man to be able to cope with watching your own wife destroy your draft position. It took some time to get over the state of shock”. And that ladies and gentlemen is exactly what happened. As our independent adjudicator for the sweepstake, Elly Ruben proceeded to pick the worst line up of teams for her husband in history, leading to a guarantee that he would not have the honor of picking his draft position. \nIn the off season, Livingston and his wife patched things up on their honeymoon where we are told Livingston brought his back room staff for daily analysis meetings in order to patch up issues from last year in order to regain his Plancey belt. There is no doubt he will be ready to go again. \nDespite a playoff run last season the fans will see the inability to get to the Plancey bowl as a failure and they will want to see the team back where they belong. This season the aim will be to stay out of the headlines for all the wrong reasons after last seasons “loan-gate” where Sanford and Livingston were found to be making deals violating league rules. Livingston is still adamant that he is innocent, however, after going through the Plancey court of arbitration, he was ordered to pay an undisclosed fine and 50 hours of leading the children service at Borehamwood and Elstree Shul. Sanford, for obvious reasons only had to pay a fine….\n\nGideon Sacofsky \n\nThe Israeli Ambassador of the Borehamwood fantasy group has had a lot to think about over the off season. Whilst juggling an ever growing family life with fantasy obligations there is discussions amongst the fans that he may be doing too much, “Being the only team in Israel, there is a lot of responsibility that comes with this. Saco has always been the right man for the job, but there is a fear that there may be too many external forces at work. He has the kids at home to worry about whilst trying to stop Bibi Natanyahu logging in to his account to make waiver wire decisions. There is a fear it may be getting too much”. \nWith Israeli PR at an all time low, the Government has seen Saco’s representation of Israel in Borehamwood group as a key cog in taking the pressure of the international press away from the middle eastern conflict and back on to the things that really matter. There is a huge amount of pressure that comes with this, with Bibi Natanyahu and senior Mossad members being called to the UN Human rights council on 5 occasions last year for illegally obtaining Sacofsky’s login details and making unauthorized waiver wire decisions. The government has stated that, “After internal discussions with Saco… all trading, waiver wire decisions and weekly team setting will be Gideon’s decisions and Gideon’s decision alone. We wish him luck in all his endavours in this current year and trust that he will do Israel proud and bring Plancey back to Israel”. \nSacofsky remains a knowledgeable member of the Borehamwood fantasy group and will expect nothing less than a long playoff run with a view to achieving the Plancey. \n\nBenjy Levey\n\nAfter an unbelievable season last year leading to a better than expected playoff run, Levey memorabilia has been flying off the shelves in North Korea. The most notable product is a Lev style 8 ball for making decisions, however instead of making a decision for you it just has “maybe” written on all sides. As it has been noted Levey has become something of a North Korean cult hero after his managerial heroics of last season. There is a slight hint that there will be increased pressure to do the same this season. \nIn the off season, Levey has been increasing his levels of political work, being instrumental in the joint North and South Korean hockey team at the winter Olympics. This is reemphasizing the global impact the Borehamwood fantasy football league is having. \nLevey has also published a book on how to create a fantasy winning team, whilst not really concentrating on your fantasy team with book flying off the shelves. There are still question marks if Levey will autodraft this year, a policy that put him in such good stead for last year. An extract from the book stated, “ If you are like me and you hate making decisions, for your draft just use autodraft, it makes all the decisions for you, I cannot recommend it enough”. We will see tonight if he continues to practice what he preaches. \nThere are fears that last year may have been a fluke, however, the analysts have stated that the fear of kim jong-un’s wrath will bring the best out of any team….\n\nMiriam\n\nThe off season for Josh “Miriam” Gaon has been a difficult one to say the least. There were reports that within days of losing the Miriam Bowl, Gaon had been checked in to a rehabilitation facility for an addiction to trading. Statisticians have been doing their homework and they have stated that after analyzing the season in its entirety, Josh Gaon had and then traded fantasy winning teams on 2500 occasions. \nHaving joined the league last season it is safe to say Gaon came in with a bang, trading even after the first round of picks. The league went from one that never really trades to a market selling complex derivatives on derivatives of trades. Gaon created and then recreated new products culminating in one final hail mary where he offered his whole team and his girlfriend Nicola to Saul Freedman for Leveon Bell. \nHaving spent some time in rehab, Gaon looked to finally get his fantasy life back on track, however, as soon as fantasy football comes in to play he snaps. Just as he did on two occasions in the world cup offering bizarre trades in the final seconds of matches to leave him with only one team left in the competition. Luckily for him, Croatia got him out a hole and he now has first pick in the draft. However, after reading this he may have already traded that in for a packet of crisps. \nWe have been told there is a trading ban, I give it 5 minutes, he has a sponsor and is going to 3 Traders Anonymous meetings a week. There is one thing for sure, Josh Gaon will never want to see the name Miriam anywhere near his after last season.  \n\nDaniel Polak\n\nWe caught up with Polak coming in to the pre season and he had this message, “The objective has and always will be to win the Miriam Bowl”. Polak is the only original member to have not had a taste of the playoffs. However, he has two Miriam bowl victories to his name and both trophies are sitting pretty in the trophy cabinet. \nWe followed Polak in training camp, “I know some people look at the Miriam bowl and look at it as the losers trophy, however, here we have a different approach. Our view is that in the final week of the season there are only two games that matter, the Plancey Bowl and the Miriam Bowl. So straight off the bat, twice I have taken my teams to an important match in the final week of the playoffs. Second of all my team have consistently shown that they can deal with the pressures of potentially being called Miriam for the year and twice they have come up with the goods at the important time. I look forward to doing it for a third straight time”. \nIn the off season Polak has been providing consultancy work to fantasy coaches on Miriam Bowl winning strategies whilst getting ready for the season ahead. There is a playoff itch that needs scratching, Polak has told the fan base to trust the process. Disclaimer...if for some odd reason he doesn't win the Miriam Bowl, Mr. Polak would like to make it clear that under these circumstances he does not recognise the Miriam bowl. \n\nThat is your preview for the season….we will see you again at playoff time….as always Rabbi Al wishes us all a hearty mazel tov on our third year as a league…..\n\n---"},{"id":9,"title":"2018 · REGULAR-SEASON REVIEW / Playoff opener","year":"2018","text":"*Sent 04/12/2018*\n\nWelcome one and all to our coverage of the “Playoffs 2018: The road to the Plancey” sponsored by Eatme events and to be broadcast live on ESPN 8 the ocho. The world has been waiting and the wait is finally over and we now know our playoff contenders….\nThis season has been raucous to say the least we have had season defining trades that will go down in the history books, we have had games going down to the wire and we have even had a picture with the Plancey himself. It has been a season where our plancey championship game from last year will become the Miriam bowl and our Miriam is the favourite for the Plancey. That….as they say…is fantasy football. \nSome players will have their first ever taste of playoffs and some seasoned veterans will once again look to meander their way to the coveted belt.  \nIn what has been a rough year for Borehamwood and Elstree with the freddy david conviction and the Rabbi leaving under murky circumstances, the league once again leads the way as the shining light of the town. \n\n\n*Miriam*\nMiriam, what can be said about our very own Miriam. Having spent a long stint of the off season in rehab, Miriam had infact spent hours, days and weeks plotting his revenge on the league. His Girlfriend Nicola told us, “I went from not seeing him during the whole of last season, then the day after he became the Miriam he went straight off to rehab, he had day release for both my sisters weddings and then straight back in to rehab. Then he conveniently came out of rehab on the day of the draft and little did I know he had been spending all his days in rehab not trying to get better, but working out, gameweek by gameweek, how he was going to win the Plancey. My whole life has been put on hold because of this fantasy trash, only last week he told me he won’t propose until he completes his mission of becoming Plancey!”\nMiriam had got himself the first overall pick and he had no doubt in his mind who he was going for. Leveon Bell was part of his suicide trade last season and he was going back to get his man in the first round. Rumour has it that upon being picked as the first pick of the draft Leveon said, “Whilst I appreciate being first pick, there ain’t no way im playing for some trade addict called Miriam, I don’t know where I will be from one week to the next”. What happened in the following weeks was nothing short of tragic. Miriam could be found with an oversized radio outside leveon bells house pleading with him to “remember the good times” and to come back and play for him. However, Bell refused in the hope that he won’t have to play for Miriam next season and he can get a big money contract at another franchise. It all seemed to be going tits up for Miriam once again and he was a shoe in to grace the Miriam bowl. However, he picked up Conner at RB to fill the void and then out of nowhere he lucked out and Leveon requested a trade to go back home to Freedmans squad. Nobody really knows how or why it happened but in the first of two 4 player trades Miriam was involved in, he managed to offload Bell and gain Kamara amongst other players which left him in a much stronger position. \nThat is correct by the way, despite weeks in a rehabilitation facility, Miriam proceeded to have two four player switch trades amongst a few others along the way. We spoke with his traders anonymous sponsor, “it was almost as though… he would be listening and get involved in all the self help activities and then…. before you knew it…. the trading alarm bell would be going off on the miriams midgets group and look who was involved…. he cant help himself and he cannot be helped”. \nWhat is different this year is that Miriams trading has been almost exemplary as he has gone on to build an absolute stonker of a team ready to take the playoffs by storm. He has secured a bye for the first week of the playoffs with a week to spare of the regular season and he is ready to claim the belt as his. \n\n\n\n*Alastair Livingston*\nThe commissioner has made the playoffs for the third year in a row. After suffering the pre season setback at the hands of his own wife at the draft world cup sweepstake, Livingston has taken the setback in his stride building a team ready to for  the twists and turns of the regular season. The comish has made the playoffs with little fuss. \nThe perennial rule breaker was at it again however during the regular season with his regular accomplice Benjy Sanford. This time they were charged by the co
