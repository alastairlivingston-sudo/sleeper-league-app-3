ringing up the kids. The target was wenger 1999, but we got wenger 2012 as the rookies faltered early doors and couldn't get the wins josh required.\nUpon hearing that CMC was on IR Clyde Edwards Helaire had been said to be chomping at the bit to get to the rookies paradise that was Gaon's team. Reports were that he had been sliding in the gaon's DM's non stop to join the team given the reputation of quality and victories....however it did not take long for the relationship to go sour as CEH couldn't quite fill that CMC void in gaons heart. Upon joining sanfords team CEH stated, \"from the moment I walked in to the facility he insisted on calling me Christian saying he expected 40 points a week and to paint my skin white and dye my hair blonde it was all round hell....\"\nNeedless to say Gaon has been on somewhat of a downward spiral having hit the heights of last year and the last thing he would want is to be the league's first ever Plancey Miriam especially given the long list of previous Plancey's who have narrowly avoided that dreaded title....only time will tell.... \n\n*Benjy Sanford*\nThe world zigs and Sanford Zags....the world picks a solid RB in the second round of the draft....sanford picks fournette. Just like most things sanford does in fantasy football, it was a risk that could have paid off huge but in most cases generally leaves him with too much work to do. You don't get two miriam's for nothing they say.....\nRumour has it that a new kid jason was looking to join the team at Elliott and saw Sanford was his interviewer...after some research he saw Sanford liked his fantasy football...as you do, you pop \"fantasy football expert\" on the CV in order to get the job....as expected Jason was given the job on condition he took over the Sanford Fantasy football department....now, Jason had never actually watched an NFL game in his life...he quickly googled nfl fantasy research and found a 2018 article that stated this was the year Leonard fournette would break out and the rest...as they say...is history.....\nIt all started so beautifully for Sanford....after 5 weeks a 4-1 record saw him laughing all the critics down...ridley was on fire and Sanford was on course to be the first to make the playoffs. Fans were begging for a solo sanford podcast to learn his drafting strategy...he was being hailed across the globe as fantasy alpha that everyone needed. But....as with josh gaon....life comes at you fast...\nSanford looked at his team at week 5 like the perfect 10 you surprisingly pick up on a drunken night with the lads...you can't believe you've got her...your mates can't believe you got her....however by week 13 its the next morning you realise you drank so much you can't even remember the night and you have Michelle lubinsky in your bed asking for round 2. \nSanfords team unfortunately struggled to make over 100 points every week making wins very difficult to come by and the early front runner had faltered to the point where another miriam bowl was on the cards. \nIf you asked sanford what his least favourite show on TV is...even before week 13 he would say \"Monday night football\"...it has been his undoing on many occasions and low and behold in the final minutes of MNF diggs put the final nails in the coffin of this miserable season....as is always the case...Jason has not passed his probation and has been sacked with immediate effect.... \n\n*Alastair Livingston*\nNow on to the self-confessed unluckiest player in the game. This years Miriam managed to relinquish the title at the first time of asking all whilst shipping the most points by a long way by any player this season. Now it must be said that is unlucky in itself, in fact the only thing unluckier than Livingston in fantasy would be One of the younger Bernstein boys (I forget the name) who was happily running around the Gila Hall with friends pre mifkad only to get within firing distance of a young benjy sanford. An outstretched tripping leg and a chipped tooth later and your looking at the fantasy equivalent of Livingston.  \nMid season Livingston had the wonderful news of a second heir to his fantasy team which was very exciting for us all as it ensures the future of the league is in good hands when we all decide to retire. \nHaving a newborn is not easy at the best of times but with the full time job of running a franchise in the Borehamwood fantasy league makes things even harder. There were rumours that it was having a detrimental effect on Livingstons ability to value trades. A change in tact after last year was definitely needed to ensure there was not a continuation of the Miriam however, the trades that were being felt out made for difficult reading with kickers being offered for high valued running backs. The sleepless nights may have been taking their toll as instead of discussing trades Livingston has started sending out bizarre trades via the app in what must be some sort of hope that the player receiving will fat finger and accept. What it has meant is that Livingston was unofficially trade embargoed by the league only to finally do a real big boy trade in the final hour of deadline day. \nNow that the Miriam is out the way, Livingston will be looking to make his mark in the playoffs, however, he has already complained that despite coming 4th overall in the rankings he is unlucky to have not got a bye and fast tracked to the Plancey bowl. He was the inaugural winner in what has been disputed as a dud year and he was extremely unlucky that people started to do more research in the 3 years that followed, otherwise he would have four planceys in a row. \nNeedless to say, the team is looking strong heading in to the playoffs and Livingston expects big things....as long as luck doesn't come in to it.... \n\n*Lev*\nThere are 3 certainties in life....death, taxes and Lev making the playoffs. It is quite an unbelievable feat when you take in to account that since Lev and North Korea joint ventured for a franchise in the league only him and Jamie Kay have not featured in a Miriam Bowl. It was touch and go this time but Lev and his men did just enough to ensure another playoff run for yet another season. \nThis has been quite a season for lev in the respect of participation, whilst still having the most plancey dollars in tact by the playoffs he has actually used the money wisely bringing in some excellent players such as Herbert and Tee Higgins. The players were apparently persuaded to come over by the lax Covid19 protocols in North Korea as they both didn’t want to wear a mask. \nOur sponsors Eat me Events have been hit hard by covid given the industry they are in and in North Korea given the spare time he had, Lev was asked to fulfil roles elsewhere to help with national security, this included creating fake ballots for the US election and working in the labs creating new strands of Covid19 to add to the nuclear arsenal if required. Needless to say Lev continues to work towards, please god, becoming the next supreme leader of North Korea. \nFor someone who rarely gets in to the trading game, Lev had played quite a role this season in his annual trade. Livingston ordered the UN security council to aim their nuclear weapons in North Koreas direction given the mid game week trade that, in his view, was an act of war. There was a long stand off whereby Lev refused to back down saying, “embargo me all you want but you will never take my juju smith Schuster!!!” With that being said, all was calmed down swiftly as once in the court of law it was agreed the trade was in good faith and world let out a huge sigh of relief. \nLev is dreaming of a first time plancey belt to take home to North Korea and who would bet against him when you have North Korean agents pointing a gun at your head. \n\n*Polak*\n\nThere has been a steady progression regarding the dogs polaks. Polaks first two year in the league ended in Miriam bowl appearances…There was talk of unrest in the backroom and despite earning the title as a Miriam specialist, there was a wonder if this team would always be specialists in failure. Finally in the third season the polaks made the promise land and there was a real buzz that this could be the start of a new beginning for the franchise. However, they met the eventual plancey champs in the playoffs first round and the dream ended there. But there was beliefthe  team were finally going somewhere and everyone could feel the gradual process. Polak’s training regimes were finally producing the kinds of performances the fans never thought possible. 2019 saw another trip to the playoffs and this time after a first round victory….a trip to the semi plancey’s where unfortunately the team lost to the eventual Plancey bowl losers….And now in this covid hit season another step in the right direction….the franchises first ever bye week (for the good reason) and the fans went wild. The question now is could this be the year that the dogs polaks finally make it happen and get their hands on the illustrious belt. The pace of progress says that a championship may be too soon which may be a good thing as his wife has already got the divorce papers ready if the belt enters through the front door, but a man can dream. \nThe plancey post has spent a long time talking about addiction and what it can do to a man. Josh Gaon has spent many a fantasy season trading his left testicle for a WR1, however, Polak may have to join up to the addiction club. After seven (7) trades this season Polak has firmly put himself in position of someone that may require help….it is yet to be seen, given that if he can deliver a championship this will be swept under the rug until next season where it is seen as a real problem and will likely check in to the same rehab facility that didn’t work for Josh Gaon. \n\n*Jamie kay*\nJamie kay spends another season towards the top end of the league. Nicknamed \"the medicine\" in previous seasons...he has been well known for being an excellent waiver wire worker building up a strong team when all seems lost...as the season wore on it had become apparent that all strategies had changed in search of a coveted first plancey belt. The story goes that Roman abramovich was in his private plane flying over Golders Green to invest in Livingstons team and he saw Jamie kay shooting at BLM protestors and he said, \" get me a meeting with that man\".... after long drawn out negotiations, investment was confirmed and Kay changed tact....the aim....build a super team....kay used the funds to invest in serious wheeler dealers to get deals over the line including Pini Zahavi, Raiola and the richest man in borehamwood Steve Davis....\nWithin a few weeks the Russian millions had got him a team with absolute studs across the board....Hopkins, CMC and Kamara to name a few.....\nMuch like Chelsea in 2004, kay has breezed through the regular season despite some issues with injuries\n...there was talk of complacency however, despite faltering towards the finish line, Kay's men managed to get over the line in the end and look forward to a bye week and a possible first time plancey belt....having spoken to girlfriend Natalie she has stated she is firmly behind her man and is getting the space ready for the plancey belt in their home...support like that could be the difference maker that finally ends the curse for JK.\nIn news other than fantasy football Jamie kay was the only member of the crew who stood up for Plancey amid his alleged homophobic comments stating, \"I saw what he said and I dont see what all the fuss is about....down with the gays i say, Rabbi Al i am with you til the death!\" \n\n*Freedman*\nSaul freedman has been coined the GOAT coming towards the end of this season...apart from a year where his mind was elsewhere and in other countries freedman has always been towards the top end of the fantasy ladder and this year has been no different...\nThe plancey times has always noted freedmans management style...he likes his boys to work hard and play hard at all times....this became difficult in covid and Freedman and his time were fined half a million dollars for having a huge party with 100 hookers in a warehouse just outside of borehamwood that had been used to host chassidish weddings, after their first win of the season leading to an outbreak of the virus at the chipmunks facility...in a press conference after receiving the fine freedman stated, \"forget all this covid nonsense...I dont see what the issue is! cook has been socially distancing from opposing defences all season!\".\nRegardless of this Freedman and his boys have taken the season by storm only just missing out on the bye week and will now have a match up against lev to get him to week 15 and a date with destiny as the first man to wear the plancey belt twice.... \n\n*Sac*\nIn what can only be described as the great escape....Sac has made the playoffs....In Israel the media had coined it mission impossible only comparable to the operation undertaken in entebbe....however with those final receptions on Monday night football...Diggs took Sac back to where he feels he belongs and you have to like the odds going in to the post season....\nHaving mustered up his fourth 6-7 record in a row in consistency that can only be likened to Freddie and Hannah David's once a month policy....Sac pulled through in unrivalled fashion...\nAs a Leeds fan, Sac is extremely used to tight finishes but I'm sure nothing can compare to the final minutes of MNF....it was rumoured Sac was seen running through the house stark naked shouting \"suck it sanford!\" at 5am....\nIt didn't start well for Sac as he was angry that his star RB and QB were put on IR which makes getting to the dance that extra bit more impressive...after Dak went down Sac was said to have thrown a hissy fit throwing his TV out the window shouting, \"Tell Livingston there is only room for one unlucky player in this league!\"\nNow that he is there Sac is looking to go all the way as he attempts to bring the plancey belt back to Israel.... \n\nNow to the previews\n\n*Lev vs saul*\nThe expectation for this game is that it will be quite one sided given recent form. \nFreedman has been obsessing over building a team for the playoffs and feels quite confident with his deadline day trade....with that in mind he has a team full of good match ups Rodgers playing detrioit, keenan playing the falcons....in fact the only saving grace is that serial fantasy scorer dalvin cook does not have a great match up....however we all know he can pop off at any moment. \nLev on the other hand has had serious RB issues throughout this season and is the main concern for his team....we are already in to the weekend and the waiver wire extraordinaire has done it again to try and plug this gap....in the dying moments before Friday am's game lev slipped akers in the RB slot and low and behold a stud like performance....the question is....Will it be enough to stop the irresistible force of freedman in order to secure a place in the semi planceys....having snuck in the playoffs through the back door...what a story that would be.... \n\nAs is always the case a hearty mazel tov to everyone on their respective seasons and a good luck to all involved... \n\n*Livingston v sac*\n\nSac performed miracles with his team in the final throws of the regular season to secure an unlikely playoff berth....and now he is here...he doesn't want to just make up the numbers...looking at his team he should have nothing to worry about this week in terms of putting up a top score...Wilson and Carson are expected to dominate and Hill is...well...Hill. with that in mind there is no reason why Sacs fans can't dream of a second plancey belt. \nSac will have alot to contend with facing a favoured Livingston who has a really strong side who put up solid numbers week in week out...add metcalf to the mix and you suspect fireworks in this match up....Livingston will be chomping at the bit to be back in the playoffs after last years miriam bowl appearance....he wants that plancey belt big time and will stop at nothing to get there... \n\n*Gaon vs Sanford i*\nIn a historic move for the league sanford and gaon take part in the first best of three series to decide who the miriam will be for this year... this is the first instalment of the blockbuster clash which nobody wants to lose. \nHaving both had horrendous seasons in their own way sanford has to come in as favourite simply based on the fact that he has secured 3 times the number of wins as gaon. \nHaving already had woods playing on Friday am...gaon is already playing catch up in this potential neb off. Although given recent scores 5 points from a WR may be a boom week....\nThe world will be following intently to see who comes out on top in this one and can be saved from the total embarrassment of another year as miriam....\n\n---"},{"id":20,"title":"2020 · Semi-Plancey preview","year":"2020","text":"*Sent 17/12/2020*\n\nSo here we are...who would have thought we would have made it to the semi plancey's...the rest of the world is getting covid but football continues...we unfortunately said goodbye to Livingston and Levey who were both soundly beaten by their opposition in the first round of the playoffs...Livingston will feel aggrieved having scored so well in the season, whilst Lev couldn't quite keep up with the freedman powerhouse....\nThis week we see the pretenders take on the old guard as Jamie kay and Daniel Polak look to finally get their names on the belt whilst freedman and Sac will look to become the first two time champ... \n\nSaul vs Polak \nOn paper this game should not disappoint, two of the best QB's in fantasy, two of the best RB's in fantasy....two stacked teams the fans are expecting big scores...\nFreedman makes it to yet another week 15 on the back of top form that has only seen him lose once in the last 8 games. They don't call him the GOAT for nothing...\nHe will be hoping his boys can give him another strong week in order to move on to yet another week 16.....\nThis is now tied with the furthest polak has been thus far and marks progress....he will have to destroy the might of Freedman and his boys and many are writing him off already....freedman certainly has the experience at this stage and the fandom are excited for what is shaping up to be a mouthwatering contest... \n\nThe second semi final see Kay facing off against Sac....\n4 weeks ago Sacofsky would have laughed at you if he was being touted as favourite in the semi planceys....he had even begun negotiations with Gaon regarding the format of the Miriam bowl....he is well known to be a pessimist but nobody thought he had a shot....then mission impossible was complete and Sac is now raring to go with a team worthy of a championship....he will be facing up against week 15 veteran and nearly man Jamie Kay who has been seen constantly throwing salt over his shoulder, knocking on wood and all other superstitious practices in order to get himself to another plancey bowl. Whilst sac has had his luck turn....kay has had no such luck with his team going from \"super team\" to \"what the hell happened\" with kamara not looking like the man he once was and CMC just no longer fit....Kay is gonna need all sorts of godly interventions one feels.....\nBut this is fantasy anything can happen...Plancey as usual wishes you a hearty mazel tov on reaching this far and a good luck to all..... \n\nNow on to \"Sanford vs Gaon ii\"....what has been dubbed a neb off for the ages....sanford managed to beautifully take game one away from gaon in the closing stages of MNF and put himself in the driving seat going in to game 2. Sanford and his boys know full well they are one win away from immortality...for gaon it really is the squeekiest of bum times....he has said he likes the match ups this week...but when you have only one 2 games all season...can you have any confidence at all in your team....people were surprised he took his completely injured team in to a series instead of the one off game...but that is a sunk cost and his team must perform this week....the fans across the world will be watching closely to see where the miriam bowl will take us this week....Best of luck to you both....\n\n---"},{"id":21,"title":"2020 · PLANCEY BOWL preview","year":"2020","text":"*Sent 25/12/2020*\n\nAnd then there were two. Gentlemen it is time once again, all the trading, waiver wiring and speculative negotiations has led to this point....the plancey bowls where fantasy footballers have the opportunity for immortality....\nTestament to the most competitive league in all of sports entertainment we will once again have a new name on the plancey belt as Jamie Kay and Daniel Polak came through their respective semi planceys to take centre stage in this weeks match up....\nThe semi planceys were hard fought but it seems the men with more on the line wanted it more at the end of the day...Jamie kay had a resounding victory over previous champion Sac....it seems Sac's men put their all in to getting in to the playoffs and ran out of puff when it was time for the dance...\nSaul freedman has once again put in his bad performance when he was out of the country....this process put him in the miriam bowl a couple of seasons back....and yet he didn't learn his lessons and the fans were devastated to hear that freedman would prefer to party in dubai than manage the team through the playoffs....Polak on the other hand put all his focus on getting to a first plancey bowl and he has gained revenge on Freedman for the semi plancey loss in the previous season... \n\n*The plancey bowl - Kay vs Polak*\nIts a case of the veteran vs the rookie as Kay's men suit up for the third plancey bowl in 5 years...which is quite an achievement in itself....however, it has been widely viewed that his hall of fame status is dependent on actually getting over the line....\nPolak on the other hand has gone from league laughing stock in its infancy to plancey bowl contender in a few short years...with slow and steady progress using the famed \"if in doubt ask gaon\" (in previous seasons it has worked better) approach...\nThis one is set to be huge with both scoring nicely in week 15...the big news being that CMC is likely out for this game ending hopes for Kay of getting all the way to the final game to be able to unleash him for a big win. \nThat being said both these teams have the ability at any point to go off and take the belt... the question on everyone's lips is who will be the man holding the belt up high standing next to Rabbi Plancey on the open top bus down Shenley Road....only time will tell.... \n\n*The miriam bowl  - Sanford vs Gaon iii*\nGaon felt victory for only the third time this season and its lucky he did as it now takes the miriam bowl to the final week of the season in the best of three series....\nGaons team went off last week like Gaon had been warning it would for the 14 weeks prior...but much has to be said for coming back after the devastating week 14 loss...\nSanford will be doing all he can to ensure that he does not etch his name in to the history books as the first 3 time miriam....\nVegas has Gaon as the favourite after last weeks victory but you can't bet on a man who has had so few victories let alone back to back victories.....\nThis will be a must watch going in to the weekend as it feels far worse to to be the miriam for the year than it is good to be the plancey... \n\nA heart mazel tov to you all and best of luck to all those playing in important games this week and even those in unimportant games where you will be able to watch debuts for such players like Manhertz....\n\n---"},{"id":22,"title":"2021 · REGULAR-SEASON REVIEW / Playoff opener","year":"2021","text":"*Sent 17/12/2021*\n\nAnother regular season is in the bank which only means one thing....it is playoff time!!!\nFor 3 months of the year total focus is set on reading pages of rankings in the hope that somehow your player has moved up a place....late nights hoping that the back up to the back up to the back up RB you paid 75 plancey dollars for is somehow going to run 95 yards for the shittest team in the league and win your week for you....all this because at the end of the day....this is what we live for....and now the question remains....who will claim the belt as the odds are looking good for a first two time champion. \n\nJosh Gaon had alot to ponder in the close season. Having suggested a miriam series, he joined Sanford as a two time miriam. However, he has relinquished his Miriam status in style...\nThe season started slowly, which gave our resident miriam bowler that all to familiar sinking feeling...however, Miriam stuck to his guns and his boys came through for him.....and his reward...the bye week! \nMiriam's results fluctuate in the extremities....this created a huge logistical issue given that he was due to get married as the plancey last year....however covid got in the way and by the time he could finally be wed, he was married as the miriam. The fans were excited to see the possibilities of the plancey belt being walked down the aisle and nobody was more devastated than Gaon himself. He was made to cancel the ice sculpture in the shape of Plancey, the miriam pinata for all the guests to whack and the plancey dancers he had commissioned during his and Nicola's first dance ... talk on the town was that he was crying throughout the wedding due to being married as the Miriam. \n\nAlastair Livingston is back where he feels he belongs having secured the bye week. He has been obsessing over finally getting over the line and winning what would be his only legitimate title given the controversy of his ghost victory of the past. We have seen the many forms of Livingston over the course of time since the belt was taken out of his possession. In fact Livingston has gone through all 7 stages of grief....firstly we had the shock and denial stage whereby he could never believe how he had lost a game and he wildly overvalued his players (this phase has never seemed to stop)....we have then had the pain and guilt phase whereby there were rumours he would spend redzone curled up in the foetal position with elly whispering \"it's going to be OK, trust in the model\" in his ear throughout.....this was followed by the anger and bargaining phase whereby any undervaluing his players in trade negotiations would be followed by a hissyfit followed by a zip file of thousands of pages of research in to the value of said player. This also coincided with the start of his campaign to be the unluckiest player in the game where any injury to any player in the nfl would somehow have a knock on effect on his team. Livingston was found wondering the streets saying, \"I just can't believe the Dallas corner back is now injured having played my wide reciever 6 weeks ago with an expected return of 6 weeks the week after he is due to play my expected playoff opponents WR based on my forecast\" ....\nThen we had the depression stage which culminated in a miriam title and in his words, \"the lowest point in my life to the point where I almost hung up my algorithm\"....after the low point of the miriam, Livingston got himself back to the drawing board and into the reconstruction phase. He got back out of bed and in to his fantasy modelling, he built his team up again and swore he would get back to where he feels he belongs....and then we had this season of acceptance and hope whereby his team stormed in to an early lead, everything was going perfectly and the lead was unassailable...only for things to go terribly wrong towards the end of the season where he was left clinging on to the bye week by the skin of his teeth. Needless to say he cannot be written off by any means especially as he is only 2 wins away from holding the belt.... \n\nWhat should not go unnoticed is saul freedmans comeback from an almost impossible position. Sitting at the bottom of the league midway through the season, Freedman took his team to Borehamwood and Elstree shul for the weekend for a team bonding shabbaton. They had inspirational talks from Plancey, Davante Adams was up on his chair singing baruch hagever and Chubb organised a tochnit of limos around Milton Keynes for the Saturday night. Unbelievably the winning streak started from there and the boys never looked back storming in to the playoffs and going in to survival weekend with very little to worry about. Freedman has shown a huge amount enthusiasm for his team and the league as a whole, keenly taking stock of where everyone is and being a strong player in the trading market....he has high hopes of being the first 2 timer and who would go against it based on recent form. \n\n\nLev has done it again...everyone always expects that autodraft will catch up with lev....and everyone thought when autodraft picked 3 players from the same team that this would be the year it all fell apart....but one of those players was....Derrick Henry...and essentially that's all Lev's team needed as he rumbled his way, on Henry's back, to a great start that put him constantly in the bye week conversation. They were utilising Henry so much that there were rumours he was also being used in the North Korean concentration camps as a new form of death sentence - death by streamroll. \nHowever, tragedy struck, midway through the season Henry was declared out for the season. So what does Lev do? He sends out the next beast on his roster to carry on the torch and whilst everyone else was pontificating about levs demise, Taylor went and got him the wins needed to ensure another season out of the miriam bowl and keep him in the bye week conversation. Unfortunately he couldn't get the win required on the final week to take him to the bye but it seems that whoever he seems to put out generally does the business for him (possibly because their families are being held hostage). \n\nSac was livid about the updates this year....the extra game means that he couldn't fulfil his annual 6-7 record which he has perfected over the years. Despite that he had to keep one side of the record and decided to stick to 7 losses. Its fair to say that Sac has won the lot and done nothing from this position so its hard to really say where he is going to end up. Needless to say, the camp has been riled up by the words of Gaon who has stated that he team made the playoffs with a whimper....going in to the final match the team came back from potential miriamship to take the win vs his cousin and see yet another post season. \nSac spent last season on a trade embargo, no matter what he did people wouldn't trade with him. However, this season has been much smoother sailing with the embargo lifted in many franchises despite BDS protests. Can Sac take the belt back to Israel once again, the league hopes not as we have no idea how to get it out there given the covid restrictions in place. \n\nDr Kay had a bad start. Having been plancey and recieved the no 1 pick in the draft there was talk of a plancey plancey with CMC at the helm. Yet injury after injury to his main man has meant one of the greatest technical fantasy players had to show what he was made of.....\nHe had stated when things were looking extremely grim that he had no doubt he would not be in the miriam bowl and the rallying cry worked a treat as the team scraped in to another post season. \nHaving moved the franchise once again, this time to mill hill east, there was talk of a stadium share with Gaon, however, this was refused by Kay as he wanted nothing to do with the supposed Gaon curse given his love affair with miriamhood. Nevertheless Kay is looking to be the first man to be married as the plancey, but would need to do something unprecedented to do it. We have never had a 2 time plancey but to do it in back to back years would be a whole new level of dominance and ensure GOAT status... \n\nNow to the matchups: \n*The whimpering wanderers  vs Hot Chubb time machine* \n\nGiven the way the league ended up both of these men had a chance of the drop last week. Saul was in much less trouble and could start to think about the playoff picture early on whilst Sac was made to sweat in to the early hours of Tuesday morning. \nThis game should be quite the match up and on paper Saul has built himself quite the team and in his eyes he just needs them to start performing. Dak Prescott needs to start firing for Freedman and he called him in to his office early on in the week for a bit of hairdryer treatment to pull his finger out or he will be cut for a waiver wire add. It looks like he has opted for the 3 RB approach, captained by Sac's very own ekeler. \nSac on the other hand is seeing far to many Q signs on his players names for his liking. But on their day Samuel and jefferson can absolutely tear teams apart. \nMy money is on Freedman in this one but as demonstrated last week, never write off Sac. \n\n*Lev vs Kay*\nHaving just missed out on the bye, Levs depleted team are going to have to play the extra week if he is going to get a maiden belt. With news in the week that Hopkins is out for the season Lev has been seen out on brent Street looking for a WR to slot in this week. \nKays team looks alot more balanced on paper with the elusive kupp alongside a resurgent mixon, he will be tough to stop this week for Lev. \nBut there is one man Lev has coming off a bye week who could win the week all by himself and Lev will be very much hoping he has a few more beastly performances in him. \n\nBest of luck and a hearty hearty mazel tov to you all....\n\n---"},{"id":23,"title":"2021 · Semi-Plancey / Bowl preview","year":"2021","text":"*Sent 23/12/2021*\n\nThe end is drawing near...The coveted belt is within touching distance...the champ has been slayed and now we are left with four men looking to fulfil a lifelong dream. We welcome back the bye weekers who have enjoyed a nice week off getting themselves ready to win one final game to get themselves in to the frenzy that is the plancey bowl. Destiny awaits and with omicron added to the mix, literally anything can happen and quite literally anyone could be playing..... \n\n*Livingston vs Lev*\nLivingston spent the bye week trying to gee up his men. At the beginning of the season it was a one man show at the top of the table and there looked like no stopping Livingstons boys. The second half of the season looks very different and in his semi plancey match he will be hoping his team can rediscover their form from earlier in the season, especially as the bookies had started paying out on Livingston to the win the belt halfway through the season. To create some sort of winning feeling, the team went on a bonding session to the St mirren v Celtic game...what looked on paper like an easy win was, in livingstons eyes, the perfect way to help the team to get that winning feeling again. However, nothing encapsulates Scottish football more than a bore draw...however the effect may have worked, as Kamara said in a pre game Press conference, \"I never want me or my players to end up in a situation where we have to play American football at the level that these guys were playing soccer\", enough said really... \n\nHaving missed out on the bye week, everyone was expecting levs season to end in the first week of the playoffs...when asked about having to play week 15, Lev told the press, \"my group of boys just want to get out there and play, we want to keep this momentum going\". This was just prior to finding out that another top player in his team Hopkins was out for the season. In Levs team its the next man up approach and as has been happening all season, the doubters were proven wrong and Lev's team made light work of the now former champion Jamie Kay who now sits as a lame duck champion. Jonathan Taylor will be looking to keep the depleted team rumbling on and as long as that continues lev is in with a shot of his first ever plancey bowl. \n\nThe game itself looks at two teams who both had strong starts in the regular season and then limped their way to the finish line....its a perfect storm for what is expected to be a tight affair. Livingston will need everyone on song as Scotland take on North Korea in a battle for the ages....Will Livingston get back to a plancey bowl and a chance to get back the belt or will Lev keep the dream alive for one more week, once again proving to all those who actually research and pay attention to this stuff that we are completely wasting our time. \n\n*Freedman vs Gaon* \nAnd now we come to the covid bowl....this match up will likely be defined and won by the man who can actually get a line up out over the weekend...\nJosh gaon enjoyed himself a bye week yet again. The lows are so low that he puts everything in to trying to make the highs as high as possible. Gaon is well known to plan well in advance for the playoffs and the unpredictability of covid has thrown plans out the window. Gaon has spent much of his bye week with his apron on making and travelling to Travis kelces house to leave daily chicken soups outside to make sure he is back to full health for this match up...nevertheless Gaon is ruthless at times like these and will be confident of getting himself to another plancey and righting the wrongs of last year. \nSaul freedman seems to be synonymous with the semi planceys, his lads who have been on a hot streak over the second half of the season brushed aside a whimpering Sac in the quarter planceys. However this week he will have to face off with covid and all that comes with it. A number of his players could possibly be out this week. The semi planceys are tough enough without all of this to contend with. \nThe match up itself is going to be a difficult one to call with both players taking a game a piece in the season. \nBoth men have serious firepower who on their day can win matchups on their own....with chubb, Adams, cook and Montgomery its going to be tasty...the sad thing is that covid may be the only winner here.... \n\nAs usual a hearty mazel tov to you all on making it this far and best of luck in this year's semi planceys\n\n---"},{"id":24,"title":"2021 · PLANCEY BOWL reflections","year":"2021","text":"*Sent 02/01/2022*\n\nMazel tovs all round! Plancey time is here again and I think both parties involved will admit themselves, nobody expected this to be the final. Yet here we are... Saul will be taking part in an unprecedented third plancey bowl, whilst lev will be debuting in a bowl of any kind and everyone is very excited about it.\nThe semi planceys were full of injuries and surprises and we saw both bye weekers eliminated at their first hurdle. Gaon was devastated, having seen his growth throughout the season for it to finish like this was not something he envisaged. On the other side, Livingston is slipping back into the real world minus the trophy that everyone had basically handed him early on in the season. \nOne thing that there is no doubt about, if lev wins and we have our 6th winner in 6 years, it is without a doubt the most competitive league in world sport. \nAll roads lead to plancey Town and I for one cannot wait! \n\n*The plancey bowl*\n\nNorth Korea can officially say they have a plancey bowler in their midst... Lev has believed in his team throughout and this was paid back in spades as Taylor had an off week but the rest of the troops rallied around and pushed the team through. Media week has been interesting to say the least...with lev under strict instructions from the North Korean govt to not comment on any questions...the only answers we recieved from lev were, \"I'm just here so I don't get fined\". \nSaul has stated he is in a weird position in that he is not the fans favourite going in to this one....he has even made a point to suggest that even he wants Lev to win in some ways. \nDon't let that fool you, Saul is ready to go for this one....he has the chance to make history as the first two time champion and he isn't taking it lightly. Saul spent last year in dubai during the playoffs and Lev has followed suit with far more success this year and Freedman is taking that personally. \nIn terms of teams, Freedman has his covid boys back and is expected to win based on the ever accurate nfl predictions. However, Lev has always been seen as the underdog in this respect and you can never write off Jonathan Taylor in a great match up...\nBest of luck to you both on your quest for greatness....\n\n\n\n*The miriam bowl*\nBenjy Sanford is making a habit of miriam bowl appearances. This will be his 4th in 6 years and if he loses again it will be his 3rd stint as miriam which is quite a feat in itself. After having one season where he likely should have got himself a belt, it has been a rough ride since then. It seems to really be taking its toll on sanford who truly felt he didn't deserve to be in this position and almost got himself out of it in the final weeks of the season. He traded away the big name in his team and picked up hill instead...and his team looks in great nick to win a second Miriam bowl in 2 years. Sanford is livid at his form and is looking to make further changes to the backroom staff for a 6th season in a row, some question if he was right to let Jason from Mclagan go as under his watch Sanford got to a plancey bowl only to be fired for not securing the belt. There has been talk of his return for next season, however, he is currently working for the North Korean backed Lev and coaches very rarely leave on their own terms. \n\nPolak on the other hand is firmly back to square one...the progress year on year was there for all to see and this season has set that all back...some say he has never recovered from the Alvin kamara onslaught last year in the plancey bowl. His wife has noted that he wakes himself up in the middle of the night screaming \"No Alvin No!!!!!\". Needless to say Polak believes that from the moment the miriam bowl became a formality, it woke him up and he traded to get the best possible team he could. He has left himself in no doubt that there wasn't much more he could do to not be miriam and to escape for an unprecedented 3rd time. His first escape came at the expense of Benjy Sanford and there is an element of a score to be settled. \nThe match up looks set to outscore the actual plancey bowl and both will be hoping for one more strong week to send the other in to the abyss... \n\nThank you all for another great season and a hearty mazel to the eventual plancey....\n\n---"},{"id":25,"title":"2022 · PRESEASON PREVIEW (the 'house visit interviews')","year":"2022","text":"*Sent 11/09/2022*\n\nThe bells are ringing for the 7th fantasy Plancey season and the franchises are as hungry as ever to get going. Who will stop Freedman from getting his hands on an unprecedented THIRD title. Who will halt the Sanford and Gaon “Miriam hot potatoe challenge”. It’s time to find out as we welcome in another season of extraordinary twists and turns with late night watchings, all day trade talks and early morning waiver wire altering. \nWe had the funding secured to interview each member and document their views on the upcoming season here’s the results....\n\n*Freedman* \n\nWhere better to start than with our first ever double champ. As the history books have been written, the pundits have been doing all they can to have the GOAT discussion. It is fair to say that despite one poor season travelling, Freedman was already within the realm of claiming GOAT status. However, this was confirmed after becoming the first 2 time winner of the coveted belt. Freedman has built a reputation of doing just enough to win his games and this could not have been emphasised better than the 0.82 point victory to take the belt. \n\nWe were invited to 1 Markham close to interview Freedman to see how he feels about the coming season. We were welcomed at the door by Judith who kindly offered us a drink and a taste of her world famous crispy roast potatoes before directing us up the stairs and reminding us that Saul is not our Shabbos goy even though it wasn’t Shabbos. \n\nAs we make our way up the stairs there is a smoky aroma as we walk towards the door through the mist. We creak the door open to be met with a terrifying concoction of popping and flashing lights of the indoor fireworks pre set up for our arrival. Seconds later amid the thick smoke, our 2 time champion emerges unhurriedly turning in his swivel chair to greet us, stroking the Plancey belt perched on his lap like a bond villains cat. \n\n“Welcome my friends, to the childhood home of the Champ, I have been doing scenes here for my upcoming Netflix Documentary, “The Plancey domination”. It felt right doing this interview in Borehamwood, where it all began.” \n\nWe spent some time discussing tactics and what he feels has made him so strong over the years. He continues, “It is of no doubt to me that I was born to win fantasy football. This is what I was put on this earth to do. Tactically speaking I have been recently championing the 6pm strategy for my team and I feel as though getting everyone playing that early slot has helped the team with strength, conditioning and recovery. Nobody needs those pesky 1am games on a Tuesday morning”. \n\nOn his win last year, “Yes well that was a win for the people. To have “autodraft” Levey win our league would have been an abomination. I had to win it for all those guys out there who spend time tinkering with their team and putting max effort in. despite how close it was on the day. I was never worried”. \n\nGoing in to this season Freedman is deservedly bullish, “I have honed my skills for a number of years and I feel I have truly perfected them and I can’t see anyone stopping me from getting my third title”. \n\nThings went pear shaped when we asked him if he truly believed he has it in him to win back to back. Freedman grew uncomfortable in his chair as he starts to signal us towards the exit, “Listen, if I was to win it for a third time that would be 3 to me and 4 for everyone else combined”. He holds up 3 fingers, “3 to me, 4 for everyone else, RESPECT MAN, RESPECT!”, he slams the door in our crews face and the interview comes to an abrupt end. \n\nJudith meets us at the bottom of the stairs apologising to us for Freedman’s behaviour explaining, “He has been doing this all summer, I am quite frankly getting sick of the smoke alarm constantly going off as he insists on the fireworks every morning”. \n\nWho is going to stop this man from dominating this year? \n\n*Gaon*\n\nWe move on to Josh Gaon who now has an off year from his biannual Miriam duties. Gaon always believes in himself to go on and win the whole thing but hubris has often caught up with him meaning that a trip to the Miriam bowl is just as likely as a trip to the Plancey bowl. What is clear is that Gaon will trade, he will trade big and he will trade often and this is always the defining aspect of his season. End up on the right side and he could win the whole thing, but one error and he will be destined to continue his Miriam duties in to next season. \n\nHaving visited Gaon in the lead up to the pre season and when we arrived at Abercorn road we were met by Nicola, who opened the door with a welcoming smile, but deep down we knew, she was livid that the fantasy season was right round the corner. “Come in, Josh is just upstairs he has been doing work all day I haven’t seen him at all”. \n\nWe walk up the stairs and as we ascend, a low buzzing noise can be heard. Edging further up the stairs buzzing becomes a clearer murmuring sound. A bumbling Josh Gaon meets us at the top of the stairs muttering to himself, “If Polak goes Taylor first pick and then CMC goes off next…”. The floor is covered with thousands of A4 pieces of paper with scribbles all over them with such slogans as “Josh loves Henry”, “My name is not Miriam” and “Fuck kickers!”. Josh looks shocked as he finally notices our crew standing there, “Oh hey guys…..of Course! The interview….come in, come in…..I was just performing a mock draft of our league based on each persons picks over the last 5 years. Its actually a lot of fun but don’t tell Nicola”. \n\nWe asked him how he felt like last season, “It was interesting not being involved in some shape or form in the final day of the season but it meant I could relax a bit and watch the chaos unfold and enjoy the fact that I wasn’t take 10 years off my life with the anxiety. Needless to say I know I can do better and I will do better this year”. \n\nWhen we talked about things to improve on for this year, “I am still trying to learn when enough trading is enough, but I feel like I am slowly getting there. I put my knowledge up there with anyone in the league but sometimes I get a bit over eager to trade when I just don’t need to. Anyway guys thanks so much for coming but I am late for an “Abolish Kickers From Fantasy” rally in Trafalgar Square”. \n\nWith that our interview was cut short but we know nobody will be working as hard as JG to get himself back in to Plancey haven.  \n\n*Livingston*\n\nAlastair Livingston has spent the majority of his summer explaining to every news outlet that will listen that winning the regular season is far more valuable and important than winning the belt outright. \n\nNeedless to say despite his defiance, when entering his home at Beechwood avenue we are met by a fed up looking Elly, \"Welcome guys. Apologies I have had no sleep, Alastair keeps having these night terrors shouting, I WON IT FAIR AND SQUARE, TAKE THE ASTRICKS OFF THE BELT! ...I'm telling you he has had it every night this summer and I am getting no sleep because of it!\" \n\nWe walk in to catch up with Livingston and we catch him in his kitchen with Izzy, \"Now after 3..  shout out Daddy is going to be the Plancey!\" He notices us out of the corner of his eye and realises we have seen everything, \"this isn't what it looks like. Anywho let's get on with the interview\". \n\nWe ask Livingston how he feels last season went, \"ah yes my boys just ran out of steam I had by far the best team out there but we came up short, which my algorithm clearly hadn't factored in. On to the next one. It did hurt that Saul became the first two time champion. Given the controversy around my belt win, I have to admit that I wanted to win with every inch of my being\". \n\nAnd speaking of controversy, Livingston, our very own commissioner, was the first rule breaker of the season unbelievably. This involved taking Williams over to his team and placing him in his IR slot which is firmly against the league rules that Livingston knows so well, given he was already placed on IR. Livingston states that he had no idea this was a rule and that it was an honest mistake, however, over the weekend Williams has had his say in a tell all interview, \"I told the gaffer that it didn't seem right and that I was already on IR so couldn't join his team in the IR slot but he made it clear to me that it will be fine as he runs the league and everyone listens to him. I look like a fool now and I now don't have a franchise to play for\". \n\nGoing in to this season Livingston has put the hard work in to ensuring its the success he has been waiting for, \"I recieved an award for most mock drafts ever in an offseason last week. I am leaving no stone unturned to get my hands back on that belt. It is time\". \nWith that Alastair looked at his watch, \"oh wow its 5.30pm I should have been in bed already, got work tomorrow you see\" and with that we were ushered out of the house. You have to say the man is doing all the right things to ensure he wins, will 2022 be his year? \n\n*Levey*\n\nThe touch of plancey gold is reserved for a distinct few. The excruciating pain of being within 1 point of that gold is a position left for one man. Levey took on all comers last year, his one two punch of Henry and Taylor gave opponents next to no chance. \nThe naysayers would always chuck the book at Lev, emphasising that autodraft only got you some of the way, yet a true champion would have the appropriate amount of tinkering via the waiver wire. Much to everyone's surprise, Lev was listening and the necessary alterations were made and the man became a waiver wire superstar resulting in a trip to the Plancey bowl despite a mid season injury to Henry. Unfortunately Lev came up short and he is still yet to win the belt. \n\nWe went to visit Lev to catch up and see how he feels about the upcoming season and where he can improve. Which brought our interview crews first international trip of the off season. The trip to North Korea was long and treacherous as we took the train from China across the border. At the border of North Korea we were detained by border control in our carriage and questioned about our journalistic endeavours within the country. Having explained that we were from the Plancey Post and we document the twists and turns of the Plancey fantasy NFL season they seemed less than amused. With the expectation that our time as free men was well and truly over, fantasy NFL was the last thing on our minds. As the train continued its voyage to Pyongyang the border patrol continued their investigation and in a fit of rage I shouted, \"what a waste of time we are only here so we can interview Lev about the start of the fantasy season\". In that moment the border patrol mens faces changed, \"Lev?\", a confidence suddenly turned to fear, \"you know lev?\" The policemen pulled out his wallet to show two pictures: one of supreme leader Kim jong-un and the other a picture of Lev holding the Torah in front of the Borehamwood shul ark at his barmitzvah. We then explained that it was Lev we were here to interview and that he is an old friend. \nThe policemen apologised profusely and asked that I cut his hand off as punishment for accosting us. Needless to say I declined but we were told we were in the wrong carriage and we then travelled the rest of the way in the supreme leaders luxury carriage where we were fed the most exquisite food and were offered a brochure of all the passengers on the train and we could chose 5 to torture for the duration of the journey. \nOnce we finally arrived in to Pyongyang we could see out the window a large statue of Lev and Kim Jong Un deliberating over what looked to be an ipad showing the waiver wire with Lev pointing to amen-Ra St. Brown. \n\nUpon arrival at Lev Castle we were met by Kira who had told us, \"thank for coming I know its a bit of a trek, It's a bit of a commute for me from here to Morasha but at the end of the day Lev says he does his best work from here so...here we are\" \nWe head up to meet Lev being massaged by two Korean females. We ask about the current season, \"when does it start again? Sorry I am completely lost here\". We explain that the draft has been and gone and that the season has already started, \"Ah fair enough, how am I doing?\". He looks at his phone and notices that his 3 players have scored 70 points already and he shrugs his shoulders, \"just another day in the life\". \n\nWe ask if he thinks he can win, \"to be honest it would be bloody hilarious if I did win. All the hard work everyone else puts in. But I won't be miriam I can tell you that for free\". \nWe immediately leave clear in the knowledge that we were pretty sure Lev didn't even know what sport his team were playing. \n\n*Jamie kay*\n\nThe 2020 champ unfortunately didn't follow up his victory with a back to back. Hurt by his first round pick and odd romance with the 49ers it meant that the season fizzled out relinquishing his hold on the belt. \n\nHaving spent the off season getting married, JK believes he is fully settled and primed to take on all comers this season. Jamie has been considered within the GOAT conversation and will be chomping at the bit to take on the current pound for pound champion Freedman. \nWe had to cancel a number of interviews with Jamie given he had been in isolation after a bout of chlorine poisoning from the pool at his stag. \n\nWe finally got to Aberdare Gardens to see how he feels about the season. We knock at the door and are met by Nat, \"Welcome guys, Jamie is super excited that you are here. It's all he has been talking about for weeks, which is exciting as it means the focus has moved away from discussing how annoying my sister is which has been helpful.\" \nWe head through to the back garden to see Jamie manning the bbq clearly ready for our arrival. He let's out a huge fart followed by an almighty belch and its official...its a kay household. \n\nWe ask him on his thoughts from last year, \"ye it felt like a weird one. Almost like I was hypnotised. Every time I went to draft a player I could only draft a 49ers player. Every time I went to the waiver wire I could only see 49ers it was bizarre. Despite this, I have been seeing a psychiatrist over the summer to correct this issue\". \n\nThe good news is not one 49er in Kay's team. \nGoing in to this season, Kay adds, \"I feel I can be the GOAT of this league. Saul is getting all the plaudits but I have been waiting in the wings and have never even been in a Miriam Bowl.\" Keep your eyes on JK, his are firmly on the prize.  \n\n*Sac*\n\nIt is fair to say before the extra game came in to effect, Sac missed a trick on the name of his team as it should have been \"at 6's and 7's\". The man is the model of consistency and if he can continue in this vein 7 wins should be more than enough to get him where he needs to be. As a previous winner of the belt he has shown the importance of coming good at the right time. \n\nWe went out to Israel to catch up with Sac and see how he felt. We were welcomed at the door by Sophie, \"Heya guys, Gid said you would all be here. Come on in\". Before meeting Sac we asked Sophie her thoughts on the Plancey fantasy league, \"well I'm not too sure how to feel about it. I was told that our anniversary was cancelled and that was non negotiable because of the draft. Not only that I have seen a different side to Gideon since he has been playing this fantasy football. I have been woken up on many occasions being told that he has been fucked again by the time difference and he has lost his match up because of FUCKING DAVANTE ADAMS! So...ye...not really sure how to feel. Anywho Gid is ready waiting for you.\" \nWe walk through the corridor to be welcomed by Sac who has 16 screens up doing 16 different mock drafts, \"oh don't worry about that we can let them carry on...its become a but of a hobby of mine in the off season to join as many mock drafts as possible and flood the message boards with angry messages to get players to hurry up with their pick. I mean what are these guys doing...its the 9th round, nobody gives a shit, you aren't picking a bloody forever home!\" \n\nWe can see that Sac is getting more angry so we bring him to lighter topics and ask him about his views on last season, \"ah yes I had a word with goodell at the beginning of the season regarding this extra game as I build my team to get to a 6-7 record. But he wouldn't listen to me. At the end of the day I couldn't quite do it and it's something that stays with me everyday\". \n\nGoing in to the next season he feels as though he is in with a shot, \"I like to think I always give my teams a fighting chance. It is tough when I have to go to sleep clearly winning a match up and at any point that can be swept from underneath me and I would be none the wiser, but it's something I have had to live with. Be that as it may, I am confident and this is Sac's year\". As we leave the premises Sophie provides us with a list of key dates to take in to account for next year's fantasy calendar. \n\n*Miriam*\n\nNow we come on to the perennial Miriam of the Plancey fantasy. Sanford completed his hatrick of Miriams last year in what can only be described as a dark day state side. On the day of the loss, Sanford was arrested in Central Park for public nuisance - i.e. sticking out of his leg to trip up oncoming pedestrians.\nAs he was placed in the police car you could hear Sanford screaming, \"Antonio Brown I will get you for this!\" \n\nWe travelled to NY to get an exclusive interview with Sanford and were welcomed at the door by Olivia, \"Welcome guys. Benj told me you were here for the interview come on in. He hasn't been the same since the arrest. He has random moments of mild tourettes where he shouts obscenities such as...ORLEANS DARKWA and LEANORD FOURNETTE whilst making wanking signs and moaning faces. It's all been a bit odd here.\" \n\nAs we walk in to his apartment we are met with Sanford watching an old LA Rams match from 4 years ago. He turns to greet us, \"ah guys welcome, I am just doing a little research, I think this Todd Gurley chap is going to be my first round pick this year, he looks like an absolute machine\".\nAfter explaining that Todd Gurley isn't the best option, Sanford moves on swiftly, \"Can you believe what Brown did to me that scoundrel. My team was in a good spot, I felt good about the day and this shmock starts doing starjumps in the endzone topless. I knew the writing was on the wall from that point onwards\". \n\nWe asked him how he feels about this season coming up, \"it's a chance to start a fresh and I am going to take it with both hands. Its time to get rid of this Miriam name once and for all and finally get hold of the Plancey belt\". Sanford has shown signs previously of putting a top quality team together...let's see how this season plays out. \n\n*Polak*\n\nDan Polak has made himself quite the reputation. The Miriam bowl specialist continued his annual regular season slump followed by final day heroics to escape the impending doom that is Miriamhood.\nThis was a poor show given how well Polak had performed the previous year being pipped to the championship on the final weekend. \n\nWe went to Polaks house to interview him going in to the final season where Gila welcomes us in, \"oh will you all piss off please. All I hear about is fantasy this fantasy that. My bedroom is lit up for 4 months of the year at 4 o clock in the morning with this stupid NFL stuff. Anyway he is upstairs\". \nWe walk upstairs to meet Polak asleep at his desk. We nudge him awake, \"ah apologies guys I was up watching curling in the middle of the night so a bit finished now, lets do this interview\". \n\nWe asked how he felt about the season going forward, \"I feel like I have gone backwards. Things were moving in the right direction and then last season took me back to square one. Just a travesty. Be that as it may...new season new beginnings and I'm feeling good going forward\". If Polak is feeling confident then that can only mean one thing...a trip to the Miriam bowl is the likely outcome. It is still the case that Polak, Lev and Sanford have not held the Plancey belt yet and they will all be looking to change that. \n\nWe wish everyone the best of luck tonight and for the rest of the season. Hearty mazeltovs all round\n\n---"},{"id":26,"title":"2022 · REGULAR-SEASON REVIEW / Playoff opener","year":"2022","text":"*Sent 17/12/2022*\n\nThe beginning of the season is always met with wild optimism. Every franchise believes it will be their year. We draft…we set our first lineups and we expect only good things…however, it doesn't take long for it all to become clear….who has the monster team, who has that one player who can get them through any gameweek and who is streaming a running back every week hoping for the best. \nGameweeks roll in to months, losing records start to mount up and significant others become agitated by the lack of spare time in diaries. Somehow, in the blink of an eye, three months have passed and the importance of regular season records gradually fade off in to the distance. This can only mean one thing…it is playoffs time…those early season levels of optimism are refreshed with a feeling of \"anything can happen\" and \"why not me?\" For those who have made it to the party a hearty hearty mazel tov….let's take a look at this week's wild card round as our top two take a well earned rest from action…\n\n\n\n\n\n*Lev*\nIt is no longer becoming a surprise to see Lev in the playoff picture. He has done it again, but his wild card entry does not tell the full story in the slightest. Having performed a full autodraft, as is tradition, Lev was laughed out of the building as it picked him 3 buffalo bills players. You could hear the taunts of \"not enough diversity\" and \"it has picked up a player who has just been shot\". The bookies had started paying out on lev to attend his first ever miriam bowl. But there was no panic from Lev…he checked his team, shrugged his shoulders and pressed optimise lineup and the rest was history. With his Bill boys leading the charge, Lev stormed to the top of the table going unbeaten through the first 5 weeks of the season and all but confirming a playoff place before anyone else could blink. Not only this but the staple signing, CmC, was not performing as expected and it was no surprise to see he was swiftly moved on to a franchise where he could succeed in his role. The NFL has declined to comment on any possible investigation in to foul play from foreign governments in relation to the trade. \nDespite this, it has not been smooth sailing for Levallo Bills, the second half of the season has not been as consistent as the first, even leading to the teeniest, tiniest possibility of a miriam bowl appearance come final weekend. Write Lev off at your peril the Plancey finalist of last season is seeking revenge for his unfortunate close loss last year and he has the backing of a nation to go and do it again. \n\n*Sac*\nA hearty mazel tov to Sac who has made sure to let everyone who will listen know that he finally has a winning record. This is a big achievement to say the least, only trumped by his mid season Bernie award. He was kindly nominated by Josh Gaon for the \"nice addition to the league\" award beating out stiff competition from Liam Stein and that other Canadian guy who once joined. \nWell done on both accounts Sac….in the words of Josh Gaon, \"thanks for making up the numbers\". \nSac had a tough start to the season but he used his tinkering nous in order to pivot from his team of losers to move up the league and in to playoff contention. With that out the way Sac is looking to turn his first winning record in to playoff victories to join Saul as a second time champion. Top stuff from a guy who is just nice to have around. \nAs you can imagine Sac was incensed when called out by Josh Gaon on the woodcast and in a fit of rage called his agent and asked for a transfer to a league that would truly appreciate his mediocre records. Within minutes Sac had removed his pads, thrown them across the field and performed star jumps in the endzone as he removed himself from the league and set his sides on to greener pastures . Chaos ensued leading to a public apology from Josh Gaon who made it very clear that it was a miscommunication and offered Sac a taped recording of a sermon of any parasha he chooses for him to come back. Needless to say, Sac has forgiven but never forgotten and will be eyeing up a playoff match up against Josh Gaon to settle the score. \n\n*Saul*\nNow it wouldn't be a post season without our 2 time champion. Freedman is back in the playoffs looking to make it a historic third plancey belt. \nThe season hasn't necessarily gone as planned but his boys did exactly what they needed them to do and ended up sneaking in the playoffs in the last remaining spot. Some might say it would be destiny given the way the season has gone that Freedman will take his boys all the way. Needless to say, he has done it before and there is no doubt he can do it again. \nThe atmosphere at Freedman HQ is not at its peak. Leading up to week 14, Freedman spoke to us and let us know that, \"as long as the playoffs were made, that was all that's important\". Is this a sign that the great man has given up or does he have one more trick up his sleeve. \n\n*Jamie*\nWhat can be said about Jamie kay. The man looked down and out… a shoe in for miriamhood. However, he has never been there before and he made a promise that he wouldn't be there this year. He made good on his promise, all but securing his playoff status in a relegation 6 pointer with polak in week 13. By the time the final standings came around you might say Kay looked comfortably in the playoffs. \nKay is under no illusions about this season. It has not been pretty, but having made it to the promise land Kay is in the bonus rounds and he will look to make the most of it by trying to win back belt he was forced to hand over last season. \n\n*Lev vs Jamie* \nThis is a game coming down to the fine margins. Jamie is a man in form whilst lev is a man hoping that his stars will come good at the right time. \nIt all comes down to this…the only two men in fantasy history who can boast never having had to play in a miriam bowl. One might say this is the elite club, where standards are constantly kept high. \nWhilst form generally goes out the window in the playoffs, we at the plancey post are having a tough time looking past another semi plancey for Dr Kay. \n\n*Saul vs Sac* \nA game involving two former champions. Both have a huge wealth of playoff experience. Much like our other match up, form would tell us that this has Sac in the semi plancey. Both have the players in their respective teams to run away with this one. It is a tough one to call but given Freedman's QB issues, at the worst possible time, the Plancey Post makes Sac favourites… \n\nA heart mazel tov to all and we will see you next week for the semi plancey's\n\n---"},{"id":27,"title":"2022 · Semi-Plancey preview","year":"2022","text":"*Sent 22/12/2022*\n\nWeek 16 is where it's at and this week promises plenty more thrills and spills. Re-emphasising the point that when it comes to the playoffs, form means nothing, our two \"out of form\" players went and won their wildcard matchups. This sets us up nicely for a weekend where our bye weekers may possibly be feared like never before. A mystique surrounds our top two this year with the fans and pundits alike feeling like their respective teams may be head and shoulders above every other team, in a way we may have never seen before. But this is the playoffs and we have two underdogs licking their lips at another shot at glory in the plancey bowl. \n\n*Lev vs Alastair*\nAn apology must be made to Lev. The number of times the Plancey Post has doubted him and been proven wrong is too many to mention. We formerly apologise to Lev and the nation he so proudly represents. We predicted a loss in week 15 and it was anything but. The fans were provided a lev special as he stormed to victory leaving Kay in his wake. \nThis sets Lev up for a match up with the might of Livingston. A tall ask but nothing lev has been worrying about, as you can imagine. There has been talk that he still hasn't realised he is still in the playoffs and within a chance of winning the whole thing. Be that as it may, it has been noted that for the first time in years public opinion has softened for North Korea as the world gets behind the scrappy underdog against the expected victor and goliath Livingston. \nIn the lead up to the semi plancey, Lev has taken the very chilled approach. He has always believed that whatever happens happens and there isn't much more he can do about it. He takes the arm round the shoulder approach with his players which is invariably the reason he has such a fabulous record with the waiver wire. Players down in the dumps such as Watson and Jones join the brigade and results are generally instantaneous. \nPrior to the Thursday night match up of the semi plancey, Lev has decided its best for him to not be on the sidelines in order to not provide too much of a distraction to his players. He will therefore be sunning in Dubai watching via VPN as his boys look to take him to an unprecedented second straight plancey bowl appearance. \nBut is this all a ruse to get inside the head of Livingston. There is nothing that will hurt more for Livingston than to have what he believes should be his, taken away from him by a player who probably won't even be watching. But, after all these years, we at the Plancey post firmly believe that Lev fully knows this and is using it to his advantage. He must beware though, it was his trip to Dubai last year that possibly lost him the chance at being the current holder of the plancey belt. \nNow let's move on to our regular season runaway leader. Livingston, for the second year in a row, has gained himself a bye week but he will be hoping for a slightly different result this year. Elly has let us know at the plancey post that she doesn't think he can take fumbling another surefire plancey victory. The world will be watching and the world will be expecting that Livingston will sweep past Lev and move on to his first Plancey bowl in the modern era, something the fan base has been craving. \nWe caught up with the presenters of the award winning \"Livingston lobusses\" podcast this week. A podcast that follows the team across the world in the hope of a Plancey to call their own. \"Surely this year is the year. It has been great to see so many wins this year. The last time we won it I was just a wee lad. My friends have always told me that it wasn't a real victory and I used to cry myself to sleep about it for years. Still do to some degree. But we can banish all demons this year\". \nLivingston spent the bye week infront of his computer screens keeping a close eye on the dogs polaks team just incase their were any issues he could waste his time getting anxious about. \nHowever he took some time out of watching the nfl too closely to take his team on a field trip to Glasgow to rouse them up and get ready. It just so happened to be when Dallas Goedert of his beloved eagles came off IR which meant he wasn't able to fulfil his commissioner duties at the time. \nThis match up has all the makings of an absolute shoot out. Lev has hit form at the right time and Livingstons teams are predicted to score 250 points weekly. This may be the semi plancey to keep your eyes on. Can Lev exorcise the demons of the past? Can Livingston exorcise the demons of the past? You have to watch this one….there are guaranteed exorcisms. \n\n\n*Saul vs Gaon* \nFreedman is back in yet another semi Plancey and he is taking it all in his stride. It is just another day in the office. He got himself to the playoffs and he let everyone know that was the season objective. But he knows more than anyone else, once your there that's where the hard work starts and Freedman does his best work in these shark infested waters. After a double dose of QB issues he calmly picked up Cousins. In the first half of his match up things were going pear shaped for Freedman as cousins was on negative points. As he was coming out for the second half Tony Romo was quoted saying that Cousins \"has a Freedman sized hole in his ear\". Legend has it that players have never seen a hairdryer treatment like it. Nevertheless, it worked and his second half performance propelled Freedman to a simple victory to make it to the semi planceys. \nFreedman has been known for his unconventional tactics and he was seen in attendance with his team at the Qatar world Cup final. There has been multiple rumours around the reasoning behind taking the team to this game. The first being that they needed to see what a winning team looks like, but the more disturbing murmurs from the camp are that he took the team to the see the migrant workers living conditions and made it clear that this is where they would be living if they failed to get a result this weekend. Shocking tactics if true. But hey it has worked for Lev. \nMuch like Lev, Freedman is going to need all his men firing this week as he faces a mammoth task to get past Gaon's brochos. \nJosh Gaon….what can be said…is he the GOAT….is he the WOAT? All we know is that he always always brings excitement to the table…full team trades, 6 for 1 trades, season implosions, season explosions….the man cannot do anything in halves. Which bodes well for him as if all goes to plan he will be able to double his Plancey belts and try and remove the two Miriams etched in the memory of fans globally. \nGaon has drove himself crazy this season as the closeness of the league meant there was actually a point he could have ended up back home in the Miriam bowl, despite having a career year in terms of points. Nonetheless, he won his final games to, incredibly, secure a bye and who can stop him now. \nGaon spent his bye week working through stats that helped show he wasn't actually as bad as the world believes at fantasy football. Rumours are he was doing this in anticipation of potentially losing in the semi plancey this weekend in order to save face. Be that as it may, we all know come Thursday evening Gaon will have one thing on his mind and that is to win and get himself one step closer to the belt he feel his hard work truly deserves. Let's hope \"destiny\" doesn't get in his way this time.\n\n*Plancey predictions*\n\nAt the plancey post, we are finding it hard to look past the bye week boys for this weeks match and fully expect a JK Dobbins showdown between the two in week 17. But we implore Saul and Lev to do us all a favour and prove us wrong! \n\nA hearty mazel tov once again to all participants and see you next week for the plancey edition!\n\n---"},{"id":28,"title":"2022 · PLANCEY BOWL preview (semi recap 'Wow. Just wow')","year":"2022","text":"*Sent 28/12/2022*\n\nWow. Just wow. Fantasy football….what do you do to us! Semi plancey weekend lived up to the hype…and then some. Freedman had made it clear upon making the playoffs that he was just happy to be there and look where he is now…he pummelled the much fancied gaon in to submission. It was a vintage Freedman performance underlining exactly why, when it comes to the playoffs, you can never write him off. Gaon will be left wondering, yet again, what might have been, after his team, who he had told everyone who would listen, \"gets about 150 a week\", couldn't get to 3 figures when it mattered. \nIf that wasn't big enough, the big story of the weekend has to be Lev, defying all the odds, to win a topsy-turvy matchup against heavy favourite Livingston. A victory that will go down in the ages as Lev continues in his pursuit of that coveted first belt having narrowly missed out last year. \nBoth Livingston and Gaon are left to ponder what went wrong this week 17. What is becoming increasingly clear is that whilst they were both talking a big game having secured their bye week…for the second year in a row they have not been able to perform come week 16. \nFor the 2 underdogs who have had to do it the hard way….we move on to the biggest game of them all…it's plancey bowl time….\n\n*THE PLANCEY BOWL*\nIts a familiar look to the plancey bowl this year as we yet again have saul vs lev as the match up. The borehamwood and Elstree choir have been brought back for the half time show brought to you by St Giles. \nEveryone thought lev's big year was last year. He had the team and he felt ready for it. After a close game, Lev agonisingly lost by half a point. The closest game in plancey bowl history. From that moment on…lev had made it his mission to get back there. As we noted, he was laughed out the building on draft night. But lev got the last laugh as his team stormed to a 5-0 start. It was at this point lev started to coast. Everyone thought the team had run out of steam. But they were just getting started…the playoffs came around and levs team started to soar… with the highlight being a victory over the beastly livingstons. Lev has peaked at the right time
