 and who would bet against him now. \nWe caught up with Lev leading up to this weeks game, \"I can't believe I get my chance to avenge my loss last year. The belt is mine this year! I will be looking for any player that Saul puts on the waiver wire to bring over to my squad\"...lev alluding to his genius pick up of D.J Moore to lead him to victory after Livingston had thrown him on the waiver wire. Before we headed off to our other media duties…Lev did let us know he was opening up the B.S.Levey foundation for unappreciated and unwanted talent. A beautiful gesture from a man who has made a home to many a talent who still have more to give. \n\n\nWe have run out of superlatives for Freedman. The man, the myth, the legend. This will be his 4th appearance in the Plancey bowl and he is looking to be a third time champion and our first ever back to back champ. The generational talent has been lauded the world over. His stats are second to none and even when he doesn't think he has the team to do it….he manages to pull it out the bag. The sign of a true champion. This is Freedmans world and we are all just living in it. \nDespite all his QB issues he has taken it in his stride and he brushed aside a Josh Gaon who was left wanting. \nSaul never thought the Plancey bowl was realistic this year. Now that he is here, he has complete focus. Given his Lamar Jackson issues, he has been able to get the best out of Cousins and it is a love affair that has got him all the way through the playoffs. He now has that age old coaches decision to make…Cousins has got him this far, if Jackson becomes available week 17, does he stay with the hot hand?\nSources tell us that Kirk Cousins has been calling Freedman every 20 minutes just to \"check in and see if he needs anything\". \n\n*The match up*\n\nThis is going to be a tough one to call…two underdogs hitting their stride at the perfect time. They played a close one last year. Lev is definitely the fan favourite and he has revenge on his mind after last year. Freedman can go in to this game free of any pressure, just another day at the office and another shot at a belt. We don't want to predict too much especially given how poor our predictions have gone so far, we will just wish both huge luck and a hearty hearty mazel tov. \n\n\n*The miriam bowl*\nHow in the world are we here again. Much like the plancey bowl has the same participants, so does the dreaded miriam bowl. It has been another one of those seasons for polak and Sanford and they both look like they just want it to be over. Well luckily for them it will be after this weekend, but who will hold the dreaded title of Miriam going into next year…\nMuch like last year, Sanford spent the last few weeks of the regular season scrapping to get out of the miriam bowl positions and he almost did it aswell. \nThe question is, having recently welcomed twin boys, will Sanfords focus be elsewhere come his biggest game of the season this weekend? The stats do not look pretty for Sanford, this is his 5th appearance in the miriam bowl (asterisk and modern era included) with a loss in this year's bowl meaning an unprecedented 4th Miriamhood (asterisk and modern era included). \nSanford knows that despite that one magical season where he almost and probably should have won the whole thing, it has not been smooth sailing in the fantasy world.\nHaving spoken to Sanford earlier this week, he has not taken kindly to participating in another miriam bowl and there are rumours that the backroom staff ar facing the chop on the merry-go-round that is Sanford HQ. The objective has to be to make playoffs at a minimum next year in order to break the curse. \nFor now, Sanford has a familiar foe in the shape of Daniel Polak and much like Lev, he will be looking to avenge last years loss. Rumours in the camp are that Sanford has made it explicitly clear that if anyone pulls the kind of crap that Brown pulled last year, he will be shot. \nPolak has had a very similar poor season to last year where the writing was, once again, on the wall for Polak quite early. This allowed him to make some moves in order to build for week 17. \nThe miriam bowl specialist is taking part in his 4th miriam bowl and will be looking to escape for a fourth time. At some point the streak will have to end and Polak will pay for playing with fire, the questions is….is this the week? \n\n*The match up*\nOn paper Sanford has not had the opportunity to build a team for the specific week. However, he will be hoping that his studs in Hill and Cook will get him through and do enough to get past what has been a poor team in the dogs Polaks. We cannot make a call on this game but if last year was anything to go by…expect drama.\n\nWhat a fantastic season…a big congratulations to the eventual Plancey. If it is Saul again….everyone else may have to give up.\n\n---"},{"id":29,"title":"2023 · REGULAR-SEASON REVIEW / Playoff opener","year":"2023","text":"*Sent 14/12/2023*\n\nWelcome back to the Plancey Post, where we have the scoop on all things playoffs. \n\nWe must first apologise for a lack of pre season post. Our editor de cided to have a baby when we were going to print and we refused to compromise on quality. \n\n\nBut here we are, plancey fantasy is back....\n\nThe offseason was marred by controversy regarding a possible Saudi takeover led my the disgruntled Josh Gaon. Whilst Golf has LIV and football has the saudi pro league, Borehamwood fantasy football has the infamous Sleeper app. Gaon has pushing hard with a supposedly huge marketing budget in order to try and push other members to join the app. In a press conference earlier this summer, Gaon was carried in via a golden chariot wearing a thobe.  He made it clear that despite fronting the Saudi sleeper league, he continues to be a staunch supporter of human rights and will continue to speak out and that the functionality of the new app was the only reason for taking the job. However, the rumoured £1mil a week salary may have also been a factor. \n\nNeedless to say, it has caused rumblings in the fantasy community. Miriam specialist, Dan Polak, stated, “I would never take their millions just so I dont have to see when my kicker from 2010 scored a field goal.” \n\nThe furore created a hotbed for one of the most exciting fantasy football seasons in recent years....we saw what felt like more Monday night football fantasy steals than ever, we saw Lev hold on to a kicker who didn’t actually have a real world team and we saw fireworks in week 14 leading to possibly the most exciting regular season endings we have ever witnessed. \n\n*SAUL (+2 planceys in NNPI)*\nThe GOAT is back again for another shot at the title he truly believes is his. Our only multiple world champion is still reeling after his loss last year in murky circumstances and he has stated that he has never felt more ready to get back on the horse and go for it once again.\n\nFreedman will have to go the scenic route of the playoffs after putting himself in a spot of trouble to get to the dance. However, a week 13 win secured his playoff passage. The expectation of a third plancey belt is there as some may say he has the best team left in it.\n\nFreedman’s seasons are often met with a controversy here and there and this year was no different as he and another trader who shall not be named (but was seen handing back all his traders anonymous badges) were involved in yet another trading scandal. Having not learnt from past issues, an attempted loan trade caused uproar across the globe. Having been chastised in the press, Freedman called a press conference and in Steve Smith like fashion uncontrollably sobbed explaining he just wanted trade innovation but never intended for it to get to this. Shame on him. \n\nThe bookies have Freedman as the outright favourite to win it this year. \n\n*Ally (-1 Planceys in NNPI)*\nA man for the regular season, Livingston has spent many a season heading in to the playoffs as the heavy favourite only to spunk his load too early and have his season crumble in to insignificance. But this year was different. It took an almighty MNF showdown to get him to the playoffs and there are rumblings that this is the luck he has needed in years gone by to win it all.\n\nSince records began, amazingly, Livingston has never been involved in a plancey bowl, which has brought him in to the WOAT conversation. He will be looking to change that this year.\n\nWe caught up with Tyreek Hill who gave us some insight in to working with Livingston, “I came here to try and get that belt for coach. I am happy we got to the playoffs but it almost didn’t happen. Working under this coach is slightly weird, we do the same drills as pretty much anywhere else, but every Wednesday we have a session in the afternoon to discuss how other teams waiver wire pick ups will affect us. We also have emergency meetings that could occur at any time of the day or night to discuss how any trade in the league has affected us”. Very strange indeed. \n\nNeedless to say, now he has made the promise land...who is to say he won’t go all the way. \n\n*Dan polak (0 planceys in NNPI)*\nIt was all about getting back to basics and cutting out the mistakes for Polak. Making playoffs with two weeks to spare was exactly what the doctor ordered. But questions have been asked about the quality of his squad and their ability to get past week 15. \n\nPolak has been tight lipped about his chances and has gone missing from the public eye. We at the plancey post had heard rumours that Polak had taken his team to a remote farm in the Cotswolds to train and get ready for their playoff charge.\n \nWe sent a team out there to see it we could interview the man they call the miriam specialist. \n\nIt was a murky windy day as our team walked up to what can only be described as vast acres of gorgeous British greenery. We made our way through the gate marked “no trespassing”. \n\nAfter about half a km’s walk through the Cotswolds beauty, we can hear shouting and wailing noises. Making our way through the hedges, we noticed the entire dogs polaks squad standing together in a circle surrounded what must be 30 goats. In the middle of the circle, Polak was screaming at Tyler Lockett, shoving an axe in his hand, whilst holding a goat by the collar with  “Freedman” printed on its body. Polak screamed, “Do it, Tyler....we need to learn how to kill Goats! Now stop being such a pussy and kill it”. \nTyler Lockett started to whimper, tears were streaming down his face, “I can’t do it coach”. Looking disappointed, Polak snatched the axe from Lockett’s hand shouting, “I have no time for waste men like you!” and with one fail swoop he swings the axe towards the Goat, swiping its head off in one shot. Blood squirted all over Tyler Lockett now on his knees beside himself. It was at that moment Polak noticed us in the corner of his eye. He turned towards us and paused for a second, pulled up the axe and began sprinting towards us. We had to run as fast as we could to get away and Polak bellowed after us, “tell Freedman to get his affairs in order, this weekend we slay the GOAT”. \n\nIt is fair to say Polak may have finally lost his mind in an attempt to get the belt. \n\n*Sanford (-3 Planceys in NNPI)*\n\nMazel tov to Miriam for finally no longer being Miriam. In what has been a welcome season for sanford he has made it to the playoffs and he is absolutely delighted to say the least. There are no longer plans for a naked photoshoot this off season. \n\nSanford has made it super clear that the aim was to not make it to yet another Miriam bowl appearance and now that he is here, Sanford has history of making it all the way to the plancey bowl. \n\nIt seems the decision to take the only US franchise in the plancey league to London in the off season has worked wonders. Sanford has stated that he felt clarity on the move back and said being in the US was extremely difficult given that he had constant NFL chat everywhere he looked pushing him into making strange draft and trading decisions. \nThe move to an auto draft policy has worked wonders and the question is...now the monkey is off his back can he take his boys all the way to the big stage. The man has unfinished business in the plancey bowl and he is seen as the dark horse in this year’s competition.\n\n\n\nSo here we are again, the quarter plancey and some tasty match ups. \n\n\n*Sanford vs Ally*\nThis is a tough one to call. Sanford never really looked in Miriam trouble and Ally came within a whisker. However when you look at the teams going in to the week there isn’t much to separate the two. Both have players capable of winning weeks on their own and sanford will be hoping his bills stack comes to play. On the other hand Ally has what feels like 2 players from every team in the league. So if particular teams do well on the week, Ally could run away with it. \nVegas are putting Ally as favourite for the win. \n\n\n*Polak vs Freedman*\nDespite the sacrifices polak has been making to the devil, this one could be over pretty quickly. Freedman could possibly feel aggrieved at having to play this match given the quality of his team. But that is fantasy, and in plancey fantasy, anyone can have their day in the sun. \nStranger things have happened, but vegas are reporting a number of bets that Cee Dee outscores the dogs polaks this week....\n\n\nA hearty mazel tov to you all and best of luck to the quarter planciers.\n\n---"},{"id":30,"title":"2023 · Semi-Plancey preview","year":"2023","text":"*Sent 21/12/2023*\n\nWelcome back to the Plancey Post where we have hit Semi Plancey week and our match ups take a familiar look\n\n \n\n*Josh Gaon (-1 Plancey in NNPI index)*\n\nMiriam positive Gaon has been walking around wearing his bye week championship belt over his shoulder in an attempt to claim an element of success in fantasy. The hope is that he gets over the fact that he got the bye week and starts to focus on actually winning a bye week game. Who better to do it against that his old foe and last weeks Miriam specialist slayer. This is the third year in a row these two will meet in the semi plancey and surely at some point Josh Gaon will win one.\n\nSplitting his time between being the face of the Saudi backed sleeper app, being a doctor and fantasy football, Josh Gaon has been a busy man this year.\n\nWe went to Gaon’s new plush training facility to discuss how he feels about this week. As we approached the facility and there were clear remnants of what looked like a party the night before.\n\nThere was a big banner over the front of the facility reading, “Bye week champions”. Needless to say, we were met at reception by Javonte Williams, “Hi there welcome to the home of the Denver Brochos, My name is Javonte, is there anything I can help you with today?”\n\nWe were perplexed as to why Javonte Williams was the receptionist at the training facility, “Ah yes coach has decided that he has no use for me on the field and therefore, I asked for some extra work around the facility. Is there anything I can help you with?”\n\nWe asked him if it was possible to have a sit down with his coach, “Unfortunately not, Coach Gaon is actually out of the country at the moment. Off the record he has been sent to a rehabilitation facility on the west coast of the US for fantasy related addictions. A terrible shame at a crucial time.”\n\nThe league has a history of Holidays and trips abroad affecting fantasy performance and that is something that the man Gaon is playing this week knows all too well.\n\nGaon has had a somewhat interesting season. He would be the first man to tell you that he feels calmer and more at ease which has led to a lot less tilting and more winning. But this is where he needs his men to start performing for him, we are not sure he can take another week 16 loss. Plancey neutrality is the aim and slaying GOAT’s is the game.\n\n \n\n*Jamie Kay (+1 Plancey in NNPI)*\n\nKay has been well and truly dominant this year in fantasy to the point that by week 6 he was planning his playoff route. Kay is starting to stake his claim for GOAT status but he knows that he needs a win this year to solidify that claim.\n\nKay needs to make sure his boys are not complacent going in to the bye week, especially given the recent history of bye weekers not winning the all important plancey. To keep the boys focussed on the task at hand Kay took the team to have a traditional shabbat at borehamwood and Elstree united synagogue. It gave the team the opportunity to bond and get an understanding in to where the coach has come from. Prior to shul the expectation was that the team would share out all the aliyah’s, however, when the time came, as is often the case CmC ended up just doing them all. They were provided the full experience, a financial talk from Freddy David, a request for donations from Danny Jacobs and a discussion of what it means to be the richest man in a community from Steve Davis.\n\nAs team MVP this season CmC was then stood in no man’s land between the bimah and the Aron for a world class rendition of shema Beni. Afterwards the community were invited to a kiddush sponsored by team Obi-Quon Kenobi filled with Robinson’s orange squash, that chocolate cake with the amazing brown icing with black diagonal lines on it and ready salted walkers. The team then met at 3 o clock in red road park for a spot of soccer just like old times.\n\nPrior to the Saturday night limo tochnit, Justin Herbert and Keenan Allen were jumped as they walked past the Hart & Spool on shenley road causing injuries that have put Herbert on IR and Allen too injured to play.\n\nKay may need to administer some of his magic touch to get his team through given these injuries.\n\n \n\n*Gaon v Saul III*\n\nAs stated this is the third week 16 game in row for these two and Gaon needs to find the answer to get one over the GOAT.\n\nDespite being in the US, Gaon has been playing mind tricks, using his Saudi millions to pay Polak to put the dead goats head in to Freedmans bed in the week leading up to the game. The pundits have had Freedman as the best team all season, despite the slow start to playoffs, Freedman is expecting his team to come alive this weekend.\n\nVegas has Freedman to continue to be a bad luck charm for Gaon, but from Gaons perspective the route to plancey neutrality will require victory over the best.\n\n \n\n*Ally vs Kay*\n\nAnother week 16 match up for Livingston and he will be feeling on top of the world as it was only 2 weeks ago he was a few minutes away from being in the Miriam bowl. Again, with Kay’s injuries this game may have become closer over the last couple of weeks.\n\nVegas has this match up even and could very much go either way.\n\n \n\nA hearty mazel tov to our week 16ers and best of luck trying to get to the plancey bowl.\n\n---"},{"id":31,"title":"2023 · PLANCEY BOWL preview","year":"2023","text":"*Sent 28/12/2023*\n\nThe week has finally arrived….It is the blockbuster weekend of the Plancey and Miriam bowl. Borehamwood and the world over have been waiting all year for this. For two men, the chance for legendary status awaits. One man has his sights on being the first ever 3 time winner of the belt. The other is looking to end all questions regarding the “practice” year victory. Only one man will remain standing at the end to take his place in the history books….  \n\nIn our other match up, two cousins face off in a match for the ages to ensure safety of ridicule for the next year and going forward. It is the game that nobody wants to take part in, but now they are here both are primed and ready to ensure their safety from Miriamhood. Will the cousins put their familial relationship to one side in order to succumb each other to a lifetime of pain and heartache.  \n\nThis is Plancey fantasy 2023…it doesn’t get much bigger than this…. \n\n \n\n*The Plancey bowl*\n\n*Saul*\n\nAs the final game of the weekend came to a close, the cameras panned in on Saul Freedman. As his team took a knee to complete the customary week 16 victory over Joshua Gaon, Freedman could be seen furiously writing in his notepad and looking quite pleased with his work.  \n\nIn the post match press conference, the reasoning was quickly revealed as Freedman walked up to the podium and, with a wry smile, put his hand out to halt the reporters, “Apologies ladies and gentlemen, before I take your questions I was jotting down a few words that I wanted to get off my chest before I forget”.  \n\nThe room fell silent, with the press waiting in anticipation for a possible retirement/ loan based trade/ week 17 concession announcement.  \n\nFreedman cleared his throat,  \n\n“AN ODE TO GAON  \n\nI can feel your gaze from across the way  \ndisappointed as another season goes astray.  \n\nYour team bruised and battered, feeling forlorn  \nIn your side, I am a week 16 thorn \n\nYour research and analysis have brought you nothing but pain,\nYou’re constant bottling must be driving you insane.  \n\nData and figures to try and prove you are the best  \nIs all we keep hearing from you– would you give it a rest?  \n\nOn pesach you may be able to eat rice,\nBut when it comes to week 16, I have beaten you thrice \n\nIn your fantasy story, I may be the baddie  \n\nBut I am the GOAT, and in fantasy football, I am your Daddy!” \n\n \n\nThe whole press room fell silent, and Josh Gaon could be seen at the back of the conference room staring, clearly incensed by the additional knife in the heart of this strange poem.  \n\nFreedman looked up at the now extremely awkward crowded room and Gaon’s anger quickly turned as he could see the flop that the poetry had been.  \n\nThen a journalist from the Miriam weekly stood up looking very serious and out of nowhere a tear fell from her right eye and she began slow clapping and began squealing, “Bravo!! Bravo!!!”.  \n\nTo Gaon’s disbelief, all of a sudden, the whole press room began providing a standing ovation to Freedman. Freedman triumphantly raised his hands as the room bellowed “GOAT!GOAT!GOAT!” \n\nAt the back of the press room,Gaon began screaming, “ He has been lucky, every year I have built a team that I know should win it! Then this guy comes along and beats me every single time! It is infuriating!”. Out of nowhere he made a beeline for Freedman which was quickly cut at source by a couple of heavies forcefully carrying Gaon out of the room with him shrieking, “You have not heard the last of me! I will win the Plancey again!”.  \n\nThe GOAT has had to handle all sorts on his way to his third straight Plancey bowl. You heard that right! Three Plancey bowls in a row. He promised to make right what happened to him last year, and he is well on the way to making that right.  \n\nThe numbers speak for themselves and we are wondering if there are any superlatives left to describe the levels of performances we have seen over the last few years. Freedman will be looking to take his team and award winning poetry all the way to an unprecedented third Plancey belt, leaving all his rivals in his rear view mirror.  \n\n*Alastair Livingston* \n\nWhat a season for Alastair Livingston.\nA man who was so close to a Miriam Bowl and all was lost. He was left wondering if he would ever get a chance for the belt ever again. But here he is with his ticket to the dance in hand. If you had spoken to him a couple of weeks ago, he was just happy to be in the playoffs, but look at him now. He has his team working wonders, and now he is the next man up to attempt to slay the GOAT.  \n\nLivingston took the game to Kay in week 16 and as Kay kneeled down on the field, head in his hands, Livingston took a moment to pick him up and let him know that he fully understands the feeling of a stellar regular season coming to nothing in the end.  \n\nThe night of the victory, once it became clear that he was heading to a Plancey Bowl, was party time at Livingston HQ. Bed time was extended to 8.15pm as opposed to the usual 8, with Livingston pictured snorting a line of sea salt. It was a wild night with the team and just prior to bed time Livingston could be seen in a delirious state rambling to himself in the corner, “Listen guys, I am going to bed but if Hill is injured I would like Hopkins in, but if Hopkins is injured put Montgomery in, but if he is injured put Orleans Darkwa in”. It was at this point he was seen being shepherded to bed by Elly as he cried out, “But what if there is an inactive whilst I am asleep, I simply cannot go to sleep”.  \n\nLivingston most likely can’t believe his luck but lets be honest his team have come good at the perfect time and having had his phantom plancey rubbished by the Plancey members he will be working hard to get himself a Plancey he can truly and legitimately call his own.  \n\n  \n\n*The Miriam Bowl*\n\nThe streets have borehamwood have been waiting in anticipation for the biggest family feud since Harry and Megan left the royal family. It is red road vs Anthony road in a barnstorming cousin-off and we couldn’t be more excited. Karen and Daniella will have spent years discussing which of their boys had the upper hand over the other, this weekend definitely feels as though it will settle the debate.  \n\n*Lev* \n\nEverything has gone wrong in Lev’s season- Jefferson’s injury coupled with inactivity and a lack of magic on the waiver wire that we have seen previously, have all been factors.  \n\nHaving had the 2 week break, Lev has already attended his 7th Plancey victory parade in PyongYang, and the whole of North Korea fell at the feet of the almighty Lev on another fantastic season.  \n\nDeep down though, Lev and Kim Jong Un know that despite full control over the press and the information provided to the public, it will be hard to keep a Miram bowl loss out of the countries ears.  \n\nIn the meeting prior to heading back to the UK, the supreme leader made it clear that under no circumstances must Lev lose this match up and wipe away the clean record of no Miriam’s under the North Korean regime. His words were, “We all know that there are only 2 positions that are important in the Plancey fantasy, that is the Plancey and the Miriam, any other position is exponentially insignificant. We will keep up appearances here, now go and do your job and make this season as insignificant as possible in the Miriam bowl”.  \n\nWe must also note that Lev is under investigation for failure to put out an active team during the regular season and we suspect this one will go much like Man City’s FFP charges.  \n\nLev could now join an unwanted list of doing the ‘ole Plancey to Miriam.  \n\nLev is determined to win this match up and whilst he has to give back his belt sitting proudly in his lounge, he wants to make sure he doesn’t do it by taking on the fateful Miriam title in its place.  \n\n*Sac*\n\nSac is also in unusual circumstances, his seasons have generally had a predictability to them. That predictability usually results in a trip to the playoffs and sometimes even more. But this season, in his own words, has been dire. Despite all that, Sac usually does just enough and as we have previously chronicled, almost made it through at the expense of Alastair Livingston, which would have resulted in an almightily different outlook given the fact that Livingston now has a place in the Plancey bowl and based on current scores, Sac actually may have made it there himself.  \n\nNeedless to say, in the history books, it will simply note that Sac is playing in the Miriam bowl, and he is hoping that it won’t state a loss.  \n\nSac has had an interesting season whereby some might say he has taken the Gaon mantel for being tradesmen of the year (based on volume, not quality). The team has come under fire recently, being the only Israeli based team with crowds across the world, taking to the streets to protest against Sac and his team. Demands were made of the Plancey Fantasy Football Association to remove Sac and his franchise. Gaon was front and centre of the protests quoted saying, “Look its been nice having him around, he is just there every year with his same old record, but I have talked internally to my team and I think given the situation in Israel, we can’t possibly have him involved.”  \n\nClearly those sleeper Saudi Millions have caused a switch of sides. Regardless, the Association made it clear that Sac has an absolute right to defend himself, be it in the regular season, the Plancey bowl or the Miriam Bowl.   \n\nThat is what Sac is hoping to do because in this cousin-off someone is going to be Miriam for the first time.  \n\n \n\nA note from Rabbi Plancey, “I wish you all a hearty mazel tov on another fantastic Plancey fantasy season. Best of luck for those in the Plancey bowl and for the loser in the Miriam bowl, there is a nice big space for you in my bed!”\n\n---"},{"id":32,"title":"2024 · PRESEASON PREVIEW","year":"2024","text":"*Sent 02/09/2024*\n\nThe freedman victory tour is on its third run. Are we bored yet....absolutely not...because it’s the start of the fantasy season and just like arsenal, everyone is in the false sense of belief that this can be their year. \nSo what has everyone been up to....\nFreedman has been revelling in yet another victory. It is believed that he was so excited by victory that he even proposed to his now fiancé. Freedman has spent the off season looking at other ways to motivate himself. “Fantasy is becoming too easy for me. There is no effort or strain to win anymore and I have found it has become quite dull. Instead of player scouting and research, I have found a new hobby watching dwarf porn in the off season. I have found it to be extremely relaxing and there are now so many genres that I have been able to rack up thousands of hours without getting bored”. It seems that being at the very top is not all it’s cracked up to be, a challenge is quite clearly needed for Freedman. It has also been requested that his new found off season hobby is kept from Hillary. \nAlastair Livingston has spent his off season working on his trading skills. After years of being laughed out of the building for his valuations, he spent some time on a course to help him get those deals over the line. After months of reading, role playing and developing his skills he felt like he would get some good practice in after the Olympics. Holding a strong potential drafting position he decided he could use it to his advantage. He felt confident that he could get it right this time. He cast his mind back to all his training and offered Polak his pick....when asked what he wanted for his position in the draft...Livingston felt a sudden fuzziness in his vision, his head began pounding....he tried to resist temptation and regain his composure, remember all he had learnt and offer something fair that worked for both sides of the deal....but the pain was too much to bear and he couldn’t hold it in any longer . The anguish was finally relieved by a simple message ” YOUR SOUL!”. \nJamie Kay has spent his off season looking after his new baby. We caught up with him during the off season, “it’s been great having a baby. All that time taking care of a new born really gives you perspective in life. And I feel it is about time I win that belt again. Nothing has been right since I relinquished it and i must get it back”. Kay has been on a campaign in the press letting everyone know that if it were not for Freedman, he would be considered the GOAT. Now it is time to remind everyone why he is in that conversation. \nJosh Gaon comes off another semi plancey loss which has left him plancey negative once again. He was devastated as he was hoping to be plancey neutral for the arrival of his new baby. A lover of stats, we have unconfirmed reports that upon the arrival of his new baby, Gaon made it clear to the hospital and other families that his baby was statistically the best baby to have been born that day and whether they want to give him an award for super sperms or not he will forever claim to have the greatest of all time. \nSanford has had a wonderful off season being Miriam free. The move back to London all settled he will now be looking to rekindle that one season where someone else (allegedly) was setting his team for him. He now has something to build on having dodged miriamhood for the first time in what feels like a lifetime. We expect big things this season. \nSac has had a baby within 24 hours of the draft just like I did last year. If my season last year is anything to go by....enjoy a mediocre season Sac. As the leagues sole Israeli representative we commend him for drafting this evening amidst war and childbirth. Sac has a specific way of playing that usually results in a playoff berth and is more of a....Hey we are here, so why not us? Energy. We expect much of the same and a hearty mazel tov once again. \nPolak has spent the off season serving a prison sentence for cruelty to animals on the back of his Goat slaying incident last year with Tyler lockett. He is out now and is a changed man, but chasing a Plancey can do crazy things to you. Polak believes that this could be the year. \nMiriam Levey....how did it come to this. He has joined the list if champions to miriams and north Korea were not happy at all. Last years stud justin jefferson had to flee his summer holiday to North Korea due to a death sentence after his injury last year. Let’s hope autodraft can do him better this year.\nA hearty mazel tov to everyone \u003cThis message was edited>\n\n---"},{"id":33,"title":"2024 · REGULAR-SEASON REVIEW / Playoff opener ('One belt to rule them all')","year":"2024","text":"*Sent 12/12/2024*\n\n*One belt to rule them all….*\n\nThe fantasy playoffs have come around again and the questions all the fans want to know….just like the KC chiefs...is anyone good enough to topple the three time champion Saul Freedman. The regular season has been an interesting one: Even the North Korean propaganda machine can’t find anything to shout about regarding lev’s abysmal season as he became the first man to go 14-0 in the regular season. Sanford HQ is reeling after their franchise is taking another trip to the Miriam bowl. Despite numerous Miriam bowl losses, losing to the 14-0 Lev may be the worst of them all if it was to happen. Given the state of the bottom two teams this season, the playoff picture was sewn up quite early this season, but now the drama looks set to start. We begin our plancey post playoff picture with the four men looking to battle it out for a place in the semi plancey’s.\n\n \n\n*Josh Gaon – Plancey negative (-1)/ Miriam Positive (+1)*\n\nThere was a fear that the September trip to South Africa would leave Dr Gaon suffering from the fantasy curse that even derailed Saul Freedman’s season a while back. But surprisingly, Dr Gaon went on a great winning run to put himself out there as an early pace setter for the league. In fact upon return from South Africa, Gaon was so sure of himself and his team that every patient at his practice would leave with a, “I’m having a 16-0 day” sticker. As is generally the case with Dr Gaon, it is the over excitement that gets you and one loss turned in to more losses and Gaon was left staring at a mediocre regular season wondering what stat he could look at to make it all look good. Needless to say, there was no such fear that he would be in Miriam bowl contention but knowing Gaon he would have hoped for more from this season.\n\nWe went to meet with Gaon in a secret Saudi owned facility, with state of the art training equipment and conference rooms. “How do you like my new space? It came with my new Sleeper job... it has been quite lucrative…” We ask him how he feels about his season and where it is going, “Well to be honest I was hoping for more in the regular season but I think my guys have solid playoff match ups… in fact, if I could change my teams name they would be called “Sea of green””.\n\nAs we were walking and talking we go past “THE STATS OFFICE” and we ask a little about it, “I am so glad you asked, come lets take a look…” We walk in to what looks akin to a trading floor with over 100 people with 8 monitors infront of them. “This is the stats room where I have staff using every ounce of their brain power to find stats to show that I am in fact the greatest fantasy player of all time”.\n\nA staff member runs up to Gaon at that moment, handing him a piece of paper. Gaon turns to us, “Ah would you look at that, do you know who has the most cumulative points over the time of the plancey league for their 2nd bench spot….that’s right….this guy right here….I really am just the best”…..\n\n \n\n*Daniel Polak – Plancey Neutral*\n\nDaniel Polak has spent all year dreaming of being back in this position to finally get a victory in the playoffs after some time without one. Last year he faced eventual and perpetual winner Saul freedman where he was charged after the Tyler Lockett goatgate. After taking the offseason to collect his thoughts, he has gone again with the hope of finally getting hold of the belt that matters more than life itself. We went to visit Polak at the local spa retreat after his decision to give the players a full weeks rest prior to the week 15 match up. We are met at reception by a serene looking Polak in his bathrobe, “Please come through, make yourself comfortable, it is only me and my staff here”. After getting in to more comfortable spa attire we are asked to meet Polak in the jacuzzi.\n\n“Please come, relax, this is a full on relaxation zone. In fact you are lucky I allowed you in. I have banned all talk of football for the time I am here. But for the plancey post, I would do almost anything. Do you want anything to eat or drink….come let’s order something…..TYLER!!!!”…out of the steamy corridor comes a sheepish Tyler Lockett in an Apron, “Yes Master, how can I be of service?”\n\nPolak glances towards us, “Ah yes, my boy Tyler hasn’t quite been the same since the old incident this time last year…He is staying by my side whilst we can rehabilitate him back to his old self…now, what would you like to eat or drink…Tyler will gladly take your order”. Tyler is visibly shaking at this point as he looks at us doe eyed. We explain that we do not want anything to eat. Polak then asks us whether we want to get in to the jacuzzi with him, “Please guys you look so uncomfortable!” When we turn down the offer Polak climbs down, “Fair enough, no worries, at least put your feet up….TYLER!” In an instant Tyler Lockett pull off a quick spin move and dives down at our feet, arching his back to allow us to put our feet up on his bent over body. When we again refuse the offer Polaks slams his hands down and bellows, “You see what you have done Tyler! You have scared them, you fool! Get out of here before I make an example out of you!” Lockett looking noticeably upset scurries away through the steamy spa and out of sight.\n\nPolak continues as if nothing had happened, “I really believe I have an opportunity this year. We have built a strong outfit and I feel I have a point to prove this year”.\n\nIt was only once we left the premises that we informed the authorities of Tyler Lockett’s whereabouts and condition and he has since been found and Polak is currently under investigation, he has declined to comment.\n\n \n\n*Jamie Kay – Plancey Positive (+1)*\n\nThey say that this game can send you wild and make you question your sanity and this sentiment is true for our next playoff contender. Jamie kay has spend some time in a rehabilitation facility to give his mind a break. The reason for this stint was due to what occurred one fateful night in the Kay household.\n\nThe rumours are that Nat could hear weeping in the middle of the night coming from downstairs and noticed Jamie was no longer asleep next to her. Nat crept downstairs to ensure she didn’t wake the baby not sure what she was going to find. The scene she was met with remains engrained in her mind to this day. There was writing all over the wall in what can only be described as Kay’s blood and faeces “272 attempts, 1459 yards, 67 receptions, 564 yards, 14 rushing touchdowns, 7 receiving touchdowns”\n\nAs Nat turned in to the lounge she was met with a naked Jamie rocking backwards and forwards in his lounge mumbling to himself and repeating over and over, “272 attempts, 1459 yards, 67 receptions, 564 yards, 14 rushing touchdowns, 7 receiving touchdowns”.\n\n“Jamie?” Nat inquires, but he continues to rock back and forward mumbling…..“272 attempts, 1459 yards, 67 receptions, 564 yards, 14 rushing touchdowns, 7 receiving touchdowns”.\n\n“JAMIE” she shouts, causing Jamie to stop and turn his head towards her. He looks at her and begins sobbing and howling, “They said he was going to be ok! They said he was coming back stronger than ever”.\n\nWe are glad that Jamie has got the help he needs as he looks to solidify his place as one of the greats. We can confirm he has stopped mumbling Cmc’s 2023 stats. We went to visit him at his facility and he told us, “I cannot understand all this GOAT talk regarding Saul. I should be right up there with him. I have consistently made playoffs and finals, won a plancey…it should be me!”\n\n \n\n*Sac – Plancey Positive (+1)*\n\nSac has had so many things to contend with this season, given the War and Childbirth, he has stated that is lovely to be able to have the stability of knowing that he will finish the regular season with a record of 7-7.\n\nSac has always represented Israel in the group with pride and has often be treated like Israel throughout the world. This was never more the case than when our very own commissioner made his feelings on a podcast very clear about Sac. Nevertheless, Sac will always be an ever present member proving that mediocrity in the regular season does not stop you from a shot at winning it all.\n\nSac has become more and more vocal regarding injustice in the league and has found a partner in crime in Dan Polak as they look to argue the case for the “little guy” against the more influential franchises in the league. We went to see Sac as he heads in to another playoff run, “I know some people have made their feelings clear regarding my participation in the league, but my boys and I stick two fingers up at them and show them my plancey positive card”.\n\nWe sat down with Amon Ra St Brown to discuss what life was like under Sac’s rule, “It is quite an interesting dynamic in the regular season. Every Thursday evening Sac gets us together and he points up at a framed 7-7 he has plastered above the whiteboard and says to us….go out and try your hardest….but not too hard….but lets win…but sometimes not…It is mighty confusing. And now we have been asked to go and win 3 games in a row which is quite a tough thing to achieve when the team has built its identity on winning half our games.”\n\nSac heard of the quotes from his star man and said, “Look if he can’t take the heat he needs to get out the kitchen. This is the playoffs, the regular season is for losers this is where champions are made…this is where we you achieve plancey positivity….I have no time for those who find my methods confusing….it is now win or go home and against Gaon this week I am going to show him why its nice to have me in the league”.\n\n \n\n*Kay vs Polak*\n\nThis is a possible revenge game for Polak as he looks to avenge the Kamara bloodbath of Kay’s Plancey winning year. This is the playoffs and despite Kays loss of Cmc he still has a team that can do serious damage.\n\n \n\n*Sac vs Gaon*\n\nWhilst it may be “nice” to have Sac as part of the group he will be pulling no punches against Gaon this week as both battle it out to try and solidify a place in the semi planceys. Saul freedman has stated that he may have another poem ready for Gaon if he can make it through this week.\n\n \n\nA hearty mazel tov to all\n\n---"},{"id":34,"title":"2024 · Semi-Plancey preview","year":"2024","text":"*Sent 20/12/2024*\n\nOne step away from the lights of the plancey bowl…it is time for the semi planceys with some blockbuster match ups coming our way this weekend. We welcome our bye weekers to the playoffs after a nice week off and we also had a first ever “pick who you play” scenario.\n\n \n\n*Saul Freedman BSc GOAT 3x Plancey Positive*\n\nSaul freedman has been taking time off in the bye week to rest and recuperate as he bids for an unprecedented 4th Plancey. He knows, more than ever he has a target on his back and he has come back this season winning the regular season league and looking almost stronger than ever.\n\nKnown for throwing wild parties and treating his team, Freedman has taken the team back to Ibiza to get ready for the playoffs and was pictured drunk on stage with David Guetta showering the adoring fans with champagne.\n\nWe went out to Ibiza to have a chat with him and were asked to join him at the O Beach Pool party where Saul was sitting in a luxury canopy next to Sam Darnold and Taysom Hill (with his knee in a brace) having a shisha looking as relaxed as can be. Saul gives us a knowing look, “How do you like my boys, I pick them up off the street and infuse them with fantasy points. Before they know it they are hitting their fantasy point ceiling”.\n\nTaysom Hill pulls himself up by his crutch and asks if anyone wants a drink from the bar. Pulling himself along he stops next to us and bends over and quietly says, “I owe everything to Mr Freedman so no funny business with your questions today”.\n\nWe look over to the left of the tent and there are 4 bikini clad women, 3 of them holding replica plancey belts. Freedman notices our stares and explains, “Ah yes these lovely ladies follow me everywhere I go holding my silverware. You may be wondering why the fourth is not holding a belt….that could be for two reasons….one, she is awaiting the 2024 belt or two, she is there as a reminder of when the whole league fucked me after the Hamlin injury and it lets me know that I must show no mercy to win as many championships as possible”.\n\nAsked whether he feels he has any rivals this season that could take his crown, he shrugged his shoulders and said, “rivalry is not in my vocabulary. I have no rivals. My only rival is myself in past seasons”. This answer does nothing to dispel the rumours that Freedman is looking to join a new 8 man league where he takes on the managerial role of all 8 teams in a move that he has said will increase competitiveness.\n\n \n\n*Alastair Livingston 1x Plancey Negative/ 1 x Miriam Positive (pre season friendly winner pre league inception)*\n\nAlastair Livingston is in the all too familiar position as favourite for the plancey. But being favourite does not get you the belt as he knows all to well.\n\nWith his team firing on all cylinders, he has been a tough match up for all involved scoring a beastly amount of points on his way to the bye week.\n\nWe met up with Livingston to talk a little bit about his season, “It has been a great season, much better than Polak’s season it has to be said”. We pressed him further asking him what it was like to beat each player consecutively during the regular season and he responded, “It felt great, I bet Polak didn’t do that this season. Make sure you tell Polak I did that…I am invincible”. It couldn’t be clearer that Polak has not paid one solitary dollar of rent to live in Livingstons head and it is definitely getting to him. What is clear is that Livingston is in a no win situation here. Getting to the plancey bowl should be expected after his excellent regular season, but a loss to Polak would be something that he couldn’t live with.\n\nAs we continued the interview with Livingston, we could see him constantly looking at his phone, “Just checking the algorithm, in the last 2 minutes we have been talking my team’s power ranking score have gone from a 100 to 99”. We decide to quickly head for the exit as Livingston picks up a baseball bat and starts smashing every piece of furniture in sight.\n\n *Freedman vs Gaon*\n\nIn typical Gaon fashion, he has finally won a playoff game for some time, in the most dramatic of fashions in must be said, only to now have to face the man that has beaten him in the semi planceys three years in a row. It felt like destiny after having inputted the new rule of the top team choosing their opponent, in the hope that he would have the choice and avoid facing Freedman, but it wasn’t to be. Gaon, Freedman and semi planceys will forever be intertwined and if you believe in the law of averages, this is not the match up for you because there has only been one winner.\n\nFreedman became the first man to get to pick his opponent for the semi planceys and despite having the choice of three, when Gaon made it through his first round there was only one man to pick. After last years Ode to Gaon, everyone is wondering what Freedman will do after this years victory.\n\nGaon on the other hand knew this day was coming and has set himself up early in the knowledge that he would come up against Freedman and likely lose on his way to the Plancey Bowl. But there is definitely an opportunity to get a victory, especially after a mediocre night from Sutton last night has put the tie back in the balance.\n\n \n\n*Polak vs Livingston*\n\nThis is the match up the fans have been waiting for….These two have been at eachothers throats all season and now they will fight to get themselves a shot at superstardom. Two men will walk in and only one man will walk out and on to the plancey bowl.\n\nWe took a walk around Finchley with Dan Polak to discuss this weeks match up. “I am extremely excited at the prospect of this semi plancey. I have been waiting some time for it and I feel ready for whatever comes of it.” He then stops in his tracks, “ hang on just one second….how fast can you run?”\n\nWe explain that we can move a bit and Polak says, “Ok follow me”….Polak then walks us up to a front door and says, “get ready to run”. Within seconds, Polak has knocked on the door and ran a mile down the road. We follow quickly and as we look back we can see an angry Livingston gesturing towards us, “stop knocking on my door at all hours of the day Polak!!!!”\n\nA run turns in to a brisk walk as Polak sniggers, “between Tyler Lockett and I, we have knocked and run on his door 250 times in the last week. We have a few other things planned this week including letting the Palestinian Solidarity Campaign know that Benjamin Netanyahu is secretly sleeping over at Livingstons house resulting in a planned camp site outside his door”.\n\nIt seems Polak will use everything in his arsenal to put Livingston off and it seems only fair given he is facing what fans arguably believe is the favourite to win their first ever Plancey after a dominant display in the regular season.\n\nLivingston will hope he can finally get himself over the line after a number of heartbreaking losses after dominating the regular season. Fans have questioned whether he is the right man to get them over the line and to the promise land of planceydom.\n\nA win against Polak this week will put many of those fears to rest.\n\n---"},{"id":35,"title":"2025 · REGULAR-SEASON REVIEW / Playoff opener","year":"2025","text":"*Sent 11/12/2025*\n\nHere we are, back at the pinnacle of sporting excellence, the Plancey playoffs 2025 and the season has not disappointed. \n\nThe regular season has had some record performances, a score correction victory and wins by the smallest of margins.\n\nFantasy football has once again taken over 8 franchises (possibly 7 and a half/quarter) lives for yet another season and the question has to be whether anyone has it in them to break the dominance of the Freedman.\n\n\nBefore we jump in to the playoff franchises and match ups we just want to make special mention to Rabbi and Miriam Plancey who recently passed. They are the cornerstone of this fantasy football and we will make sure their memory lives on for many years to come in our own weird way. May their memories be a blessing. \n\nThis week is the quarter plancey’s with some really exciting match ups.\n\n*Sanford (Very Plancey negative) v Jamie (Plancey positive)*\n\nSanford Plc has hit this year’s targets and they hit them early. Having many a fantasy heartache, Sanford built his season on a strong foundation of 5 wins from the first 5 games. From that position it was almost an impossibility for another season in the Miriam bowl and once that box was ticked, Sanford and his team went on a rest of season long hiatus as the playoffs drew closer.\n\nSipping on a pina colada in Vegas, Sanford was asked by an interviewer at his sun lounger if he should not probably get back to manage the day to day operations at the team and he responded with the following, “Have you been on the sleeper app? Have you seen that green tick next to my name? my job is done here. I will be back for the post season”.\n\nDespite being 3-6 in his last 9 games, a big confidence boosting victory vs the no1 seed to see out the regular season will leave him flying high going in to the big quarter final match up.\n\nSanford will be raring to go also boosted by relinquishing the Miriam name that has stuck to him like glue over recent years. Playoff berth has allowed him to move on and he will be looking to go on the long road to plancey positivity….\n\n\nFor years and years the Plancey post has lauded Jamie Kay and his ability to fix his teams issues to ensure he always has a part to play in the right bracket of the post season. \n\nThis season all was not well at Kay HQ. Sitting at 1-8, nobody could quite understand how it all went wrong. Rumours of player unrest was swirling around the fantasy universe. Having been on IR for much of the season, Omarian Hampton came through the mixed zone after yet another loss and let rip on the head coach and his tactics. “This is my first season in the nfl, I went on IR and Jamie hasn’t said one word to me since. I feel completely let down and none of the boys understand any of the tactics that he is throwing out there. I can’t believe I am going to be playing in the Miriam Bowl in my first season”.\n\n\nKay had caught wind of the interview and it lit a fire under him. \nThe next day as the team were sat around in the lecture theatre to watch film, Kay calmly quietens the room, “Lads, we are 1 and 8. If we want any chance of making the playoffs we have to win all our final 5 games. I need everyone in this room together in the fight otherwise we will could potentially lose the worst loss in all of sports. I am not ready to be Miriam and I don’t want that for any of you in this room”.\n\nKay then stops for a moment and turns to Omarian Hampton, “Hampton! Stand up please!” Looking confused, Hampton stood up. Kay continues, “Please come down here next to me”. \nHampton, still in his walking boot carefully makes his way to the front. “As I was saying. To make it to the playoffs I need everyone with me. Standing next to me is a man who I do not want to be in the trenches with. This is a man that talks about internal information to the press. This is not a team mate, this is a man who is ready to tear us down at our weakest moment. I have been in this league over 10 years, I have taken teams from the depths before and I have even had the pleasure of holding the belt aloft in front of the world. What about you, Hampton?”.\n\nHampton stood there, speechless. You could feel the tension building in the room.\n\nKay turns and moves towards Hampton, “I am a believer in this team. You are trying to bring us down and I will not have it. Who do you think you are talking about this team”. \nYou could feel the level of support building around the room for Kay. The players were beginning to believe again, nodding and murmuring along with Kay.\n\n“I am trying to build a winning team and I have no time for people like you in this team”.\nWithin a split second, Kay twists his hips and round house kicked Hampton in the head, instantly knocking him out.\n\nThere was a gasp of silence as Kay stands over the unconscious running back, “You’re traded”.\n\nThe whole room erupted and from that moment on the team has gone on an unforgettable run of 5 wins in a row culminating in a dramatic victory over fellow relegation rival Sac.\n\nThis match up has everything we could ask for, a possible fading 2025 force vs a team on an absolute high from a 5 game winning streak to make it in to playoffs. Both teams have met their season objectives, one had it wrapped up early the other on the final day of the regular season. Can they now pick their teams up to go again and get themselves a place in the semi plancey’s only time will tell.\n \n*Gaon (Plancey negative) vs Saul (Very Very Plancey positive)*\n\n\nPlancey Negative Gaon has once again created a file of all the stats that will tell you he has had the best team this season. \nBut he will need everything in his arsenal to fend off the GOAT this week in another epic match up for the ages.\n\nGaon has built the majority of this season on having built a WR farm whereby he held the majority of the top 15 WR’s in his stable. Unfortunately he could only play four at one time.\n\nGaon will do anything to ensure that he gets a win this week having had many a playoff loss to Saul Freedman. So much so he has resorted to copycat rituals that didn’t even work.\n\nWe were invited to come and visit Josh Gaon at his place in the country where the team were getting ready as he had told us he was performing the Goat slaying rituals that Polak had tried previously. He had sent us a message to let us know, “Polak had got it all wrong and that the only way these rituals work is if you have the opponent present at the ceremony”. \n\nTherefore we hitched a ride in a van to the country with Saul Freedman to the countryside to go to the ritual.\n\nOn the journey we were able to have a conversation with Freedman, “I love watching my opponents squirm, it is the most enjoyment I get out of fantasy having won the belt so many times. However, nothing is more enjoyable than watching Gaon squirm. I couldn’t miss this opportunity”.\n\nWe asked him about the season, “Look it hasn’t been my best season and it could be difficult to three peat but then when I look at the chumps I have to play against it gives me belief that I can do it again. Losing Nabers was unhelpful but my guys can do it on their day.”\n\nWe finally arrive at the farm where Gaon has been there waiting for us, holding and stroking a Goat in his hand.\n\n “Welcome friends, we have been waiting for you”, Gaon has that maniacal smile on his face that says he hasn’t slept in days and it wildly overthinking the match up.\n\nWe park up and make our way out of the van. Freedman requests Gaon gets some of his men to help him with the van. As we walk around the corner Gaon’s whole team are in a circle surrounded by what must be 30 goats.\n\n“What do you think? Bought these all from Polak, vital for the ceremony, you see. We will start the ceremony as soon as Saul and my men get what he needs out his van.”\n\nAt that moment freedman walks around the corner, Plancey belt over his shoulder and 4 of Gaon’s men carrying a large gaming style chair. They set it down in the corner of the field and Saul sits himself down, “Had to bring my cuck chair with me”.\n\n\nGaon, looking frustrated and incensed turns away, “It is time to get going with the sacrifice”.\n\nWe began having flashbacks of Tyler Lockett slaying the goat in previous years.\n\nGaon walks over to the tools table and picks up the chainsaw and revs it up. “Right who will be the man to perform the sacrifice for me”. He walks around his team, who all look completely perplexed.\n\nGaon stops at Joe Burrow. Burrow starts shaking, “Please Josh, don’t make me do this”.\nGaon calmly says, “But Joe, it must be you. You are the one”.\n\nSaul sniggers in the corner, in disbelief in what he is actually watching.\n“Quiet you!” Gaon screeches. “Just sit and watch. Do not take your eyes off this and SHUT UP”.\n\nGaon turns back to Joe Burrow and hands him the chainsaw, “Right lets get a move on!”\nBrown and Chase are now holding the sad Goat with Saul’s name written on it. Joe Burrow has tears streaming down his face. He starts walking with Gaon towards the poor goat and in an instant drops the chainsaw on the floor and starts running the other way.\n\nGaon yells, “GET HIM!”.\nJustin Jefferson runs and catches up with Burrow, grabbing him. Burrow reluctantly submits.\n\nGaon snorts, “Well done JJ, that may your first catch since you joined this team, you cretin!”\nBurrow picks up the chainsaw and assumes position. Gaon gets closer to him as he revs up the chainsaw.\n\nGaon whispers in his ear, “I have been waiting for you all year Joseph. You were born for this and now we must exorcize our demons before we play the GOAT this weekend if we are going to have any chance”.\n\nBurrow nods, his face drenched in tears as he moves towards the helpless goat…..\n \nA hearty mazel tov to all and looking forward to another fantastic week of quarter plancey action.\n\n---"},{"id":36,"title":"2025 · Semi-Plancey preview","year":"2025","text":"*Sent 19/12/2025*\n\nWelcome back everyone to the Plancey post where we are at the semi plancey’s stage of the competition.\n \n*Saul v Ally*\nOur first semi plancey takes us to a replay of last years Plancey Bowl where Livingston is trying to take on the might of Freedman to try and stop him in his tracks to threepeat.\n\nAfter another playoff victory, Freedman was feeling good about his chances in the press conference, “Another weekend, another playoff victory. There is no one in this game that can stop me.”\n\nIt was at that moment Gaon burst in, gun in hand, pointing it towards Freedman. The whole room goes silent.\n\n“Listen, nobody has to get hurt. I am in a bad place, but nobody has to get hurt”.\nGaon begins talking to Freedman, “Listen, you win, again, fair and square and destroy another season for me. But please, no silly anecdotes at my expense, no short quips about my fantasy skills and please no Ode to Gaon”.\n\nFreedman, looking like a man who is calm in the situation but understands that he is dealing with an instability.\n\nFreedman stands, “Look Josh, you don’t have to do this. There is still next year and you have about 30 other leagues you can try and win.”\n\nGaon shouts, “BUT THIS IS THE IMPORTANT ONE AND YOU KEEP RUINING IT FOR ME!”\n\nFreedman starts to walk towards Gaon, “I know and it isn’t my intention to have so much fun at your expense. But look I promise I won’t utter one more word about you”.\nGaon starts to come to, “I appreciate that but I need guarantees. I want you to hand it over”.\n“Hand what over?”\n“Just hand it over so I can be sure”.\n\nFreedman, still with the gun pointed in his direction admits defeat and puts his hand in his pocket where a folded A4 sheet of paper with the title “Ode to Gaon 2.0”. He hands it over to Gaon, who snatches it out of his hand and then frantically runs for the exit where he is met by security and law enforcement.\n\nThe press conferences and media weeks leading up to the semi plancey’s have been held in Vegas and Freedman was making his way through Caeser’s Palace casino after the press conference as he was making his way to his next TV interview where he was stopped by a cluster of green and white all shouting profanities his way.\n\nThe mob was shouting, singing and dancing at the top of their lungs about Henrik Larsson.\nAs Freedman tried to walk away a shirtless man fell out of the crowd and fell right in front of Freedman.\n\nThe shock on Freedman’s face when he realised it was Alastair Livingston his opponent for the week.\nFreedman bent down to help him up and Livingston whispered in his ear, “I am really sorry about this, they are so rowdy and have been drinking and forcing me to drink all day and I can’t keep up it is killing me. When I get up I am going to pretend to try and fight you”.\n\nAs Freedman helped Livingston, Livingston pushed him in the chest and shouted, “You are mine this week Freedman, I am going to get my revenge for last years final”.\n\nThe Celtic mob behind Livingston cheer and scream behind him. Freedman’s security detail alongside Caeser’s palace security create a wall behind Freedman. You could cut the tension with the knife.\n\nAll of a sudden a casino chip comes flying out of the Celtic fans and knocks Freedman on the side of the head. In that moment the two sides run towards each other creating havoc. Fists are flying, chairs thrown across the casino and glasses smashed everywhere.\n\nFreedmans security detail jump on top of him and cover him to safety out of the hotel and in to a cab. Livingston, a drunken mess, stumbles to his feet and shouts towards the cab holding Saul, “I will get my revenge… in this life or in the next!” before puking all over the reception floor of Caesers.\n \n*Sanford v Polak*\n \nWe are back in the Love Island Villa where we the couples have been split up in the famous CASA AMOR villa whereby they test the strength of the couples that had previously been created. We get back to the action where Maya Jama is talking to Sanford,\n“Benjy, you have had quite a time of it this year. Let’s recap, before CASA AMOR you were coupled up with Mike Evans. You had a beautiful relationship and were probably one of the strongest couples in the villa. What has happened since then”.\n\n“Well Maya, Mike and I were completely in love, yes he had some niggling injuries but I could get past that. I was looking forward to having a fantastic season with him all the way to the end. But then I was sent a video from CASA AMOR showing Mike in bed with someone else and him falling out bed and hurting what looked like his collarbone? That was all too much for me and I thought I had to keep my options open”.\n\nMaya interjects, “Yes and you have become known as a bit of a player in the villa now, even prior to Mike you dropped Olave just like that. But you have had relationships with a whole host of other men in your search for the right match. We have had flings with Tre Tucker, Wilson and even a weird one night stand with Jalen Nailor”.\n\n“Yes, yes I have had an interesting time looking for my Mr Right”.\nMaya continues, “Well as you know Benjy, with CASA AMOR, we will be bringing Mike back to the villa but before that we need to know if you have decided to couple up with someone new or stay true to your boy and see if he wants to continue to be a couple”.\n“Well Maya, as you have said, I had kissed a few frogs, but I received word that Mike is fit and ready to go and therefore, I have chosen to not couple up with anyone new and stay true to Mike”.\n\n“That is lovely Benjy, And now it is time to see what Mike has chosen to do….Mr Evans?”\nAt that moment Mike Evans swaggers back in to the villa. Sanford turns his head hopefully, ready to jump back in to the arms of his boy. But his face has turned white and his mouth is now wide open.\n\nMike Evans waltzes in walking hand in hand with Daniel Polak.\n\nThey stop in front of Maya, “Wow Mike I think we are all surprised that it looks like you have chosen to recouple”.\n\nSanford has his head in his hands, “I waited for you Mike. I waited all this time for you. How could you do this to me. We were supposed to win this together and now you have gone with HIM!”.\n\nPolak has a smug look on his face, “You snooze you lose and now I get to cozy up with Mike Evans as we take you on in the semi Plancey’s”.\n\nTears are streaming down Sanford’s face as he runs towards Mike Evans and slaps him across the face, “How dare you do this to me. This is not over!”\nAs Sanford runs off towards the bedrooms, he takes his phone out of his pocket and dials a number and you can hear him screaming “Orleans? Is that you? It’s happened again”.\n\n\nA   *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:#090d18;-webkit-font-smoothing:antialiased;overflow:hidden;}
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:#24344e;border-radius:3px;}
  @keyframes ld-pulse{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
  .ld{display:inline-block;width:7px;height:7px;background:#6366f1;border-radius:50%;margin:0 2px;animation:ld-pulse 1.4s infinite ease-in-out both;}
  .ld:nth-child(2){animation-delay:.2s}.ld:nth-child(3){animation-delay:.4s}
  .md-table{border-collapse:collapse;width:100%;font-size:13px;background:#0f1625;border-radius:10px;overflow:hidden;}
  .md-table th{text-align:left;padding:9px 12px;background:#090d18;color:#f59e0b;font-weight:800;text-transform:uppercase;font-size:10.5px;letter-spacing:0.07em;border-bottom:1px solid #24344e;white-space:nowrap;}
  .md-table td{padding:8px 12px;border-bottom:1px solid #1a2640;color:#e8f1ff;}
  .md-table td:first-child{font-weight:600;}
  .md-table tr:last-child td{border-bottom:none;}
  .md-table tbody tr:nth-child(even) td{background:rgba(99,102,241,0.04);}
  .chip{background:#1a2640;border:1px solid #304260;color:#e8f1ff;border-radius:20px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .15s,background .15s;}
  .chip:hover:not(:disabled){border-color:#6366f1;background:#232e50;}
  .chip:disabled{opacity:0.4;cursor:default;}
  .send-btn{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:12px;padding:0 18px;font-weight:700;font-size:12.5px;letter-spacing:0.8px;text-transform:uppercase;cursor:pointer;align-self:stretch;flex-shrink:0;}
  .send-btn:disabled{background:#1a2640;color:#3d5470;cursor:default;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;background:transparent;border:none;cursor:pointer;position:relative;}
  .nav-btn .nav-ico{font-size:20px;}
  .nav-btn:not(.active) .nav-ico{filter:grayscale(0.7) opacity(0.5);}
  .nav-lab{font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;}
  .plaincy-app{display:flex;flex-direction:column;height:var(--app-h,100dvh);width:100%;max-width:560px;margin:0 auto;background:#090d18;overflow:hidden;}
  @media(min-width:640px){.plaincy-app{max-width:780px;}}
  .rt-wrap{overflow-x:auto;margin:8px -4px 0;}
  .tw-card{background:#0f1625;border:1px solid #24344e;border-radius:12px;padding:10px 12px;font-size:13px;color:#e8f1ff;}
  .tw-head{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .tw-toggle{background:none;border:none;color:#f59e0b;font-weight:800;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;padding:0;text-align:left;}
  .tw-rb{background:#1a2640;border:1px solid #304260;color:#e8f1ff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .tw-body{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
  .tw-game{line-height:1.5;}
  .tw-k{color:#6e8db0;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin-right:4px;}
  .tw-dim{color:#6e8db0;}
  .tw-table{margin-top:6px;}
  .tw-table td,.tw-table th{padding:5px 8px;}
  .rb-panel{position:absolute;inset:0;z-index:5;background:#090d18;display:flex;flex-direction:column;}
  .rb-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #24344e;background:#0f1625;color:#e8f1ff;}
  .rb-head select{background:#1a2640;color:#e8f1ff;border:1px solid #304260;border-radius:8px;padding:5px 6px;font-size:13px;max-width:44%;}
  .rb-list{overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
  .rb-item{background:#0f1625;border:1px solid #24344e;border-radius:10px;padding:9px 11px;}
  .rb-label{color:#f59e0b;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
  .rb-row{font-size:13px;color:#e8f1ff;line-height:1.5;overflow-wrap:anywhere;}
  .rt td,.rt th{white-space:nowrap;}
  .rt-more{font-size:11px;color:#6e8db0;margin-top:4px;}
  .res{display:inline-block;min-width:18px;text-align:center;border-radius:5px;padding:1px 5px;font-size:11px;font-weight:800;}
  .res-W{background:rgba(16,185,129,0.18);color:#10b981;}
  .res-L{background:rgba(248,113,113,0.18);color:#f87171;}
  .res-T,.res-x{background:rgba(110,141,176,0.18);color:#6e8db0;}
  button{font-family:inherit;}
  textarea,select{font-family:inherit;font-size:16px;}
  textarea:focus,select:focus{outline:none;}
  select option{background:#141e32;color:#e8f1ff;}
