name: Refresh League Data

on:
  schedule:
    - cron: "0 8 * * *"   # daily 08:00 UTC
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commit refreshed data back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Data fetches — season auto-detected, falls back to previous year in off-season
      - name: Fetch history (all seasons + positional breakdown)
        run: node scripts/fetch-history.js

      - name: Fetch rosters (most recent season with players)
        run: node scripts/fetch-rosters.js

      - name: Fetch stats (most recent season with games)
        run: node scripts/fetch-stats.js

      - name: Fetch FantasyCalc trade values (trimmed)
        run: node scripts/fetch-fc-values.js

      - name: Fetch trade history (Sleeper trades)
        run: node scripts/fetch-trades.js

      # Assemble the template from its partials (source of truth) and fail if the
      # committed monolith drifted from them.
      - name: Assemble + verify template
        run: |
          node scripts/build-template.js
          node scripts/build-template.js --check

      - name: Build lore index
        run: node scripts/build-lore.js

      # The ONE fact table every record/standing/streak/H2H derives from.
      - name: Build fact table (games.json)
        run: node scripts/build-facts.js

      - name: Build all-time aggregates (from the fact table)
        run: node scripts/build-alltime.js

      # Paste-in artifact (legacy target, 200 KB budget).
      - name: Build commissioner.jsx
        run: node scripts/build-artifact.js

      # Dev tooling: esbuild for the HTML bundle, Babel/React/jsdom for the render
      # gate. Test + bundling only — the fetch/build-data scripts stay zero-dep.
      - name: Install dev tools
        run: npm install --no-save @babel/core @babel/preset-env @babel/preset-react react react-dom jsdom esbuild@0.24.2

      # Published-artifact target: one self-contained page with all data inlined.
      - name: Build dist/plaincy.html
        run: node scripts/build-html.js

      # Validate the data contract before publishing — a failure aborts the run
      # so structurally-wrong data (e.g. a truncated season) is never pushed.
      - name: Validate generated data
        run: node scripts/validate.js --fresh

      - name: Test game status + in-progress season rules (DR-3/DR-4)
        run: node scripts/test-status.js

      - name: Test fact table (DR-5 independent recompute)
        run: node scripts/test-facts.js

      - name: Test question engine (QR-1..3, UR-7 engine)
        run: node scripts/test-questions.js

      - name: Test aggregation math (golden)
        run: node scripts/test-alltime.js

      - name: Test artifact structure (FR/TR incl. TR-12)
        run: node scripts/test-artifact.js

      - name: Test artifact render (user journeys incl. UR-7, UR-8)
        run: node scripts/test-render.js

      # Only commit when real data changed. Every run rewrites meta.generated /
      # BUILT_AT timestamps, so ignore those lines — otherwise the off-season
      # would commit daily no-op churn (this repo had 55 such commits).
      - name: Detect real data changes
        id: changes
        run: |
          if git diff -- docs/ \
               | grep -E '^[+-]' \
               | grep -vE '^(\+\+\+|---)' \
               | grep -v '"generated"' \
               | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Real data changes detected — will commit."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only timestamps changed — skipping commit."
          fi

      - name: Commit updated data and artifact
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json docs/lore/*.json docs/.nojekyll commissioner.jsx dist/plaincy.html
          git commit -m "chore: refresh league data + rebuild artifact [skip ci]"
          git push
