name: Test

# Runs the full quality gate on CODE changes (not just the daily data cron), so a
# template or script edit that would break the artifact is caught on the PR/push —
# the "template drift" guard. The daily refresh.yml runs the same gates on data.
on:
  push:
    branches: [main]
    paths:
      - "commissioner.template.jsx"
      - "template/**"
      - "scripts/**"
      - "league-config.json"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "commissioner.template.jsx"
      - "template/**"
      - "scripts/**"
      - "league-config.json"
      - "package.json"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The template is assembled from template/ partials — fail if the committed
      # monolith drifted from them (someone hand-edited commissioner.template.jsx).
      - name: Template in sync with partials
        run: node scripts/build-template.js --check

      # Dev tooling (test + bundling only; the data pipeline stays zero-dep).
      - name: Install dev tools
        run: npm install --no-save @babel/core @babel/preset-env @babel/preset-react react react-dom jsdom esbuild@0.24.2

      # Rebuild derived tables + both artifacts from the CURRENT template/scripts,
      # so the gates run against exactly what this change would produce.
      - name: Rebuild derived data + artifacts
        run: |
          node scripts/build-lore.js || true
          node scripts/build-facts.js
          node scripts/build-alltime.js
          node scripts/build-artifact.js
          node scripts/build-html.js

      - name: Data contract
        run: node scripts/validate.js

      - name: Game status + in-progress season rules (DR-3/DR-4)
        run: node scripts/test-status.js

      - name: Fact table (DR-5)
        run: node scripts/test-facts.js

      - name: Question engine (QR-1..3, UR-7 engine)
        run: node scripts/test-questions.js

      - name: Aggregation golden test
        run: node scripts/test-alltime.js

      - name: Artifact structure (FR/TR incl. TR-12 dist/plaincy.html)
        run: node scripts/test-artifact.js

      - name: Artifact render (user journeys incl. UR-7, UR-8)
        run: node scripts/test-render.js
